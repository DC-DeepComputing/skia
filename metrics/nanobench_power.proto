syntax = "proto2";

package perfetto.protos;

import "protos/perfetto/metrics/metrics.proto";

message NanobenchResult {
  optional string test_name = 1;
  optional string rail_name = 2;
  optional double power_mws = 3;
}

message NanobenchResults {
  repeated NanobenchResult nanobench_result = 1;
}

extend TraceMetrics {
  optional NanobenchResults nanobench_power = 450;
}