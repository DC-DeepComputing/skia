id: pathops/copy-path-builder-directly-without-snapshot
title: When storing or copying an SkPathBuilder into an SkPathBuilder container or variable, copy or move
  the builder directly instead of calling snapshot()
polarity: dont
severity: should_fix
rubric: safety
rule: When inserting, copying, or assigning an SkPathBuilder into a container or variable of SkPathBuilder,
  copy or move the builder instance directly. Do not call .snapshot() or construct an intermediate SkPath
  when the destination expects an SkPathBuilder.
why: SkPathBuilder provides default copy and move constructors that copy internal verb and point buffers
  directly. Calling .snapshot() allocates an immutable SkPath (along with ref-counted heap storage like
  SkPathRef), and converting from SkPath back to SkPathBuilder replays all verbs, incurring unnecessary
  heap allocation and redundant verb processing overhead.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Materializes an intermediate SkPath, allocating heap storage and replaying verbs.
  fPartials.push_back(fCurrent.snapshot());
  ```

  Good:

  ```cpp
  // Good: Copies the builder directly using its copy constructor.
  fPartials.push_back(fCurrent);
  ```
include_glob:
- src/pathops/**
triggers:
- \bpush_back\s*\(\s*fCurrent\b
- \.(?:push_back|emplace_back)\s*\([^)]*\.snapshot\s*\(
- \bSkPathBuilder\b[^=;]*=[^;]*\.snapshot\s*\(
- \b(?:TArray|STArray|std::vector)<\s*SkPathBuilder\s*>
- \b(?:push_back|emplace_back)\s*\([^)]*\b(?:builder|pathBuilder|partial)\b
confidence: 0.9
support_cl_count: 1
