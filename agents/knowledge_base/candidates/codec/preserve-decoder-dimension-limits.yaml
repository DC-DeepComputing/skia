id: codec/preserve-decoder-dimension-limits
title: When configuring image decoder options or bridges, do not override dimension limits to unbounded
  values like usize::MAX; preserve library defaults or format bounds
polarity: dont
severity: should_fix
rubric: safety
rule: When configuring third-party image decoders or codec FFI bridges, do not override decoder dimension
  limits to unbounded values (such as usize::MAX or SIZE_MAX). Retain the decoding library's default limits
  or enforce format-specific bounds (such as JPEG's 64K limit) to prevent resource exhaustion from untrusted
  inputs.
why: Image decoders process untrusted input streams. Overriding dimension limits to unbounded maximums
  disables the underlying library's protections against decompression bombs and excessive memory allocation,
  exposing the host process to denial-of-service vulnerabilities.
examples:
- |-
  Bad:

  ```cpp
  let options = zune_core::options::DecoderOptions::default()
      .set_strict_mode(false)
      .set_max_width(usize::MAX)
      .set_max_height(usize::MAX);
  ```

  Good:

  ```cpp
  let options = zune_core::options::DecoderOptions::default()
      .set_strict_mode(false);
  ```
include_glob:
- src/codec/**
- experimental/**
triggers:
- \b(?:set_max_width|set_max_height)\b
- \bDecoderOptions\b
- \b(?:usize::MAX|SIZE_MAX|UINT32_MAX)\b
- \b(?:max_dimension|max_dimensions|max_pixels)\b
- \b(?:set_max_dimensions|set_dimensions_limit)\b
confidence: 0.9
support_cl_count: 1
