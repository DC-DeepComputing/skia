id: docs/document-bitmap-fonts-and-glyph-caching
title: When documenting Skia text rendering architecture, describe font fallback in SkFontMgr and note
  bitmap font support and SkStrikeCache for SkTypeface
polarity: do
severity: should_fix
rubric: readability
rule: When documenting Skia's text rendering pipeline or font management architecture, describe SkFontMgr's
  font fallback role (resolving typefaces for missing glyphs/characters using font collections and ordering
  heuristics) in addition to family matching and font loading. Additionally, note that SkTypeface supports
  non-vector (bitmap) font formats such as color emoji, and clarify that vector glyphs are rasterized
  into a glyph mask cache (SkStrikeCache) rather than treated as on-the-fly SkPaths.
why: Omitting font fallback misrepresents SkFontMgr's role in character-level font resolution, while assuming
  all glyphs are vector paths ignores bitmap font formats and hides SkStrikeCache, Skia's primary caching
  mechanism for performant text rasterization.
examples:
- |-
  Bad:

  ```cpp
  - **`SkFontMgr`**: Discovers and manages system fonts, matching family names or loading font data.
  - **`SkTypeface`**: Represents a font face containing vector paths for each glyph.
  ...
  When drawing text, the backend looks up glyphs from `SkTypeface` and renders each glyph as a standard `SkPath`.
  ```

  Good:

  ```cpp
  - **`SkFontMgr`**: Discovers and manages system fonts. Matches family names, loads font data, and handles fallback to find glyphs from font collections and ordering heuristics.
  - **`SkTypeface`**: Represents a font face. Typically contains vector paths but also supports bitmap glyphs. Vector glyphs are rasterized and stored in a glyph cache (`SkStrikeCache`).
  ```
include_glob:
- docs/**
- site/docs/**
triggers:
- \bSkTypeface\b
- \bSkFontMgr\b
- \bSkStrikeCache\b
- \b(?:bitmap|vector)\s+glyphs?\b
- \bText Rendering\b
- \b(?:font\s+)?fallback\b
citations:
- path: docs/architecture/CPU.md
  heading: Text Rendering
  quote: It also handles "fallback", which allows a user to find the data to draw a glyph from a collection
    of fonts and ordering heuristics (e.g. use this font for Latin characters and this font for emoji).
confidence: 0.9
support_cl_count: 1
