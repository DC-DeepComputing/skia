id: tools/document-conditionally-compiled-array-fallback-invariants
title: When selecting a fallback option by indexing into a conditionally compiled array, document the
  non-empty invariant and why the chosen element is adequate
polarity: do
severity: nit
rubric: readability
rule: When selecting a fallback configuration or backend by indexing into an array populated via conditional
  compilation directives (such as kSupportedBackends[0]), add an inline comment documenting that the array
  is guaranteed to be non-empty. Explicitly explain why picking the indexed entry (such as the first element)
  provides an adequate fallback.
why: Unchecked indexing into an array whose elements are conditionally compiled can look like an out-of-bounds
  hazard or an arbitrary choice. Documenting the non-emptiness invariant and ordering rationale clarifies
  why the fallback is safe across all build configurations.
examples:
- |-
  Bad:

  ```cpp
  #if defined(SK_GANESH) && defined(SK_GL)
      Window::BackendType windowTypeForRaster = Window::kNativeGL_BackendType;
  #else
      Window::BackendType windowTypeForRaster = kSupportedBackends[0];
  #endif
  ```

  Good:

  ```cpp
  #if defined(SK_GANESH) && defined(SK_GL)
      Window::BackendType windowTypeForRaster = Window::kNativeGL_BackendType;
  #else
      // kSupportedBackends will always have at least one entry. Picking the first should
      // usually result in an adequate GPU-backend.
      Window::BackendType windowTypeForRaster = kSupportedBackends[0];
  #endif
  ```
include_glob:
- tools/**
triggers:
- \b(?:kSupportedBackends|supportedBackends)\[\s*0\s*\\]
- \bk[A-Z]\w*(?:Backends|Configs|Options)\[\s*0\s*\\]
- \b(?:windowTypeForRaster|fBackendType)\b
- \bWindow::BackendType\b
- //.*\b(?:always have at least one|adequate (?:GPU-)?backend|fallback backend)\b
confidence: 0.9
support_cl_count: 1
