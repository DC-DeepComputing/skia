id: tools/sync-test-and-window-context-initialization
title: When updating GPU backend context initialization or third-party API descriptors in Skia tools,
  update both test harnesses and window contexts
polarity: do
severity: should_fix
rubric: correctness
rule: When adapting Skia tools to upstream third-party API changes, breaking changes, or migration macros
  (such as Dawn InstanceDescriptor or Vulkan instance initialization), update all counterpart instance-
  and device-creation sites across both test harnesses (tools/graphite/, tools/ganesh/) and window/viewer
  contexts (tools/window/). Ensure conditional compilation guards and descriptor configurations remain
  consistent across both environments.
why: Backend instance and device setup in Skia tools is partitioned between headless test harnesses (used
  by DM) and interactive window contexts (used by Viewer). Updating upstream API breaking changes or staging
  macros in only test contexts leaves window contexts broken when third-party dependencies roll in CI.
examples:
- |-
  Bad:

  ```cpp
  // In tools/window/GraphiteDawnWindowContext.cpp:
  // Missed updating to match upstream Dawn breaking change applied in GraphiteDawnTestContext.cpp
  desc.capabilities.timedWaitAnyEnable = true;
  ```

  Good:

  ```cpp
  // In tools/window/GraphiteDawnWindowContext.cpp:
  #if defined(WGPU_BREAKING_CHANGE_INSTANCE_FEATURES_LIMITS)
      static const auto kTimedWaitAny = wgpu::InstanceFeatureName::TimedWaitAny;
      desc.requiredFeatureCount = 1;
      desc.requiredFeatures = &kTimedWaitAny;
  #else
      desc.capabilities.timedWaitAnyEnable = true;
  #endif
  ```
include_glob:
- tools/**
triggers:
- \b(?:Graphite|Gr)?[A-Z][a-zA-Z0-9]*(?:Test|Window)Context\b
- \b(?:wgpu::InstanceDescriptor|dawn::native::Instance)\b
- \bWGPU_BREAKING_CHANGE_[A-Z0-9_]+\b
- \b(?:requiredFeatures|requiredFeatureCount)\b
- \b(?:InstanceFeatureName|TimedWaitAny)\b
- \b(?:fInstance|sInstance)\s*=\s*(?:std::make_unique<|new\s+)
confidence: 0.9
support_cl_count: 1
