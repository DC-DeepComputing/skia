id: gpu/document-shared-post-processing-after-divergent-paths
title: When a shared GPU post-processing step immediately follows divergent capability-dependent execution
  paths, add an inline comment clarifying that the operation covers all preceding branches
polarity: do
severity: nit
rubric: readability
rule: When a shared GPU post-processing or finalization step (such as resolving query sets, copying query
  buffers, or resolving passes) immediately follows divergent capability-dependent execution branches,
  add an inline comment clarifying that the step handles outputs from all preceding code paths. Do not
  leave the converging call directly beneath a conditional branch without clarifying that it applies to
  the entire sequence rather than just the adjacent branch.
why: When divergent execution branches converge into a shared finalization call without an explanatory
  comment, readers can easily misinterpret the shared step as belonging solely to the immediately preceding
  conditional branch. Clarifying comment annotations prevent incorrect assumptions about control flow
  and ensure maintainers understand that prior alternative paths are finalized there as well.
examples:
- |-
  Bad:

  ```cpp
      if (fSharedContext->dawnCaps()->supportsCommandBufferTimestamps()) {
          fCommandEncoder.WriteTimestamp(fTimestampQuerySet, 1);
      } else if (!fWroteFirstPassTimestamps) {
          // If we didn't have any passes then we can't report anything.
          fTimestampQueryBuffer = nullptr;
          fTimestampQueryXferBuffer = nullptr;
          return;
      }
      fCommandEncoder.ResolveQuerySet(
              fTimestampQuerySet, 0, 2, fTimestampQueryBuffer->dawnBuffer(), 0);
  ```

  Good:

  ```cpp
      if (fSharedContext->dawnCaps()->supportsCommandBufferTimestamps()) {
          fCommandEncoder.WriteTimestamp(fTimestampQuerySet, 1);
      } else if (!fWroteFirstPassTimestamps) {
          // If we didn't have any passes then we can't report anything.
          fTimestampQueryBuffer = nullptr;
          fTimestampQueryXferBuffer = nullptr;
          return;
      }
      // This resolve covers both timestamp code paths (command encoder and render/compute pass).
      fCommandEncoder.ResolveQuerySet(
              fTimestampQuerySet, 0, 2, fTimestampQueryBuffer->dawnBuffer(), 0);
  ```
include_glob:
- src/gpu/**
triggers:
- \bResolveQuerySet\s*[(]
- \b(?:Write|Resolve)Timestamp\b
- \b(?:fTimestampQuerySet|fTimestampQueryBuffer)\b
- \b(?:supportsCommandBufferTimestamps|supportsTimestamps)\b
- //.*\b(?:covers both|both.*(?:code paths|paths)|timestamp code paths)\b
- \b(?:resolveQuery|copyQueryBuffer|resolveQuerySet)\b
citations:
- path: RELEASE_NOTES.md
  heading: Milestone 133
  quote: In WASM on WebGPU the reported time excludes any GPU transfers that occur before the first render/compute
    pass or after the last pass because of limitations in the WebGPU timestamp query API.
confidence: 0.85
support_cl_count: 1
