id: gpu/match-shader-snippet-uniform-names-with-sksl
title: When declaring shader snippet uniforms in Graphite ShaderCodeDictionary, match uniform names with
  SkSL parameter names and packed vector component order
polarity: do
severity: should_fix
rubric: readability
rule: When declaring snippet uniforms in ShaderCodeDictionary, align uniform names with the parameter
  names of the corresponding static SkSL snippet function and ensure names accurately reflect packed vector
  component ordering (e.g., 'srcGABC' and 'dstGABC' for G, A, B, C parameters rather than 'srcABCG').
  Avoid divergent names between C++ dictionary definitions and SkSL signatures.
why: Snippet uniform declarations in ShaderCodeDictionary provide the names used in generated shader code
  when invoking static SkSL functions. Mismatches between uniform identifiers, SkSL parameter names, and
  packed component order obscure argument mapping, impair shader readability, and complicate debugging
  during shader inspection.
examples:
- |-
  Bad:

  ```cpp
  // In ShaderCodeDictionary.cpp: uniform names diverge from SkSL function parameters and component order:
  fBuiltInCodeSnippets[(int) BuiltInCodeSnippetID::kColorSpaceXformSRGB] = {
      /*name=*/"ColorSpaceTransformSRGB",
      /*staticFn=*/"sk_color_space_transform_srgb",
      SnippetRequirementFlags::kPriorStageOutput,
      /*uniforms=*/{ { "gamut",       SkSLType::kHalf3x3 },
                     { "srcABCG",     SkSLType::kHalf4 },
                     { "srcDEF_args", SkSLType::kHalf4 },
                     { "dstABCG",     SkSLType::kHalf4 },
                     { "dstDEF_args", SkSLType::kHalf4 } }
  };
  ```

  Good:

  ```cpp
  // Uniform names match SkSL parameter names and packed component order (G, A, B, C):
  fBuiltInCodeSnippets[(int) BuiltInCodeSnippetID::kColorSpaceXformSRGB] = {
      /*name=*/"ColorSpaceTransformSRGB",
      /*staticFn=*/"sk_color_space_transform_srgb",
      SnippetRequirementFlags::kPriorStageOutput,
      /*uniforms=*/{ { "gamut",       SkSLType::kHalf3x3 },
                     { "srcGABC",     SkSLType::kHalf4 },
                     { "srcDEF_args", SkSLType::kHalf4 },
                     { "dstGABC",     SkSLType::kHalf4 },
                     { "dstDEF_args", SkSLType::kHalf4 } }
  };
  ```
include_glob:
- src/gpu/graphite/**
- src/sksl/**
triggers:
- /\*uniforms=\*/
- \bBuiltInCodeSnippetID\b
- \bSkSLType::k[A-Za-z0-9_]+\b
- \bShaderCodeDictionary\b
- /\*staticFn=\*/\s*"[^"]+"
- \b(?:src|dst|color)(?:GABC|ABCG|DEF)\b
confidence: 0.9
support_cl_count: 1
