id: gpu/accurately-document-format-fallback-blockers
title: When documenting backend texture format fallbacks, external format mappings, or workarounds, state
  the underlying compatibility blocker instead of speculating about hypothetical mappings
polarity: do
severity: nit
rubric: readability
rule: When adding or modifying explanatory comments for backend texture format fallbacks, external texture
  wrappers, or driver workarounds, state the concrete technical compatibility blocker (such as RGB versus
  RGBA color-type mismatches, channel layout, or bit depth) that necessitates the workaround. Do not write
  speculative comments suggesting hypothetical alternative format assignments or unverified mappings.
why: Speculating in comments that an incompatible format could probably be mapped to an alternative standard
  format is misleading because different color types and channel layouts have distinct alpha and transfer
  semantics. Explaining the exact compatibility blocker clarifies why a workaround or external format
  is required and guides future developers investigating native support.
examples:
- |-
  Bad:

  ```cpp
  // According to Android documentation, the equivalent format is GL_RGB8, but that is 24bpp
  // in Ganesh. While its VkFormat is RGBA8_UNORM, and could probably also treat it as GL_RGBA8,
  // keep it as an external format.
  return GrBackendFormats::MakeGLExternal();
  ```

  Good:

  ```cpp
  // According to Android documentation, the equivalent format is GL_RGB8, but that is 24bpp
  // in Ganesh. For now keep it as an external format until we resolve RGB vs RGBA color-type
  // compatibility.
  return GrBackendFormats::MakeGLExternal();
  ```
include_glob:
- src/gpu/**
triggers:
- //.*\b(?:external format|fallback|workaround|compatibility|equivalent is)\b
- //.*\b(?:could probably|treat it as|speculative|hypothetical|alternative mapping)\b
- \bGrBackendFormats::MakeGL(?:External)?\s*[(]
- \b(?:AHardwareBuffer_Format_to_GrBackendFormat|GetBackendFormatForAHardwareBuffer)\b
- \b(?:AHARDWAREBUFFER_FORMAT_[A-Z0-9_]+|GL_RGB[A-Z0-9_]*|VK_FORMAT_[A-Z0-9_]+)\b
confidence: 0.88
support_cl_count: 1
