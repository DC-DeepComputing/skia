id: gpu/expand-draw-bounds-to-tile-granularity
title: When computing draw or clip bounds for overlap tracking with tiled renderers, expand bounds to
  tile granularity to encompass all pixels touched by rasterization
polarity: do
severity: should_fix
rubric: correctness
rule: Ensure draw and clip bounds used for bounds-overlap checks encompass all pixels touched by rasterization,
  expanding bounds out to tile granularity when renderers align geometry to tiles (unless rendering explicitly
  scissors or clips out zero-coverage pixels). Do not rely solely on standard 1px anti-aliasing outsets
  when a renderer touches full tiles beyond geometric shape bounds.
why: Graphite's bounds managers and DrawListLayer rely on clip draw bounds to detect draw overlaps for
  depth assignment, batching, and layer ordering. If a renderer aligns geometry to tile boundaries (such
  as SparseStrips end caps) without scissoring transparent pixels, failing to expand clip bounds to tile
  granularity causes bounds overlap tracking to miss touched pixels and produce visual artifacts or depth
  conflicts.
examples:
- |-
  Bad:

  ```cpp
  // Only accounts for standard 1px AA outsetting, missing tile-granularity alignment:
  if (!renderer || renderer->outsetBoundsForAA()) {
      clip.outsetBoundsForAA();
  }
  ```

  Good:

  ```cpp
  // Expand clip bounds to tile granularity when renderers align geometry to full tiles:
  if (renderer && renderer->alignsToTiles()) {
      clip.expandToTileGranularity(renderer->tileSize());
  } else if (!renderer || renderer->outsetBoundsForAA()) {
      clip.outsetBoundsForAA();
  }
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- \boutsetBoundsForAA\b
- \bclip\.outsetBoundsForAA\b
- \bEndCaps?\b
- \b(?:transformedShapeBounds|clipDrawBounds|drawBounds)\b
- \b(?:tileSize|tileGranularity|alignsToTiles)\b
confidence: 0.9
support_cl_count: 1
