id: gpu/evaluate-clip-elements-independently
title: When aggregating clip dependencies across clip elements, evaluate elements independently and compare
  monotonic layer indices (layer->fIndex) instead of threading state sequentially
polarity: dont
severity: should_fix
rubric: correctness
rule: When aggregating clip dependencies for a draw across multiple clip elements, do not pass state or
  target layer pointers sequentially from one element to the next, and do not assume iteration order matches
  recording recency. Evaluate each clip element independently from a neutral baseline and determine the
  latest layer or order by explicitly comparing monotonic sequence indices (such as layer->fIndex).
why: Clip elements in a stack are independent of one another and are activated or updated out of stack
  order depending on draw bounds. Threading state sequentially or assuming iteration order matches recency
  causes ordering inversions; comparing monotonic layer indices ensures the dependent draw orders after
  the latest affecting layer.
examples:
- |-
  Bad:

  ```cpp
  Layer* prevLayer = nullptr;
  for (int i = 0; i < effectiveElements.size(); ++i) {
      const RawElement* e = static_cast<const RawElement*>(effectiveElements[i]);
      // Passing prevLayer sequentially assumes element iteration order matches layer creation order.
      CompressedPaintersOrder order = const_cast<RawElement*>(e)->updateForDraw(
              device, boundsManager, deviceBounds, clipBounds, z, prevLayer);
      maxClipOrder = std::max(order, maxClipOrder);
  }
  return {maxClipOrder, prevLayer};
  ```

  Good:

  ```cpp
  Layer* latestInsertedLayer = nullptr;
  for (int i = 0; i < effectiveElements.size(); ++i) {
      const RawElement* e = static_cast<const RawElement*>(effectiveElements[i]);
      auto [order, insertedLayer] = const_cast<RawElement*>(e)->updateForDraw(
              device, boundsManager, deviceBounds, clipBounds, z);
      maxClipOrder = std::max(order, maxClipOrder);
      if (!latestInsertedLayer || (insertedLayer && insertedLayer->fIndex > latestInsertedLayer->fIndex)) {
          latestInsertedLayer = insertedLayer;
      }
  }
  return {maxClipOrder, latestInsertedLayer};
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- \bupdateForDraw\s*[(]
- \b(?:effectiveElements|clipElements|fElements)\b
- \b(?:latestInsertedLayer|latestLayer|prevLayer)\b
- \b(?:RawElement|ClipElement)\b
- \bCompressedPaintersOrder\b
- \bmaxClipOrder\b
- \bfIndex\b
confidence: 0.92
support_cl_count: 1
