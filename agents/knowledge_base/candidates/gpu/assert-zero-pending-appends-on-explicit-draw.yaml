id: gpu/assert-zero-pending-appends-on-explicit-draw
title: When issuing explicit pre-computed draws in GPU draw batchers like DrawWriter, assert zero pending
  appends before overwriting pending draw counts
polarity: do
severity: should_fix
rubric: correctness
rule: In draw-recording and batching helpers (such as DrawWriter), assert that pending append counts are
  zero (such as SkASSERT(fPendingCount == 0)) when executing explicit direct draws or overwriting draw
  counts (e.g., in bindAndFlush()). Never assume prior incremental data was flushed or allow explicit
  draws to clobber unflushed pending appends.
why: Overwriting the pending count without verifying that prior incremental appends have completed silently
  drops unflushed vertex or instance data and corrupts GPU draw parameters. Asserting that pending counts
  are zero prevents state corruption and ensures callers explicitly flush incremental draws before switching
  to direct draws.
examples:
- |-
  Bad:

  ```cpp
  void bindAndFlush(BindBufferInfo vertices, BindBufferInfo indices, BindBufferInfo instances,
                    uint32_t templateCount, unsigned int drawCount) {
      SkASSERT(drawCount > 0);
      SkASSERT(!fAppender);
      this->setTemplate(vertices, indices, instances, templateCount);
      fPendingCount = drawCount;
      this->flush();
  }
  ```

  Good:

  ```cpp
  void bindAndFlush(BindBufferInfo vertices, BindBufferInfo indices, BindBufferInfo instances,
                    uint32_t templateCount, unsigned int drawCount) {
      SkASSERT(drawCount > 0);
      SkASSERT(!fAppender);
      SkASSERT(fPendingCount == 0); // Any prior appends must have been flushed by now.
      this->setTemplate(vertices, indices, instances, templateCount);
      fPendingCount = drawCount;
      this->flush();
  }
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- \bbindAndFlush\s*[(]
- \bSkASSERT\s*[(][^)]*\bfPendingCount\s*==\s*0[)]
- \bfPendingCount\s*=\s*\w+
- \bDrawWriter::bindAndFlush\b
- \bSkASSERT\s*[(][^)]*!fAppender[)]
confidence: 0.92
support_cl_count: 1
