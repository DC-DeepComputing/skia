id: gpu/document-wrapped-resource-budgeting-invariants
title: When documenting GPU resource budgeting invariants, clarify that resources backing client-owned
  objects and wrapper objects for client-provided backend handles never count against cache limits
polarity: do
severity: nit
rubric: readability
rule: When documenting GPU resource budgeting invariants or cache limits, clarify that resources backing
  client-owned objects (such as SkSurface or SkImage) and wrapper objects for client-provided backend
  handles (such as BackendTexture with Ownership::kWrapped) do not count against cache limits and must
  never be budgeted. Explicitly define what constitutes a wrapper object with concrete examples to distinguish
  client-provided handles from internal resource wrapping.
why: Graphite only tracks internally created shared or available scratch resources against cache limits.
  Client-owned and client-wrapped resources are not managed or evictable by the cache budget; imprecise
  comments that describe wrapped objects ambiguously can lead maintainers to confuse client wrappers with
  internal cache management or incorrectly budget external handles.
examples:
- |-
  Bad:

  ```cpp
  // Resources that back client owned objects (e.g. SkSurface or SkImage) are not budgeted and do not count against cache limits. Wrapped objects (not inserted in a cache) are never budgeted.
  Budgeted fBudgeted = Budgeted::kNo;
  ```

  Good:

  ```cpp
  // Resources that back client-owned objects (e.g. SkSurface or SkImage) and wrapper objects (e.g. BackendTexture) do not count against cache limits and therefore should never be budgeted.
  Budgeted fBudgeted = Budgeted::kNo;
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- (?://|\*).*\b(?:budgeted|cache limits?|wrapped objects?|client-owned)\b
- \bBudgeted\s+fBudgeted\b
- \bvoid\s+setBudgeted\s*[(]
- \bBudgeted::k(?:Yes|No)\b
- \bOwnership::kWrapped\b
- (?://|\*).*\b(?:SkSurface|SkImage|BackendTexture).*\b(?:budget|cache|wrapped)\b
confidence: 0.9
support_cl_count: 1
