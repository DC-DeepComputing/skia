id: gpu/when-passing-mandatory-mutable-container-out-parameters-to-i
title: When passing mandatory mutable container out-parameters to internal helper functions, pass by non-const
  reference rather than raw pointer
polarity: do
severity: should_fix
rubric: readability
rule: When passing mandatory mutable containers (such as skia_private::TArray or STArray out-parameters)
  to internal helper functions, pass them by non-const reference rather than pointer. Do not take pointers
  or perform null checks when the output container is required and always populated by the helper.
why: Passing mandatory mutable containers by reference explicitly communicates non-nullability, avoids
  defensive null checks in helpers, and simplifies call sites by eliminating redundant address-of (&)
  operators.
examples:
- |-
  Bad:

  ```cpp
  static VkPipeline MakePipeline(...,
                                 VertexInputBindingDescriptions* vertexBindingDescriptions,
                                 VertexInputAttributeDescriptions* vertexAttributeDescriptions,
                                 ...);
  ```

  Good:

  ```cpp
  static VkPipeline MakePipeline(...,
                                 VertexInputBindingDescriptions& vertexBindingDescriptions,
                                 VertexInputAttributeDescriptions& vertexAttributeDescriptions,
                                 ...);
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- (?:[(,]\s*)[A-Za-z0-9_:]+(?:<[^>]+>)?\s*&\s*[a-zA-Z0-9_]+
