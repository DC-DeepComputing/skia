id: gpu/name-watermark-advancement-methods-explicitly
title: When declaring methods that advance internal sequence counters or watermarks for collaborator subsystems,
  use explicit Next prefixes and operation qualifiers rather than bare update
polarity: dont
severity: nit
rubric: readability
rule: Do not use ambiguous method names like update<Property> (e.g., updateDepth) for methods that advance
  internal sequence counters, orders, or watermarks on behalf of collaborator subsystems. Explicitly specify
  both the forward-looking target being updated (such as NextDepth or NextOrder) and the triggering context
  or subsystem operation (such as updateNextDepthForClipping).
why: 'A bare name like updateDepth(depth) is ambiguous: callers cannot tell whether it mutates the depth
  of an existing draw, sets a persistent device property, or advances an internal watermark counter for
  subsequent draws. Specifying Next<Property> alongside the triggering operation makes sequence advancement
  explicit and clarifies that future draws are being coordinated with external operations like clipping.'
examples:
- |-
  Bad:

  ```cpp
  // Ambiguous whether this mutates current draw depth or advances device watermark
  void updateDepth(PaintersDepth depth);
  ```

  Good:

  ```cpp
  // Explicitly indicates the depth watermark for future draws advances for clipping
  void updateNextDepthForClipping(PaintersDepth depth);
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- \bvoid\s+update(?:Next)?[A-Z]\w*(?:Depth|Order|Watermark|Sequence|Epoch)\s*[(]
- \bupdateNextDepthForClipping\s*[(]
- \b(?:update|advance)Next[A-Z]\w*\s*[(]
- \bPaintersDepth\s+[a-zA-Z0-9_]*depth\b
- \b(?:update|advance)(?:Depth|Order|Watermark)\s*[(]
- \bupdateNext[A-Z]\w*For[A-Z]\w*\b
confidence: 0.85
support_cl_count: 1
