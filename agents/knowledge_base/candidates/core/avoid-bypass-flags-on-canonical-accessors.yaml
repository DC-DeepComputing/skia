id: core/avoid-bypass-flags-on-canonical-accessors
title: When callers require a distinct instance of a singleton type, invoke constructors or factories
  directly instead of adding bypass flags to Empty() accessors
polarity: dont
severity: optional
rubric: design
rule: Do not add ad-hoc boolean configuration flags (such as forceNewInstance) to canonical or singleton
  accessors like Empty() to serve callers needing distinct instances. Call the underlying constructor
  or factory method directly at call sites requiring a unique instance.
why: Complicating a canonical accessor's signature with bypass flags to DRY up a single call site introduces
  unnecessary configurability and bloats shared APIs. Keeping accessors parameterless ensures predictable
  singleton semantics, while callers needing unique instances should instantiate them explicitly.
examples:
- |-
  Bad:

  ```cpp
  // In SkPathData.h:
  static sk_sp<SkPathData> Empty(bool forceNewInstance = false);

  // In caller requiring a distinct empty sentinel:
  static SkPathData* gErrorSingleton = SkPathData::Empty(true).release();
  ```

  Good:

  ```cpp
  // In SkPathData.h:
  static sk_sp<SkPathData> Empty();

  // In caller requiring a distinct empty sentinel:
  static SkPathData* gErrorSingleton = SkPathData::MakeNoCheck({}, {}, {}, {}, {}).release();
  ```
include_glob:
- src/core/**
triggers:
- \bEmpty\s*[(][^)]*\bbool\b
- \bEmpty\s*[(]\s*(?:true|false)\s*[)]
- \b[A-Za-z0-9_]+::Empty\s*[(][^)]*\b(?:force|make|new|unique|instance)
- \b(?:forceNewInstance|force_new_instance)\b
- \b[A-Za-z0-9_]+::Empty\s*[(]\s*(?:true|false)\s*[)]
- \bstatic\s+(?:sk_sp<[A-Za-z0-9_:]+>|[A-Za-z0-9_:]+[*]\s+Empty\s*[(][^)]*\bbool\b)
confidence: 0.82
support_cl_count: 1
