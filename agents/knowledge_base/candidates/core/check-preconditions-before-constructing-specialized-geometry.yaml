id: core/check-preconditions-before-constructing-specialized-geometry
title: When entering specialized draw paths in canvas dispatch, verify eligibility preconditions before
  constructing intermediate geometry representations like SkRRect
polarity: do
severity: should_fix
rubric: safety
rule: In draw dispatch routines (such as SkCanvas::onDraw*), verify eligibility preconditions—such as
  paint mask filters or path effects—before constructing intermediate geometry objects like SkRRect or
  calling specialized rendering helpers. Do not unconditionally convert shapes (e.g., via SkRRect::MakeRect
  or SkRRect::MakeOval) for specialized paths that only apply to a fraction of draw calls.
why: Specialized rendering techniques such as analytic blurs only apply when specific paint effects are
  active. Constructing intermediate geometry representations and calling specialized helpers unconditionally
  introduces unnecessary CPU overhead and function call indirection to common rendering paths.
examples:
- |-
  Bad:

  ```cpp
  // Unconditionally constructs SkRRect even when paint has no mask filter
  std::optional<AutoLayerForImageFilter> layer =
          this->attemptBlurredRRectDraw(SkRRect::MakeOval(oval), paint, PredrawFlags::kNone);
  if (layer) {
      this->topDevice()->drawOval(oval, layer->paint());
  }
  ```

  Good:

  ```cpp
  // Check cheap paint preconditions before constructing intermediate geometry
  std::optional<AutoLayerForImageFilter> layer;
  if (const SkBlurMaskFilterImpl* blurMaskFilter = this->canAttemptBlurredRRectDraw(paint)) {
      layer = this->attemptBlurredRRectDraw(
              SkRRect::MakeOval(oval), blurMaskFilter, paint, PredrawFlags::kNone);
  } else {
      layer = this->aboutToDraw(paint, &oval);
  }
  if (layer) {
      this->topDevice()->drawOval(oval, layer->paint());
  }
  ```
include_glob:
- src/core/**
triggers:
- \b(?:attempt|canAttempt)[A-Za-z0-9_]*Draw\b
- \bSkRRect::Make(?:Oval|Rect)\s*[(]
- \bonDraw(?:Rect|Oval|RRect|Path)\s*[(]
- \b(?:getMaskFilter|getPathEffect|getImageFilter)\s*[(][)]
- \bAutoLayerForImageFilter\b
confidence: 0.92
support_cl_count: 1
