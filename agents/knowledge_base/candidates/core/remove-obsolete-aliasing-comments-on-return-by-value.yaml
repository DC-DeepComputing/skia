id: core/remove-obsolete-aliasing-comments-on-return-by-value
title: When refactoring methods from output pointer parameters to return-by-value or std::optional, remove
  obsolete inline comments regarding memory aliasing or in-place overwrite hazards
polarity: do
severity: should_fix
rubric: readability
rule: When refactoring methods from taking an out-pointer or in-out pointer parameter to returning a value
  (such as std::optional<T> or T), remove or update inline comments warning about memory aliasing or in-place
  overwrite hazards that only applied when writing through caller-provided pointers. Ensure retained comments
  accurately reflect that operations modify local variables rather than caller-aliased memory.
why: Comments warning about memory aliasing or in-place overwrite hazards between an output pointer parameter
  and 'this' or input arguments become inaccurate and misleading when the method is refactored to construct
  and return a local variable.
examples:
- |-
  Bad:

  ```cpp
  // Refactored to return by value, but retained obsolete aliasing warning:
  std::optional<SkMatrix> SkMatrix::invert() const {
      ...
      // Must be careful when writing to inv, since it may be the
      // same memory as this.
      SkMatrix inv;
      inv.fMat[kMSkewX] = inv.fMat[kMSkewY] = 0;
      ...
      return inv;
  }
  ```

  Good:

  ```cpp
  std::optional<SkMatrix> SkMatrix::invert() const {
      ...
      SkMatrix inv;
      inv.fMat[kMSkewX] = inv.fMat[kMSkewY] = 0;
      ...
      return inv;
  }
  ```
include_glob:
- src/core/**
triggers:
- //.*\b(?:same memory|in[- ]place|aliasing|alias|same as this|may be this)\b
- \bstd::optional<[A-Za-z0-9_:]+>\s+[A-Za-z0-9_:]+::[a-zA-Z0-9_]+\s*[(]
- \bstd::optional<SkMatrix>\b
- \bSkMatrix\s+inv\b
- \bComputeInv\s*[(]
confidence: 0.9
support_cl_count: 1
