id: sksl/accumulate-additive-coverage-before-clamping
title: When computing analytic shape coverage with clipping planes and additive features in fragment shaders,
  accumulate additive terms before saturate and edge multiplication
polarity: do
severity: should_fix
rubric: safety
rule: When computing analytic shape coverage with clipping planes and additive features (such as stroke
  end caps or joins) in fragment shaders, accumulate additive coverage directly into the unsaturated clip
  factor before a single saturate() call. Multiply with orthogonal edge coverage only after clamping,
  avoiding redundant intermediate saturations, inverse weighting multiplies ((1 - clip)), and extra min()
  clamps.
why: Weighting additive features by (1 - clip) after edge clipping and re-clamping with min() introduces
  redundant ALU multiplications and clamp instructions. Combining additive coverage directly with clipping
  terms before a single saturate() and final multiplication produces identical coverage while reducing
  per-fragment GPU instruction count.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Clamping clip early requires (1 - clip) weighting and an extra min() clamp
  clip = saturate(clip + unionPlaneClip);
  edgeAlpha *= clip;
  half capAlpha = (1.0 - clip) * (max(dcap1, 0.0) + max(dcap2, 0.0));
  edgeAlpha = min(edgeAlpha + capAlpha, 1.0);
  return half4(edgeAlpha);
  ```

  Good:

  ```cpp
  // Good: Accumulate additive cap coverage before a single saturate() and edge multiply
  clip = clip + unionPlaneClip;
  half capAlpha = max(dcap1, 0.0) + max(dcap2, 0.0);
  clip = saturate(clip + capAlpha);
  return half4(clip * edgeAlpha);
  ```
include_glob:
- src/sksl/**
- src/gpu/**
triggers:
- \b(?:capAlpha|unionPlaneClip|dcap[12]|roundCap(?:Radius|Pos)?)\b
- \bsaturate\s*\(\s*clip\b
- \b(?:clip\s*\*\s*edgeAlpha|edgeAlpha\s*\*\s*clip)\b
- \bhalf4\s*\(\s*(?:clip\s*\*|edgeAlpha\s*\*|[a-zA-Z0-9_]*Coverage)
- \b(?:circular_arc_coverage_fn|endcap_coverage_fn|analytic_rrect_coverage_fn)\b
- \b(?:half|float)[234]?\s+[a-zA-Z0-9_]*(?:Cap|Clip|Edge)(?:Alpha|Coverage)?\b
confidence: 0.9
support_cl_count: 1
