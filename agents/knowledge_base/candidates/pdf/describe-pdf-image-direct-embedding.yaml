id: pdf/describe-pdf-image-direct-embedding
title: When documenting image pre-encoding or compression in SkPDF, describe direct stream embedding concisely
  rather than writing wordy comments about generic fast paths or downstream devices
polarity: do
severity: nit
rubric: readability
rule: When documenting image pre-encoding, compression, or deferred image creation in SkPDF, explain concisely
  that pre-compression allows compressed data (such as JPEG streams) to be emitted or embedded directly
  into the PDF without re-encoding. Do not vaguely describe pre-encoding as an execution 'fast path',
  and avoid wordy multi-line comments restating self-evident downstream consumption (such as embedding
  in devices below); keep inline conversion comments concise and focused on the emitted format.
why: In PDF generation, pre-compressing an image into formats like JPEG enables SkPDF to embed the raw
  compressed stream directly via DCTDecode filters, avoiding lossy re-encoding and uncompressed raster
  embedding while keeping file size small. Calling this mechanism a generic execution 'fast path' or adding
  wordy comments that explain obvious downstream device use clutters the code without clarifying the emitted
  stream format.
examples:
- |-
  Bad:

  ```cpp
  // Vaguely describing pre-encoding as an execution fast path:
  // By encoding this into jpeg, it can follow the fast path during drawImage.
  if (SkJpegEncoder::Encode(&buffer, pm, jpegOptions)) {
      return SkCodecs::DeferredImage(SkJpegDecoder::Decoder(buffer.detachAsData()));
  }

  // Wordy multi-line comment restating obvious downstream device embedding:
  // Convert Gray image to jpeg if needed so it can be more efficiently embedded in
  // the glyphDevice below.
  ```

  Good:

  ```cpp
  // Stating direct stream embedding:
  // By encoding this into jpeg, it can be embedded directly as a JPEG stream during drawImage.
  if (SkJpegEncoder::Encode(&buffer, pm, jpegOptions)) {
      return SkCodecs::DeferredImage(SkJpegDecoder::Decoder(buffer.detachAsData()));
  }

  // Concise single-line comment focused on the emitted format:
  // Convert Grey image to deferred jpeg image to emit as jpeg
  ```
include_glob:
- src/pdf/**
triggers:
- //.*\b(?:fast[ -]?path|embedded|embedding)\b
- //.*\b(?:encode|encoding|compressed?)\b.*\b(?:jpeg|dct|flate|pdf)\b
- //.*\b(?:Convert|deferred)\b.*\b(?:jpeg|dct|glyphDevice|emit as)\b
- \b(?:SkJpegEncoder|SkPngEncoder|SkWebpEncoder)::Encode\b
- \bSkCodecs::DeferredImage\b
- \b(?:emit_image_stream|PDFImage|SkPDFBitmap)\b
confidence: 0.9
support_cl_count: 1
