id: general/retain-header-for-legacy-guards
title: When removing header includes from files containing SK_SUPPORT_LEGACY_ guards, retain declarations
  or conditionally include the header until legacy code is removed
polarity: dont
severity: blocking
rubric: correctness
rule: Do not remove a header include from a source or header file if the file still contains conditionally
  compiled blocks (such as '#if defined(SK_SUPPORT_LEGACY_...)') implementing or referencing types declared
  in that header. Either retain the include (nested inside the conditional preprocessor block if appropriate)
  or verify that downstream embedders like Chromium have migrated before removing the header.
why: In standalone Skia builds, legacy deprecation macros are often unset or defined in the legacy header
  itself, so removing the include silently compiles without error in local CI by skipping the guarded
  block. Downstream embedders like Chromium define these legacy macros at the build level, causing compilation
  failures when legacy blocks compile without required declarations.
examples:
- |-
  Bad:

  ```cpp
  // Removed #include "include/effects/SkGradientShader.h"
  #include "include/effects/SkGradient.h"

  // Fails in Chromium where SK_SUPPORT_LEGACY_UNSPANNED_GRADIENTS is defined in GN
  #if defined(SK_SUPPORT_LEGACY_UNSPANNED_GRADIENTS)
  sk_sp<SkShader> SkGradientShader::MakeLinear(const SkPoint pts[2], ...) { ... }
  #endif
  ```

  Good:

  ```cpp
  #include "include/effects/SkGradient.h"

  #if defined(SK_SUPPORT_LEGACY_UNSPANNED_GRADIENTS)
  #include "include/effects/SkGradientShader.h"

  sk_sp<SkShader> SkGradientShader::MakeLinear(const SkPoint pts[2], ...) { ... }
  #endif
  ```
include_glob:
- src/**
- include/**
triggers:
- ^#include\s+[\"<]
- '#(?:if|ifdef|ifndef)\s+.*\bSK_SUPPORT_LEGACY_'
- \bSK_SUPPORT_LEGACY_[A-Za-z0-9_]+\b
- '#(?:if|ifdef|ifndef)\s+.*\bSK_USE_LEGACY_'
- \bSK_USE_LEGACY_[A-Za-z0-9_]+\b
- \bdefined\s*\(\s*SK_(?:SUPPORT|USE)_LEGACY_[A-Za-z0-9_]+\s*\)
citations:
- path: site/docs/dev/chrome/changes.md
  heading: Method 1 (preferred) - Make the old code path opt-in for Chromium
  quote: Deprecate the old code path so that it must be enabled with a flag such as 'SK_SUPPORT_LEGACY_XXX'.
    Synchronize the above changes in Skia with a Chromium commit to 'skia/skia_common.gypi' or 'skia/config/SkUserConfig.h'
    to enable the deprecated Skia API.
confidence: 0.9
support_cl_count: 1
