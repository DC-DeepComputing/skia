id: general/avoid-temporary-out-parameter-on-early-return
title: When passing an out-parameter to a fallible function where failure returns early, pass the destination
  variable directly rather than declaring a temporary copy
polarity: dont
severity: nit
rubric: readability
rule: When passing an out-parameter to a fallible function whose failure causes the caller to immediately
  return or abort, pass the destination variable directly. Do not declare an intermediate temporary variable
  solely to stage the output before copying it on success, unless a prior fallback value must be preserved
  upon failure.
why: When the calling function immediately aborts or returns on failure, the target variable's previous
  state does not need to be preserved. Declaring a temporary variable and performing a redundant copy
  on success adds visual clutter and extra operations without providing safety or transactional benefit.
examples:
- |-
  Bad:

  ```cpp
  skcms_Matrix3x3 toXYZD50;
  if (reader.has_chrm()) {
      skcms_Matrix3x3 tmp;
      if (ToSkColorSpacePrimaries(chrm).toXYZD50(&tmp)) {
          toXYZD50 = tmp;
      } else {
          return nullptr;
      }
  }
  ```

  Good:

  ```cpp
  skcms_Matrix3x3 toXYZD50;
  if (reader.has_chrm()) {
      if (!ToSkColorSpacePrimaries(chrm).toXYZD50(&toXYZD50)) {
          return nullptr;
      }
  }
  ```
include_glob:
- src/**
- modules/**
- experimental/**
triggers:
- \b(?:toXYZD50|ToXYZD50)\s*\([^)]*&
- \b(?:skcms_Matrix3x3|SkColorSpacePrimaries)\b
- \bToSkColorSpacePrimaries\b
- '&\s*(?:tmp|temp)[A-Za-z0-9_]*\s*[,)]'
- \b[a-zA-Z0-9_.]+\s*=\s*(?:tmp|temp)[A-Za-z0-9_]*\s*;
- \bif\s*\(\s*!?[a-zA-Z0-9_:]+\([^)]*&\s*(?:tmp|temp)[A-Za-z0-9_]*\s*\)
confidence: 0.9
support_cl_count: 1
