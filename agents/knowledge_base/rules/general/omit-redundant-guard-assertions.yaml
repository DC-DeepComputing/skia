id: general/omit-redundant-guard-assertions
title: When asserting invariants with SkASSERT or SkASSERT_RELEASE, omit redundant checks already guaranteed
  by enclosing guards, prior early returns, constructor initializers, or unconditional preceding assignments
polarity: dont
severity: should_fix
rubric: readability
rule: Do not add redundant SkASSERT, SkASSERTF, or SkASSERT_RELEASE checks for conditions already guaranteed
  by enclosing if statements, prior runtime guards with early returns, unconditional member initializer
  dereferences in constructors, or unconditional assignments within the same block. Furthermore, do not
  duplicate SkASSERT with a redundant SkASSERT_RELEASE on the exact same condition; retain only the appropriate
  assertion level, and replace temporary debugging TODO comments on permanently retained release asserts
  with explanatory comments.
why: Asserting conditions already established by preceding early exits, enclosing guards, unconditional
  assignments, prior execution, or companion assertions adds visual clutter and dead checks without providing
  safety or debugging value. Because SkASSERT_RELEASE already executes in debug builds, duplicating it
  with SkASSERT on the exact same condition is redundant, while temporary debugging TODOs obscure why
  a release assertion is intentionally retained in production.
examples:
- |-
  Bad:

  ```cpp
  // Redundant assertion inside enclosing guard:
  if (supportCpuUpload) {
      if (state.fUseTransferBuffer) {
          SkASSERT(supportCpuUpload);
          doUpload();
      }
  }

  // Redundant assertion following early-return check:
  if (!stream) {
      *result = kInvalidInput;
      return nullptr;
  }
  SkASSERT_RELEASE(stream);

  // Redundant assertion after member initializer dereference:
  AtlasManager::AtlasManager(Recorder* recorder)
          : fRecorder(recorder), fAtlas(recorder->priv().caps()) {
      SkASSERT(recorder);
  }

  // Redundant assertion immediately following unconditional assignment:
  fContextOptions.fOptionsPriv = &fOptionsPriv;
  SkASSERT(fContextOptions.fOptionsPriv == &fOptionsPriv);

  // Redundant duplicate assertion with temporary debugging TODO:
  SkASSERT(step->performsShading());
  // TODO(b/372912880): Release assert debugging for illegal instruction occurring in the wild.
  SkASSERTF_RELEASE(step->performsShading(), "step: %s", step->name());
  ```

  Good:

  ```cpp
  // Rely on enclosing guard:
  if (supportCpuUpload) {
      if (state.fUseTransferBuffer) {
          doUpload();
      }
  }

  // Rely on prior early-return check:
  if (!stream) {
      *result = kInvalidInput;
      return nullptr;
  }

  // Omit assertion when already dereferenced in initializer list:
  AtlasManager::AtlasManager(Recorder* recorder)
          : fRecorder(recorder), fAtlas(recorder->priv().caps()) {}

  // Omit redundant assertion after explicit assignment:
  fContextOptions.fOptionsPriv = &fOptionsPriv;

  // Keep only the necessary assertion; document permanently retained release asserts:
  SkASSERT(step->performsShading());
  // Check for unexpected corruption occurring in the wild.
  SkASSERTF_RELEASE(fRoots.size() >= 2, "root size = %zu", fRoots.size());
  ```
include_glob:
- src/**
- include/**
- modules/**
- experimental/**
- tools/**
triggers:
- \bSkASSERT(?:_RELEASE|F)?\s*[(]\s*!?[A-Za-z0-9_.]+\s*[)]
- \bSkASSERT(?:_RELEASE|F)?\s*[(][^)]*->
- \bSkASSERT(?:_RELEASE|F)?\s*[(][^)]*(?:==|!=|<=|>=|<|>)
- \bSkASSERT(?:_RELEASE|F)?\s*[(][^)]*\b(?:isValid|empty|has_value|get|performsShading)\b
- \bSkASSERT(?:F)?_RELEASE\s*[(]
- :\s*[A-Za-z0-9_]+\s*[(][^)]*->
- ',\s*[A-Za-z0-9_]+\s*[(][^)]*->'
confidence: 0.98
support_cl_count: 5
