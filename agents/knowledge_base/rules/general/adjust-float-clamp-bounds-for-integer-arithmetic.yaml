- \bcast<(?:I32|int32_t|int|int16_t|I16)>\([^;]+[-+]\s*[0-9]+
- \b(?:floor_|round_|ceil_)?\([^;]+[-+]\s*[0-9]+(?:\.[0-9]+f?)?\s*\)\s*[-+]\s*[0-9]+
