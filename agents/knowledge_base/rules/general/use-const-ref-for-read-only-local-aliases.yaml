id: general/use-const-ref-for-read-only-local-aliases
title: When inspecting container elements or struct fields without mutating them, declare loop variables
  and local aliases as const references rather than by-value or mutable
polarity: do
severity: should_fix
rubric: readability
rule: When iterating over or aliasing container elements and struct fields that are only inspected and
  not modified, declare the loop variable or local alias as a const reference (`const auto&` or explicit
  `const T&`). Avoid binding read-only objects by mutable reference (`auto&` / `T&`) or copying elements
  by value (`auto` / `T`).
why: Binding read-only elements by const reference communicates immutability to readers and enables compiler
  enforcement against accidental mutations. For range-for loops, it also avoids redundant element copies
  and extra instructions when iterating over composite types or small value structs.
examples:
- |-
  Bad:

  ```cpp
  // Range-for loop copying elements by value:
  for (auto pt : points) {
      SkRect r = SkRect::MakeLTRB(pt.fX - radius, pt.fY - radius,
                                  pt.fX + radius, pt.fY + radius);
      device->drawOval(r, newPaint);
  }

  // Local alias declared as a mutable reference for read-only inspection:
  for (int i = 0; i < cachedArray->size(); ++i) {
      MaskHashEntry& entry = (*cachedArray)[i];
      if (entry.fBounds.contains(iBounds)) {
          return entry.fLocator;
      }
  }
  ```

  Good:

  ```cpp
  // Range-for loop binding elements by const reference:
  for (const auto& pt : points) {
      SkRect r = SkRect::MakeLTRB(pt.fX - radius, pt.fY - radius,
                                  pt.fX + radius, pt.fY + radius);
      device->drawOval(r, newPaint);
  }

  // Local alias declared as a const reference:
  for (int i = 0; i < cachedArray->size(); ++i) {
      const MaskHashEntry& entry = (*cachedArray)[i];
      if (entry.fBounds.contains(iBounds)) {
          return entry.fLocator;
      }
  }
  ```
include_glob:
- src/**
- include/**
- modules/**
- tests/**
- tools/**
triggers:
