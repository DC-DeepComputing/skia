id: general/omit-redundant-android-api-checks-in-framework
title: When guarding code for Android framework builds with SK_BUILD_FOR_ANDROID_FRAMEWORK, omit redundant
  __ANDROID_API__ version checks as the platform always compiles against current APIs
polarity: dont
severity: should_fix
rubric: readability
rule: Do not combine `__ANDROID_API__` preprocessor version checks with `#if defined(SK_BUILD_FOR_ANDROID_FRAMEWORK)`.
  When guarding code specifically compiled for the Android OS framework tree, omit platform API level
  checks because framework builds always target the current platform API baseline.
why: Skia compiles inside the Android OS framework tree (`SK_BUILD_FOR_ANDROID_FRAMEWORK`) against the
  latest platform API headers. Checking legacy API levels (such as `__ANDROID_API__ >= 28`) inside framework-only
  code is always true and well outside any cherry-pick range, creating unnecessary preprocessor clutter.
examples:
- |-
  Bad:

  ```cpp
  #if defined(SK_BUILD_FOR_ANDROID_FRAMEWORK) && __ANDROID_API__ >= 28
      case AHARDWAREBUFFER_FORMAT_B8G8R8A8_UNORM:
          return kBGRA_8888_SkColorType;
  #endif
  ```

  Good:

  ```cpp
  #if defined(SK_BUILD_FOR_ANDROID_FRAMEWORK)
      case AHARDWAREBUFFER_FORMAT_B8G8R8A8_UNORM:
          return kBGRA_8888_SkColorType;
  #endif
  ```
include_glob:
- src/**
- include/**
triggers:
- '#(?:if|elif)\s+.*\bSK_BUILD_FOR_ANDROID_FRAMEWORK\b'
- \bdefined\s*\(\s*SK_BUILD_FOR_ANDROID_FRAMEWORK\s*\)
- '#(?:if|elif)\s+.*\b__ANDROID_API__\b'
- \b__ANDROID_API__\s*(?:>=|>|==)
- \bSK_BUILD_FOR_ANDROID_FRAMEWORK\b
confidence: 0.9
support_cl_count: 1
