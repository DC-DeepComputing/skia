id: general/inline-simple-accessor-calls
title: Inline simple accessors, casts, and single-use wrapper arguments directly into calls, but hoist
  complex math expressions or loop bounds into named variables
polarity: dont
severity: should_fix
rubric: readability
rule: Do not declare redundant single-use intermediate local variables or reference aliases solely to
  hold trivial member field accesses, container sizes/counts, cheap accessors, simple casts, or temporary
  wrapper objects when they can be cleanly evaluated inline (such as `{arg}` or inline constructors) in
  assertions, function arguments, or loop conditions. Conversely, extract non-trivial loop start or boundary
  expressions involving math functions or multi-step rounding casts (such as static_cast<int32_t>(std::ceil(...)))
  into a descriptive named local variable before the loop rather than embedding them directly in the for-loop
  header.
why: Inlining simple getters, container sizes, straightforward casts, and temporary wrapper arguments
  directly into calls and loop conditions eliminates visual noise and boilerplate variables. Conversely,
  embedding complex math computations, rounding functions, or multi-step casts inside a loop header clutters
  the loop statement and obscures loop bounds; defining a descriptive local variable upfront clarifies
  intent.
examples:
- |-
  Bad:

  ```cpp
  // Redundant intermediate variable for trivial loop bound
  size_t childCount = node->fChildCount;
  for (size_t i = 0; i < childCount; ++i) {
      process(node->fChildren[i]);
  }

  // Redundant temporary aliases for cheap getter and argument casts
  const Rect& drawBounds = clip.drawBounds();
  SkASSERT(!drawBounds.isEmptyNegativeOrNaN());
  SkColor actual = pixmap.getColor((int)pt.x(), (int)pt.y());

  // Redundant temporary local variable for single-use wrapper argument
  GrD3DBackendSemaphoreData data(info);
  return MakeGrBackendSemaphore(backend, data);

  // Cluttered loop header with embedded math and rounding cast
  for (int32_t row = static_cast<int32_t>(std::ceil(yEdge)); row < kTileHeight; ++row) {
      processRow(row);
  }
  ```

  Good:

  ```cpp
  // Inlined directly into loop condition
  for (size_t i = 0; i < node->fChildCount; ++i) {
      process(node->fChildren[i]);
  }

  // Inlined directly into assertion, call site, and wrapper argument
  SkASSERT(!clip.drawBounds().isEmptyNegativeOrNaN());
  SkColor actual = pixmap.getColor(pt.x(), pt.y());
  return MakeGrBackendSemaphore<GrD3DBackendSemaphoreData>(backend, {info});

  // Complex loop bound hoisted to descriptive named local variable
  int32_t startY = static_cast<int32_t>(std::ceil(yEdge));
  for (int32_t row = startY; row < kTileHeight; ++row) {
      processRow(row);
  }
  ```
