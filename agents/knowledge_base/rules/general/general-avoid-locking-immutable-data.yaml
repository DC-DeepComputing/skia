id: general/general-avoid-locking-immutable-data
title: When declaring or accessing immutable or read-only data initialized at construction, omit mutexes,
  spinlocks, or SK_GUARDED_BY annotations since concurrent reads are thread-safe
polarity: dont
severity: should_fix
rubric: safety
rule: Do not protect immutable or read-only data with mutexes or spinlocks (nor annotate fields with SK_GUARDED_BY)
  when the data is fully initialized during object construction and never modified thereafter. In C++,
  concurrent reads on immutable data are inherently thread-safe; initialize such fields eagerly in constructor
  initializer lists and access them directly without synchronization.
why: Guarding immutable or read-only data with a lock introduces unnecessary locking overhead, code complexity,
  and thread contention. Because immutable data is never written to after construction, concurrent reader
  threads cannot race, making synchronization redundant.
examples:
- |-
  Bad:

  ```cpp
  SkTDArray<uint8_t> fMSAAMaskLUT SK_GUARDED_BY(fSpinLock);

  const SkTDArray<uint8_t>* getMSAA8MaskLUT() SK_EXCLUDES(fSpinLock) {
      SkAutoSpinlock lock{fSpinLock};
      SkASSERT(!fMSAAMaskLUT.empty());
      return &fMSAAMaskLUT;
  }
  ```

  Good:

  ```cpp
  SkTDArray<uint8_t> fMSAAMaskLUT;

  SkSpan<const uint8_t> getMSAA8MaskLUT() const {
      return fMSAAMaskLUT;
  }
  ```
include_glob:
- src/**
- include/**
triggers:
- \bSK_GUARDED_BY\s*[(]
- \bSK_EXCLUDES\s*[(]
- \b(?:SkAutoSpinlock|SkAutoMutexExclusive)\s+\w+
- \bstd::(?:lock_guard|unique_lock|shared_lock)<
- \b(?:SkSpinlock|SkMutex|std::mutex)\s+f?[A-Z]\w*
- \b(?:const\s+)?[A-Za-z0-9_:]+(?:LUT|Table|Mask|Cache|Info)\s+SK_GUARDED_BY
citations:
- path: docs/architecture/CPU.md
  heading: '### 1. The API Layer'
  quote: Because it is immutable, it can be cached and shared safely across threads.
confidence: 0.92
support_cl_count: 1
