id: general/prefer-skdebugf-over-printf
title: When logging debug messages or diagnostics, use Skia's platform-aware SkDebugf instead of standard
  library printf or std::printf
polarity: dont
severity: should_fix
rubric: readability
rule: Do not use standard library `printf` or `std::printf` for debug logging or diagnostics; use Skia's
  platform-aware logging function `SkDebugf` (or `SkDEBUGF`) instead.
why: Skia runs on diverse target platforms (such as Android, iOS, Windows, and WebAssembly) where stdout
  output from standard `printf` is often dropped, redirected, or inaccessible. `SkDebugf` routes output
  through Skia's platform-specific logging backends (such as Android logcat), ensuring diagnostics reach
  the appropriate system logging facility.
examples:
- |-
  Bad:

  ```cpp
  #define RETURN_ON_FALSE(x) \
      do { \
          if (!(x)) { \
              printf("Failed at %d\n", __LINE__); \
              return false; \
          } \
      } while (0)
  ```

  Good:

  ```cpp
  #define RETURN_ON_FALSE(x) \
      do { \
          if (!(x)) { \
              SkDebugf("Parsing failed %s at %d\n", #x, __LINE__); \
              return false; \
          } \
      } while (0)
  ```
include_glob:
- src/**
- include/**
- modules/**
triggers:
- (?:^|\s|[=(;,!])(?:std::)?printf\s*\(
- \bstd::printf\s*\(
- \bSkDebugf\s*\(
- \bSkDEBUGF\s*\(
- (?:^|\s|[=(;,!])(?:std::)?vprintf\s*\(
confidence: 0.9
support_cl_count: 1
