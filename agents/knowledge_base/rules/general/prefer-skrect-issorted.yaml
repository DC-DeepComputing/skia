id: general/prefer-skrect-issorted
title: When checking or asserting that an SkRect is sorted, use rect.isSorted() instead of comparing rect.makeSorted()
  == rect or open-coding coordinate checks
polarity: do
severity: nit
rubric: readability
rule: When checking or asserting that an SkRect has sorted coordinate ordering (fLeft <= fRight and fTop
  <= fBottom), call rect.isSorted() rather than comparing rect.makeSorted() == rect or manually checking
  coordinate pairs. Use the dedicated member predicate across runtime assertions (SkASSERT), debug checks,
  and conditional branching.
why: SkRect::isSorted() is the dedicated, idiomatic predicate for verifying rectangle coordinate order.
  Comparing rect.makeSorted() == rect redundantly constructs a temporary rectangle, computes min and max
  across all four coordinates, and compares floats, which obscures intent and incurs unnecessary work
  compared to the direct member predicate.
examples:
- |-
  Bad:

  ```cpp
  SkASSERT(fBounds.makeSorted() == fBounds);
  ```

  Good:

  ```cpp
  SkASSERT(fBounds.isSorted());
  ```
include_glob:
- src/**
- tests/**
- modules/**
triggers:
- \bmakeSorted\s*[(][)]\s*==
- ==\s*[A-Za-z0-9_.]*makeSorted\s*[(]
- \b(?:fBounds|bounds|rect)\.makeSorted\b
- \bSkASSERT\s*[(][^)]*makeSorted
- \b(?:fLeft\s*<=\s*fRight|fTop\s*<=\s*fBottom)\b
- \bisSorted\s*[(][)]
confidence: 0.9
support_cl_count: 1
