id: general/mark-concrete-classes-final
title: When declaring concrete leaf implementation classes or internal types deriving from interfaces,
  mark the class declaration final to prevent unintended inheritance and aid devirtualization
polarity: do
severity: nit
rubric: readability
rule: 'When defining concrete leaf implementation classes (such as FooImpl classes implementing an interface)
  that are not intended to be further subclassed, mark the class declaration final (e.g., class FooImpl
  final : public Foo). Do not leave concrete leaf classes unconstrained when further inheritance is neither
  designed nor supported.'
why: Marking concrete leaf classes as final clarifies design intent by forbidding further inheritance,
  avoids object slicing hazards, and enables compiler devirtualization of member function calls.
examples:
- |-
  Bad:

  ```cpp
  // Concrete leaf implementation class left open to inheritance
  class AgtmImpl : public Agtm {
  public:
      void applyGain() override;
  };
  ```

  Good:

  ```cpp
  // Marked final to prevent subclassing and enable devirtualization
  class AgtmImpl final : public Agtm {
  public:
      void applyGain() override;
  };
  ```
include_glob:
- src/**
- modules/**
- include/**
triggers:
- \bclass\s+[A-Za-z0-9_]+Impl\b
- \bclass\s+[A-Za-z0-9_]+\s*(?:final\s*)?:\s*public\b
- \bclass\s+[A-Za-z0-9_]+\s+final\b
- \bclass\s+[A-Za-z0-9_]+Priv\s*:\s*public\b
- \bclass\s+[A-Za-z0-9_]+\s*:\s*public\s+Sk[A-Za-z0-9_]+
confidence: 0.9
support_cl_count: 1
