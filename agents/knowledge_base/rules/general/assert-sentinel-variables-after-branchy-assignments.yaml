id: general/assert-sentinel-variables-after-branchy-assignments
title: When initializing variables to sentinel or default values before multi-branch assignment blocks,
  assert with SkASSERT that non-failing paths populated a valid value
polarity: do
severity: should_fix
rubric: readability
rule: When initializing a variable to a default or sentinel value (such as 0 or nullptr) prior to multi-branch
  conditional blocks (such as if/else or switch statements), assert with SkASSERT immediately after the
  branching structure that the variable was assigned a valid value along all non-failing paths. Do not
  allow sentinel-initialized variables to propagate downstream without verifying that at least one branch
  populated them.
why: Default or sentinel initializations prevent uninitialized-variable compiler warnings, but they risk
  masking unhandled or newly added branches that omit assignment. Verifying the populated state with SkASSERT
  immediately following the branch structure ensures incomplete coverage fails fast in debug builds rather
  than silently passing invalid sentinel values downstream.
examples:
- |-
  Bad:

  ```cpp
  int numComponents = 0;
  if (srcCT == kRGB_888x_SkColorType) {
      numComponents = 4;
  } else {
      switch (SkColorTypeNumChannels(srcCT)) {
          case 1: numComponents = 1; break;
          case 3: numComponents = 4; break;
          case 4: numComponents = 4; break;
          default: return false;
      }
  }
  fCInfo.input_components = numComponents;
  ```

  Good:

  ```cpp
  int numComponents = 0;
  if (srcCT == kRGB_888x_SkColorType) {
      numComponents = 4;
  } else {
      switch (SkColorTypeNumChannels(srcCT)) {
          case 1: numComponents = 1; break;
          case 3: numComponents = 4; break;
          case 4: numComponents = 4; break;
          default: return false;
      }
  }
  SkASSERT(numComponents != 0);
  fCInfo.input_components = numComponents;
  ```
include_glob:
- src/**
triggers:
- \bSkASSERT(?:_RELEASE)?\s*\([^)]*!=\s*(?:0|nullptr|NULL)\b
- \bSkASSERT(?:_RELEASE)?\s*\([^)]*!=\s*k[A-Za-z0-9_]+\b
- \bSkASSERT(?:_RELEASE)?\s*\([^)]*>\s*0\b
- \b(?:int|size_t|uint32_t|float|auto|[A-Za-z0-9_]+[*])\s+[a-zA-Z0-9_]+\s*=\s*(?:0|nullptr|NULL)\s*;
- \bswitch\s*\([^)]*(?:color|Color|channel|Channel|format|Format|type|Type|mode|Mode|kind|Kind|status|Status)\b
- \bcase\s+[A-Za-z0-9_:]+:\s*[a-zA-Z0-9_]+\s*=
confidence: 0.8
support_cl_count: 1
