id: general/short-circuit-safemath-loops-on-overflow
title: When accumulating sizes, counts, or offsets with SkSafeMath inside loops performing non-trivial
  work or allocations, include safe.ok() in the loop condition to short-circuit on overflow
polarity: do
severity: should_fix
rubric: safety
rule: When accumulating sizes, counts, or offsets with SkSafeMath inside a loop that performs non-trivial
  work, geometry processing, or allocations, include safe.ok() (or safeMath.ok()) in the loop condition
  to short-circuit iteration immediately upon overflow. Do not continue executing iterations once arithmetic
  overflow has already invalidated the computation and doomed the operation.
why: Once SkSafeMath detects an arithmetic overflow, safe.ok() becomes permanently false and the overall
  operation will fail and abort. Continuing loop iteration wastes CPU cycles, geometry processing, and
  intermediate memory allocations on operations whose results will immediately be discarded.
examples:
- |-
  Bad:

  ```cpp
  SkSafeMath safeMath;
  for (int i = 0; i < instanceCount; i++) {
      quadCount = safeMath.addInt(quadCount,
                                  gather_lines_and_quads(args.fPath, ...));
  }
  if (!safeMath.ok()) {
      return;
  }
  ```

  Good:

  ```cpp
  SkSafeMath safeMath;
  for (int i = 0; i < instanceCount && safeMath.ok(); i++) {
      quadCount = safeMath.addInt(quadCount,
                                  gather_lines_and_quads(args.fPath, ...));
  }
  if (!safeMath.ok()) {
      return;
  }
  ```
include_glob:
- src/**
- modules/**
triggers:
- \bfor\s*[(][^;]*;[^;]*\b(?:safe|safeMath|accum)[.]ok[(][)]
- \b(?:safe|safeMath)[.](?:add|mul|addInt|mulInt|subInt)\s*[(]
- \bSkSafeMath\s+[a-zA-Z0-9_]+
- \bif\s*[(]\s*!(?:safe|safeMath)[.]ok[(][)]\s*[)]
confidence: 0.9
support_cl_count: 1
