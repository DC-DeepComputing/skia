id: general/check-matrix-min-max-scale-for-negative
title: When computing scale factors or dimensions with SkMatrix::getMinScale() or getMaxScale(), check
  for negative return values before calculations or divisions
polarity: do
severity: should_fix
rubric: correctness
rule: When using SkMatrix::getMinScale() or getMaxScale() to compute scale factors, offsets, or stroke
  dimensions, check the return value for negative values (< 0 or -1) before using it in calculations or
  divisions. Provide an appropriate fallback value or early exit when the matrix contains perspective
  or overflows.
why: SkMatrix::getMinScale() and getMaxScale() return -1 if the matrix contains perspective or if scale
  factor calculations overflow. Using the returned scale directly without checking for negative values
  leads to inverted offsets, division by negative numbers, or invalid stroke geometry.
examples:
- |-
  Bad:

  ```cpp
  const float max_abs_offset = kMaxDevOffset / ctm.getMinScale();
  ```

  Good:

  ```cpp
  const float min_scale = ctm.getMinScale();
  const float max_abs_offset = min_scale < 0 ? kMaxDevOffset : kMaxDevOffset / min_scale;
  ```
include_glob:
- src/**
- include/**
- modules/**
triggers:
- \b(?:getMinScale|getMaxScale)\s*[(]
- \b(?:min_scale|max_scale|minScale|maxScale)\s*=\s*[^;]*[.]\b(?:getMinScale|getMaxScale)
- \b(?:min_scale|max_scale|minScale|maxScale)\s*(?:<|<=|==)\s*0
- \bSkScalarInvert\s*[(][^)]*[.]\b(?:getMinScale|getMaxScale)
- \b(?:sk_ieee_float_divide|SkScalarDiv)\s*[(][^,]+,\s*[^)]*[.]\b(?:getMinScale|getMaxScale)
- /[^;]*[.]\b(?:getMinScale|getMaxScale)\s*[(]
- \bSkMatrix::(?:getMinScale|getMaxScale)\b
citations:
- path: include/core/SkMatrix.h
  heading: SkMatrix::getMinScale
  quote: Returns -1 if scale factor overflows or SkMatrix contains perspective.
confidence: 0.9
support_cl_count: 1
