id: general/size-skarenaalloc-for-minimal-workloads
title: When configuring initial capacity for SkArenaAlloc or SkArenaAllocWithReset, size for minimal common
  workloads rather than peak capacity, relying on Fibonacci growth
polarity: do
severity: should_fix
rubric: safety
rule: When specifying the initial block size for SkArenaAlloc, SkArenaAllocWithReset, or SkSTArenaAlloc,
  size the initial allocation to accommodate minimal common workloads (e.g., 1–2 items or draws) rather
  than peak batch capacity. Rely on SkArenaAlloc's built-in Fibonacci block progression to scale allocation
  size for larger workloads.
why: SkArenaAlloc allocates subsequent blocks according to a Fibonacci progression, providing exponential
  capacity growth without excessive reallocations. Sizing initial allocations for peak capacity wastes
  memory on common small workloads or across numerous arena instances.
examples:
- |-
  Bad:

  ```cpp
  // Over-allocating initial capacity wastes memory for typical small workloads
  static constexpr uint32_t kDefaultAllocation = 4096;
  SkArenaAllocWithReset fStorage{kDefaultAllocation};
  ```

  Good:

  ```cpp
  // Sized to accommodate 1-2 items; Fibonacci block growth handles larger batches
  static constexpr uint32_t kDefaultAllocation = 256;
  SkArenaAllocWithReset fStorage{kDefaultAllocation};
  ```
include_glob:
- src/**
triggers:
- \b(?:Sk)?(?:ST)?ArenaAlloc(?:WithReset)?(?:<|\s|\(|\{)
- \bSkArenaAlloc(?:WithReset)?\s*\(
- \bSkSTArenaAlloc(?:WithReset)?<\d+>
- \bk(?:Default|Initial)(?:Alloc|Allocation|ArenaSize)\b
- \bfirstHeapAllocation\b
confidence: 0.8
support_cl_count: 1
