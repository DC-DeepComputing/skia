id: general/prefer-standard-verbs-for-task-initiation
title: When naming methods that initiate, schedule, or enqueue tasks or operations, use standard verbs
  like start, begin, or post instead of colloquial phrasal verbs like kickOff
polarity: do
severity: nit
rubric: readability
rule: Prefer conventional action verbs (such as start, begin, post, dispatch, or enqueue) over colloquial
  phrasal verbs (such as kickOff, spinUp, or fireOff) when naming methods that initiate, schedule, or
  dispatch tasks or operations.
why: Colloquial phrasal verbs like 'kickOff' or 'spinUp' are informal, non-standard in C++ API design,
  and inconsistent with established naming conventions across the codebase. Using standard action verbs
  provides clear, predictable, and uniform interfaces that match conventional task dispatch terminology.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Uses colloquial phrasal verb 'kickOff' to initiate task execution
  void kickOffPipelineCreationTask(ResourceProvider*,
                                   sk_sp<const RuntimeEffectDictionary>,
                                   const GraphicsPipelineHandle&);
  ```

  Good:

  ```cpp
  // Good: Uses standard action verb 'start' for task initiation
  void startPipelineCreationTask(ResourceProvider*,
                                 sk_sp<const RuntimeEffectDictionary>,
                                 const GraphicsPipelineHandle&);
  ```
include_glob:
- src/**
- include/**
triggers:
- \b(?:kickOff|spinUp|fireOff)[A-Z]\w*\b
- \b(?:void|bool|auto|sk_sp<[^>]+>)\s+(?:kickOff|spinUp|fireOff)\w*\s*\(
- \b(?:void|bool|auto|sk_sp<[^>]+>)\s+(?:start|begin|post|dispatch|enqueue)[A-Z]\w*(?:Task|Work|Job|Pipeline)\s*\(
- \b(?:start|begin|post|dispatch|enqueue|kickOff)[A-Z]\w*(?:Task|Work|Job)\b
confidence: 0.82
support_cl_count: 1
