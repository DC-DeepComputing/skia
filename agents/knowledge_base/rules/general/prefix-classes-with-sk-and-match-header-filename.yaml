id: general/prefix-classes-with-sk-and-match-header-filename
title: When declaring C++ classes, use Sk prefix (or Gr in Ganesh) matching header filenames, but scope
  backend types in backend namespaces (preferring CPU over Raster)
polarity: do
severity: should_fix
rubric: readability
rule: Name generic Skia C++ classes and structs with the standard Sk prefix and match the primary class
  name to its header filename (e.g., class SkStreamAdapter in SkStreamAdapter.h). In the Ganesh subsystem
  (src/gpu/ganesh/), use the legacy Gr prefix (e.g., GrBitmap) rather than introducing skgpu::ganesh.
  For modern backend-specific types (such as contexts and recorders in CPU or Graphite), scope classes
  in dedicated backend namespaces (e.g., namespace skcpu, namespace skgpu::graphite) without an Sk prefix
  (e.g., skcpu::Recorder), and prefer the modern term 'CPU' / 'cpu' (such as namespace skcpu) over legacy
  'Raster' terminology.
why: Skia designates codebase ownership and avoids global namespace collisions using the Sk prefix for
  core types and Gr in legacy Ganesh. Modern backends like Graphite and CPU isolate backend-specific types
  into dedicated lowercase namespaces, avoiding prefix clutter and reserving the Sk prefix for generic,
  backend-agnostic abstractions. Furthermore, 'Raster' is legacy terminology from when Skia was exclusively
  CPU-based, whereas 'CPU' clearly distinguishes CPU rendering from modern GPU backends.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Unprefixed top-level class diverging from header filename
  // In rust/common/SkStreamAdapter.h
  class StreamAdapter {
  public:
      explicit StreamAdapter(SkStream* stream);
  };

  // Bad: Using skgpu::ganesh namespace instead of Gr prefix in Ganesh
  // In src/gpu/ganesh/image/GrBitmap.h
  namespace skgpu::ganesh {
  class Bitmap {
  public:
      explicit Bitmap(SkBitmap b);
  };
  }

  // Bad: Using Sk prefix and legacy 'Raster' naming for backend-specific types
  // In include/core/SkRasterContext.h
  class SK_API SkRasterContext {
  public:
      std::unique_ptr<SkRasterRecorder> makeRecorder() const;
  };
  ```

  Good:

  ```cpp
  // Good: Prefixed with Sk and matching header filename
  // In rust/common/SkStreamAdapter.h
  class SkStreamAdapter {
  public:
      explicit SkStreamAdapter(SkStream* stream);
  };

  // Good: Gr-prefixed class in Ganesh
  // In src/gpu/ganesh/image/GrBitmap.h
  class GrBitmap {
  public:
      explicit GrBitmap(SkBitmap b);
  };

  // Good: Modern backend types scoped in dedicated backend namespace using 'cpu'
  // In include/cpu/Context.h
  namespace skcpu {
  class SK_API Context {
  public:
      std::unique_ptr<Recorder> makeRecorder() const;
  };
  }  // namespace skcpu
  ```
include_glob:
- '**/*.h'
exclude_glob:
- third_party/**
- include/third_party/**
triggers:
- ^\s*(?:class|struct)\s+(?:SK_API\s+)?[A-Z][A-Za-z0-9_]*
- \b(?:class|struct)\s+(?:SK_API\s+)?(?:Sk|Gr)[A-Z][A-Za-z0-9_]*
- \bnamespace\s+skgpu::(?:ganesh|graphite)\b
- \bnamespace\s+sk(?:cpu|raster)\b
- \b(?:class|struct)\s+(?:SK_API\s+)?SkRaster[A-Za-z0-9_]*
- ^#include\s+[\\\"<](?:[A-Za-z0-9_/-]+/)?(?:Sk|Gr)[A-Za-z0-9_]+\.h[\\\">]
citations:
- path: site/docs/dev/contrib/style.md
  heading: '## Naming'
  quote: Most externally visible types and functions use an Sk- prefix to designate they're part of Skia,
    but code in Ganesh uses Gr-. Nested types need not be prefixed.
