id: general/prefer-getropixels-over-makerasterimage
title: When extracting pixels from an SkImage in internal Skia code, use as_IB(img)->getROPixels instead
  of allocating an intermediate SkImage with makeRasterImage
polarity: dont
severity: should_fix
rubric: safety
rule: When extracting pixels from an SkImage for inspection, encoding, or exporting in internal Skia code,
  do not allocate an intermediate SkImage via img->makeRasterImage(). Instead, downcast to SkImage_Base
  via as_IB(img) and call getROPixels(ctx, &bitmap) to obtain a read-only pixel copy directly in an SkBitmap.
why: Public APIs like makeRasterImage() allocate a temporary intermediate SkImage wrapper before pixels
  can be accessed via peekPixels(). Internal Skia callers have direct access to SkImage_Base::getROPixels(),
  which populates an SkBitmap directly without heap-allocating an intermediate SkImage wrapper or churning
  reference counts.
examples:
- |-
  Bad:

  ```cpp
  sk_sp<SkImage> raster_image = img->makeRasterImage(ctx);
  if (!raster_image) {
      return nullptr;
  }
  SkPixmap pixmap;
  if (!raster_image->peekPixels(&pixmap)) {
      return nullptr;
  }
  return Encode(pixmap, options);
  ```

  Good:

  ```cpp
  SkBitmap bm;
  if (!as_IB(img)->getROPixels(ctx, &bm)) {
      return nullptr;
  }
  return Encode(bm.pixmap(), options);
  ```
include_glob:
- src/**
triggers:
- \bmakeRasterImage\s*[(]
- \bgetROPixels\s*[(]
- \bas_IB\s*[(]
- \bpeekPixels\s*[(]
- \bSkImage_Base\b
confidence: 0.92
support_cl_count: 1
