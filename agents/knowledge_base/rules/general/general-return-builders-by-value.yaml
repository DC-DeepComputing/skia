id: general/general-return-builders-by-value
title: When defining or returning builder classes, provide public constructors and value semantics with
  Builder& chaining instead of heap-allocating via std::unique_ptr
polarity: do
severity: should_fix
rubric: design
rule: Design builder classes with public constructors and value semantics, and return Builder& from fluent
  chaining methods rather than heap-allocating via static Make() methods returning std::unique_ptr<Builder>.
  When instantiating or returning builders from helper or factory functions, return concrete builder types
  by value so callers can use auto and invoke methods directly on the stack without pointer indirection,
  even across conditionally compiled (#ifdef) branches.
why: Builders are transient configuration helpers meant to assemble state on the stack. Wrapping them
  in std::unique_ptr with private constructors introduces unnecessary dynamic allocation overhead and
  pointer indirection (->), whereas value semantics with Builder& chaining simplify call sites, avoid
  allocator churn, and allow clean deduction via auto.
examples:
- |-
  Bad:

  ```cpp
  // Heap-allocated builder with pointer chaining and factory returning unique_ptr:
  class DisplayParamsBuilder {
  public:
      static std::unique_ptr<DisplayParamsBuilder> Make();
      DisplayParamsBuilder* setScale(float s);
  private:
      DisplayParamsBuilder();
  };
  static std::unique_ptr<DisplayParamsBuilder> make_builder() {
      return DisplayParamsBuilder::Make();
  }
  ```

  Good:

  ```cpp
  // Value-semantic builder with reference chaining and helper returning by value:
  class DisplayParamsBuilder {
  public:
      DisplayParamsBuilder();
      DisplayParamsBuilder& setScale(float s);
  };
  static DisplayParamsBuilder make_builder() {
      return DisplayParamsBuilder();
  }
  ```
include_glob:
- '**/*.h'
- '**/*.cpp'
- '**/*.cc'
triggers:
- \bstd::unique_ptr<\s*[A-Za-z0-9_:]*Builder\s*>
- \bstd::make_unique<\s*[A-Za-z0-9_:]*Builder\b
- \b(?:class|struct)\s+\w*Builder\b
- \b[A-Za-z0-9_:]*Builder\s*&\s+[a-z][A-Za-z0-9_]*\s*[(]
- \b[A-Za-z0-9_:]*Builder\s*\*\s+[a-z][A-Za-z0-9_]*\s*[(]
- \bstatic\s+std::unique_ptr<[A-Za-z0-9_:]*Builder>\s+Make\b
- \b[A-Za-z0-9_:]*Builder\s+(?:make|create|Make|Create)[A-Za-z0-9_]*\s*[(]
- \bmake_[a-z0-9_]*builder\s*[(]
confidence: 0.9
