id: general/document-offset-binary-bias-ranges
title: When packing signed values into unsigned integer or SIMD registers using offset-binary bias, document
  the bias constant and mapped range rather than only casts
polarity: do
severity: nit
rubric: readability
rule: When packing signed values into unsigned integer or SIMD registers using an offset-binary bias (such
  as adding 0x80 to map signed values into unsigned byte lanes for SWAR arithmetic), document the bias
  addition and the mapped input/output value ranges in accompanying comments. Do not document only the
  intermediate sign-extension or integer casts while leaving the arithmetic bias and representation invariants
  unexplained.
why: Offset-binary or biased representations introduce non-obvious arithmetic offsets and magic constants
  (such as 0x80 for signed bytes) that invert sign-bit conventions. Documenting both the bias addition
  and the mapped input/output range ensures maintainers understand the encoding invariant and prevents
  off-by-one or overflow errors during range adjustments.
examples:
- |-
  Bad:

  ```cpp
  // Cast to int8_t to sign extend before casting to uint8_t
  windingByte = 0x80 + static_cast<uint8_t>(static_cast<int8_t>(fCoarseWinding));
  ```

  Good:

  ```cpp
  // Cast to i8 to sign extend before casting to u8, then apply SWAR bias to map -127/128 to 0/255.
  windingByte = 0x80 + static_cast<uint8_t>(static_cast<int8_t>(fCoarseWinding));
  ```
include_glob:
- src/**
triggers:
- \b(?:0x80|0x8000|128)\s*\+\s*(?:static_cast|SkTo|\([a-z0-9_]*uint)
- static_cast<uint\d+_t>\s*\(\s*static_cast<int\d+_t>
- //.*\b(?:SWAR|offset[ -]binary|bias.*map|sign extend before casting)\b
- \b[a-zA-Z0-9_]*(?:Winding|winding)Byte\b
- \b(?:fCoarseWinding|vSubsampleWinding)\b
- \b(?:0x80|128)\s*[-+]\s*static_cast<
confidence: 0.9
support_cl_count: 1
