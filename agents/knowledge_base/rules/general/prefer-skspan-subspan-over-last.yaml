id: general/prefer-skspan-subspan-over-last
title: When dropping a prefix of elements from an SkSpan or std::span, use span.subspan(offset) instead
  of span.last(span.size() - offset)
polarity: do
severity: should_fix
rubric: readability
rule: When advancing a span or dropping a consumed prefix of elements from an SkSpan (or std::span), use
  span.subspan(offset) rather than span.last(span.size() - offset). Avoid manually calculating span.size()
  - offset to obtain the suffix subspan.
why: SkSpan::subspan(offset) directly returns a subspan from the specified element offset to the end of
  the span. Computing span.size() - offset and passing it to last() is redundant, less readable, and obscures
  the intent of advancing through the span.
examples:
- |-
  Bad:

  ```cpp
  pts = pts.last(pts.size() - rc->fPointsConsumed);
  vbs = vbs.last(vbs.size() - rc->fVerbsConsumed);
  ```

  Good:

  ```cpp
  pts = pts.subspan(rc->fPointsConsumed);
  vbs = vbs.subspan(rc->fVerbsConsumed);
  ```
include_glob:
- src/**
- include/**
- modules/**
- tests/**
triggers:
- \.(?:subspan|last)\s*[(]
- \.last\s*[(][^)]*\.size\s*[(][)]\s*-
- \blast\s*[(][^)]*size[(][)]\s*-
- \b(?:subspan|last)\s*[(][^)]*(?:Consumed|Offset|offset|count|Count|size|Size)
- \b[a-zA-Z0-9_]+\s*=\s*[a-zA-Z0-9_]+\.(?:subspan|last)\s*[(]
confidence: 0.88
support_cl_count: 1
