id: general/group-state-updates-before-external-calls
title: When updating internal state tracking fields before external calls or callbacks, group related
  member assignments together before the call rather than interleaving them
polarity: do
severity: nit
rubric: readability
rule: Group updates to related internal state tracking member variables (such as sizes, sequence numbers,
  and dirty flags) together rather than interleaving them with external calls, callbacks, or side effects.
  Perform all internal state transitions before transferring control to external handlers or client callbacks.
why: Grouping updates to related state tracking variables keeps internal transitions cohesive and readable.
  It also ensures that the object's internal tracking state is fully synchronized and consistent before
  control passes to external handlers, callbacks, or listeners that might inspect state or trigger re-entrant
  operations.
examples:
- |-
  Bad:

  ```cpp
  fLastKnownSize = origDataSize;
  externalStorage->store(*SkData::MakeWithoutCopy(data.get(), cappedDataSize));

  fHasNewData = false;
  ```

  Good:

  ```cpp
  fLastKnownSize = origDataSize;
  fHasNewData = false;
  externalStorage->store(*SkData::MakeWithoutCopy(data.get(), cappedDataSize));
  ```
include_glob:
- src/**
triggers:
- \bfHas[A-Z]\w*\s*=\s*(?:true|false)\b
- \bf[A-Z]\w*(?:Dirty|Valid|State|Data|Cache|Size|Count)\s*=\s*
- ->(?:store|save|flush|notify|callback|on[A-Z]\w*)\s*[(]
- \bfLastKnown[A-Z]\w*\s*=
- \b(?:persistentPipelineStorage|externalStorage|storage)->
confidence: 0.82
support_cl_count: 1
