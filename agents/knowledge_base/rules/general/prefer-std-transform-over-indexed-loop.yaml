id: general/prefer-std-transform-over-indexed-loop
title: When converting or mapping elements from a source range to a destination container, prefer std::transform
  over manual indexed for loops
polarity: do
severity: should_fix
rubric: readability
rule: Prefer standard algorithms like std::transform over manual indexed for loops when converting, casting,
  or mapping elements from a source range to a destination container. Pre-size the destination buffer
  using resize() and pass data() or std::back_inserter to write the transformed elements.
why: Standard algorithms express element-wise transformations declaratively, eliminate manual index variables,
  bounds checking boilerplate, and off-by-one errors. They clearly communicate intent and allow compiler
  optimizations over contiguous memory.
examples:
- |-
  Bad:

  ```cpp
  fColors4f.resize(src.size());
  for (size_t i = 0; i < src.size(); ++i) {
      fColors4f[i] = SkColor4f::FromColor(src[i]);
  }
  ```

  Good:

  ```cpp
  fColors4f.resize(src.size());
  std::transform(src.begin(), src.end(), fColors4f.data(), [](SkColor c) {
      return SkColor4f::FromColor(c);
  });
  ```
include_glob:
- src/**
- modules/**
triggers:
- \bstd::transform\s*[(]
- \bfor\s*[(][^;]*\b(?:size_t|int|uint32_t)\s+[a-z0-9_]+\s*=\s*0\s*;[^;]*<
- \bfor\s*[(][^;]*=[^;]*<\s*[a-zA-Z0-9_.]*\.(?:size|count)[(][)]
- \.(?:resize|reserve)\s*[(][^)]*[)]
- \[[a-zA-Z0-9_]+\]\s*=\s*[A-Za-z0-9_:]+(?:::From[A-Z]|::Make[A-Z]|::Convert)\w*\s*[(]
confidence: 0.82
support_cl_count: 1
