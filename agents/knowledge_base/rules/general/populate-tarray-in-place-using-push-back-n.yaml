id: general/populate-tarray-in-place-using-push-back-n
title: When querying C-style enumeration or query APIs into skia_private::TArray or STArray, expand the
  container in-place using push_back_n instead of allocating temporary heap buffers
polarity: dont
severity: should_fix
rubric: safety
rule: When populating skia_private::TArray or STArray from C-style enumeration or query APIs (such as
  Vulkan or platform queries that take a pointer and count to write into), do not allocate temporary raw
  heap buffers (new[]/delete[]) or intermediate vectors before copying. Instead, grow the container in-place
  using push_back_n(count) and pass the pointer to the newly allocated elements directly to the C API.
why: Allocating temporary heap buffers with new[] and delete[] introduces unnecessary allocation churn,
  manual cleanup hazards on error paths, and redundant copy loops. Calling push_back_n(count) allocates
  directly into container storage and updates size() consistently for range iteration.
examples:
- |-
  Bad:

  ```cpp
  // BAD: Allocates temporary heap array, requiring manual cleanup and redundant copying
  auto tempExts = new VkExtensionProperties[extCount];
  if (vkEnumerateInstanceExtensionProperties(layerName, &extCount, tempExts) != VK_SUCCESS) {
      delete[] tempExts;
      return false;
  }
  extensions.push_back_n(extCount, tempExts);
  delete[] tempExts;
  ```

  Good:

  ```cpp
  // GOOD: Expands container in-place and passes pointer directly to C query API
  VkExtensionProperties* newExts = extensions.push_back_n(extCount);
  if (vkEnumerateInstanceExtensionProperties(layerName, &extCount, newExts) != VK_SUCCESS) {
      return false;
  }
  ```
include_glob:
- src/**
- tools/**
triggers:
- \bnew\s+[A-Za-z0-9_:]+\s*[[]
- \bdelete\s*\[\\]\s*[A-Za-z0-9_]+
- \.(?:push_back_n|resize_back)\s*[(]
- \bpush_back_n\s*[(][^,)]+[)]
- '&[a-zA-Z0-9_]+[[]'
- \b(?:VkExtensionProperties|VkLayerProperties)\b
confidence: 0.9
support_cl_count: 1
