id: general/pass-buffer-offset-directly-instead-of-temporary-copy
title: When passing contiguous sub-arrays to functions accepting pointer or array parameters, pass the
  buffer offset or sub-span directly instead of copying into a temporary buffer
polarity: dont
severity: should_fix
rubric: safety
rule: When passing contiguous sub-arrays or slices of existing buffers to functions taking pointer or
  array parameters, pass the buffer pointer offset (such as ptr + index) or sub-span directly. Do not
  declare temporary local stack arrays and copy elements into them before calling the function.
why: In C++, array function parameters decay to pointers. When contiguous elements already reside in memory,
  copying them into a local stack buffer introduces unnecessary memory copying and stack allocation overhead.
  Passing the pointer offset or sub-span directly avoids redundant copying while allowing the callee to
  access the sub-array in place.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Copying contiguous elements into a temporary local array
  SkPoint clip[4];
  if (imageSet[i].fHasClip) {
      for (int j = 0; j < 4; ++j) {
          clip[j] = dstClips[dstClipIndex + j];
      }
  }
  this->onDrawEdgeAAQuad(drawDst, clip, ...);
  ```

  Good:

  ```cpp
  // Good: Pass buffer pointer offset directly without copying
  const SkPoint* clip = imageSet[i].fHasClip ? dstClips + dstClipIndex : nullptr;
  this->topDevice()->drawEdgeAAImageSet(&imageSet[i], 1, clip, ...);
  ```
include_glob:
- src/**
- include/**
- modules/**
triggers:
- \b(?:SkPoint|SkIPoint|SkRect|SkColor4f|SkScalar|float|int)\s+[a-zA-Z0-9_]+\s*\[\s*[0-9]+\s*\]
- \b[a-zA-Z0-9_]*(?:Clips?|Points?|Data|Buffer|Bytes?|Array|Indices|quads?|verts|vertices)\s*\+\s*[a-zA-Z0-9_]*(?:index|offset|Index|Offset)\b
- \b[a-zA-Z0-9_]+\[\s*[a-zA-Z0-9_]*(?:index|offset|Index|Offset)\s*\+\s*[a-zA-Z0-9_]+\s*\]
- \bdrawEdgeAA(?:Quad|ImageSet)\s*[(]
- \b(?:topDevice|device)->drawEdgeAA\w*\s*[(]
confidence: 0.9
support_cl_count: 1
