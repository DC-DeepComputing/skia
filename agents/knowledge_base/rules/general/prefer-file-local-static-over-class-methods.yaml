id: general/prefer-file-local-static-over-class-methods
title: When defining single-use, internal, or debug helper functions, inline them at call sites or define
  file-static in .cpp files instead of header member functions
polarity: dont
severity: should_fix
rubric: design
rule: 'Do not declare translation-unit-local, single-use, or debug helper functions as member functions
  or inline helpers in class headers, especially when guarded by conditional compilation (#ifdef SK_DEBUG,
  #ifdef GPU_TEST_UTILS) or implementable via existing class accessors. For straightforward single-use
  operations or API wrappers, inline the call directly at the call site in the .cpp file. For non-trivial
  or debug verification helpers used within a single translation unit, define them as file-local static
  functions (using lower_case_with_underscores naming) or in an anonymous namespace in the .cpp implementation
  file.'
why: 'Declaring internal or debug helpers in class headers clutters class interfaces, exposes internal
  verification details, leaks #ifdef guards, and triggers unnecessary recompilation across translation
  units. Keeping helpers file-static in .cpp files preserves proper encapsulation and avoids header compilation
  dependencies.'
examples:
- |-
  Bad:

  ```cpp
  // In ClassHeader.h:
  class SkPathData {
      static SkPathData* PeekEmptySingleton();
  };
  #ifdef SK_DEBUG
      void checkDimensionsExpection(SkISize expected) const;
  #endif
  static inline void transform_scanline_rgba(char* dst, const char* src, int w) {
      SkAssertResult(skcms_Transform(src, ..., dst, ..., w));
  }
  ```

  Good:

  ```cpp
  // In ClassSource.cpp (file-local static helper):
  static SkPathData* peek_empty_singleton() {
      static SkPathData* gEmpty = ...;
      return gEmpty;
  }

  #ifdef SK_DEBUG
  static void check_dimensions_match_target(const GrSurfaceProxy* proxy, SkISize expected) {
      if (GrSurface* target = proxy->peekSurface()) {
          SkASSERT(target->dimensions() == expected);
      }
  }
  #endif

  // Inlined directly at call site:
  if (!skcms_Transform(src, ..., dst, ..., width)) {
      return false;
  }
  ```
include_glob:
- src/**
triggers:
- ^\s*static\s+(?:constexpr\s+|inline\s+)?[A-Za-z0-9_:]+(?:<[^>]+>)?(?:\s*\*|\s*&)?\s+[A-Za-z0-9_]+\s*[(]
- \b[A-Za-z0-9_]+::(?:check|validate|verify|peek|get|is)[A-Za-z0-9_]*\s*[(]
- '#\s*(?:if|ifdef)\s+.*(?:SK_DEBUG|GPU_TEST_UTILS|TEST_UTILS)'
- \bstatic\s+inline\s+[A-Za-z0-9_:]+
- ^\s*namespace\s*[{]
- \b(?:peek_empty_singleton|PeekEmptySingleton|get_gpu_access_pattern|check_dimensions|checkDimensions)\w*\b
