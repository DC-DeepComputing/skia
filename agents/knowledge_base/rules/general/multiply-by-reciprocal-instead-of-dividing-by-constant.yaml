id: general/multiply-by-reciprocal-instead-of-dividing-by-constant
title: When scaling by constants in performance-sensitive code or raster pipeline stages, multiply by
  compile-time reciprocal constants instead of performing runtime division
polarity: do
severity: nit
rubric: safety
rule: In performance-sensitive code (such as raster pipeline stages, color conversion kernels, and hot
  math loops), multiply by the compile-time reciprocal of a constant (e.g., `* (1/510.f)` or `* (1.0f
  / 255.0f)`) rather than dividing by the constant (`/ 510.f`).
why: Floating-point division instructions have significantly higher latency and lower throughput than
  multiplication, causing pipeline stalls in tight loops and vector execution units. Because floating-point
  division and multiplication by reciprocals can produce different rounding, compilers cannot perform
  this transformation automatically without fast-math flags.
examples:
- |-
  Bad:

  ```cpp
  // Runtime division stalls vector execution units
  *r = (cast((rgba      ) & 0x3ff) - 384.f) / 510.f;
  *a = (cast((rgba >> 30)        )        ) / 3.f;
  float normalized = byte_val / 255.0f;
  ```

  Good:

  ```cpp
  // Compile-time reciprocal multiplication maximizes IPC and throughput
  *r = (cast((rgba      ) & 0x3ff) - 384.f) * (1/510.f);
  *a = (cast((rgba >> 30)        )        ) * (1/3.f);
  float normalized = byte_val * (1.0f / 255.0f);
  ```
include_glob:
- src/**
- modules/skcms/**
triggers:
- /(?:\s*|\s*\()[0-9]+(?:\.[0-9]*)?f?\b
- \*\s*\(\s*1(?:\.0?f?)?\s*/
- \bcast(?:64)?\s*\(
- \b(?:inv_|kInv|kOneOver|kReciprocal|inv_scale|inv_width|inv_height)\w*\b
- \b(?:STAGE|HIGHP_STAGE|LOWP_STAGE)\s*\(
- \b(?:from_1010102|from_16161616|to_1010102|to_16161616)\b
citations:
- path: tools/raster_pipeline/README.md
  heading: IPC (Instructions Per Cycle)
  quote: Low IPC often indicates stalls due to long-latency instructions (like `div` or `gather`) or data
    dependencies.
confidence: 0.92
support_cl_count: 1
