- \b[a-zA-Z0-9_]+(?:\.|->)(?:fX|fY|x\(\)|y\(\))\s*==\s*0\b
- \b[a-zA-Z0-9_]+\s*[(][a-zA-Z0-9_]+[0-9]?,\s*[a-zA-Z0-9_]+[0-9]?[)]\s*(?:&&|\|\||&|\|)
- '[(][a-zA-Z0-9_]+[0-9]?(?:\.|->)(?:fX|fY)\s*==\s*0[)]\s*\^\s*[(][a-zA-Z0-9_]+[0-9]?(?:\.|->)(?:fX|fY)\s*==\s*0[)]'
