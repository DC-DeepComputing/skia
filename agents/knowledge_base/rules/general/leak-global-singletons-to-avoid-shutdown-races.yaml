id: general/leak-global-singletons-to-avoid-shutdown-races
title: When managing process-wide singletons accessed by background threads, intentionally leak them with
  SK_INTENTIONALLY_LEAKED instead of deleting them in atexit handlers
polarity: dont
severity: should_fix
rubric: safety
rule: Do not delete process-wide global singletons or service handlers in atexit() handlers when background
  worker threads may still access them during application shutdown. Intentionally leak the singleton instead,
  marking the pointer with SK_INTENTIONALLY_LEAKED(...) to satisfy leak sanitizers, and perform any necessary
  shutdown flushing via an onExit() callback rather than the destructor.
why: In multithreaded applications, worker threads can remain active and access global services (such
  as event tracers or loggers) during process termination. Deleting singletons in atexit() creates data
  races and use-after-free crashes with concurrent threads; leaking instances keeps them valid until process
  teardown, while SK_INTENTIONALLY_LEAKED suppresses false positives in leak sanitizers.
examples:
- |-
  Bad:

  ```cpp
  bool SkEventTracer::SetInstance(SkEventTracer* tracer, bool leakTracer) {
      ...
      if (!leakTracer) {
          atexit([]() {
              auto tracer = gUserTracer.exchange(nullptr);
              delete tracer;
          });
      }
      return true;
  }
  ```

  Good:

  ```cpp
  bool SkEventTracer::SetInstance(SkEventTracer* tracer) {
      ...
      // Once set, `tracer` remains alive until the process is destroyed.
      SK_INTENTIONALLY_LEAKED(tracer);
      atexit([]() { GetInstance()->onExit(); });
      return true;
  }
  ```
include_glob:
- src/**
triggers:
- \batexit\s*\(
- \bSK_INTENTIONALLY_LEAKED\s*\(
- \bstd::atomic<[A-Za-z0-9_:]+\*>
- \b(?:Set|Get)Instance\s*\(
- \b__lsan_ignore_object\b
citations:
- path: RELEASE_NOTES.md
  heading: Milestone 148
  quote: Previously, with `leakTracer=false` the `SkEventTracer` would be deleted in an `atexit` handler,
    but this could lead to race conditions in a multithreaded application during process exiting. Leaking
    the object at exit is effectively the same behavior but avoids the races.
confidence: 0.95
support_cl_count: 1
