id: general/align-macro-table-columns
title: When defining or updating multi-line macro tables with multiple arguments, vertically align parameter
  columns across lines and align trailing line-continuation backslashes
polarity: do
severity: nit
rubric: readability
rule: When defining or updating multi-line macro tables (X-macros) with multiple arguments, vertically
  align parameter columns across lines so the arguments form uniform columns. Keep trailing line-continuation
  backslashes aligned across all lines in the macro definition.
why: Code formatters do not automatically align macro arguments across calls. Manually aligning parameter
  columns and trailing line-continuation backslashes makes large tabular macro definitions easier to scan,
  verify, and diff.
examples:
- |-
  Bad:

  ```cpp
  #define SKGPU_RENDERSTEP_TYPES(M1, M2) \
      M1(Invalid) \
      M2(CoverBounds, NonAAFill) \
      M2(BitmapText, Mask) \
      M2(BitmapText, LCD)
  ```

  Good:

  ```cpp
  #define SKGPU_RENDERSTEP_TYPES(M1, M2)              \
      M1(Invalid)                                     \
      M2(CoverBounds,      NonAAFill)                 \
      M2(BitmapText,       Mask)                      \
      M2(BitmapText,       LCD)
  ```
include_glob:
- '**/*.h'
- '**/*.cpp'
triggers:
- ^\s*M\d?\s*\([^)]*,\s*[^)]*\)
- \bM\d?\s*\([^)]*,\s*[^)]*\)
- '#define\s+[A-Z0-9_]+\s*\([^)]*\bM\d?\b[^)]*\)'
- '#define\s+[A-Z0-9_]+_(?:TYPES|OPS|LIST|COMMANDS|MAPPING)\b'
- \\\$\s*$
confidence: 0.9
support_cl_count: 1
