id: general/sync-virtual-subclass-contract-comments
title: When refactoring base class virtual methods or subclass hooks, update doc comments to reflect changes
  in caller preconditions and override responsibilities
polarity: do
severity: nit
rubric: readability
rule: When modifying base class virtual methods or subclass hooks (such as NVI on* methods), update accompanying
  doc comments whenever caller preconditions, default fallback behavior, or override responsibilities
  change. Explicitly document what helpers, resource resets, or preconditions derived classes must invoke
  or satisfy, rather than leaving obsolete comments that misstate subclass obligations.
why: When refactoring shifts responsibilities—such as delegating stream rewinding or state setup to derived
  overrides or optional helpers rather than guaranteeing preconditions before dispatch—stale doc comments
  mislead subclass implementers into omitting required helper calls or relying on obsolete base guarantees.
examples:
- |-
  Bad:

  ```cpp
  /**
   *  Called by rewindIfNeeded, if the stream needed to be rewound.
   *
   *  Subclasses should do any set up needed after a rewind.
   */
  virtual bool onRewind() {
      if (!this->rewindStream()) {
          return false;
      }
      return true;
  }
  ```

  Good:

  ```cpp
  /**
   *  Called by rewindIfNeeded, if the stream needed to be rewound.
   *
   *  Subclasses should call rewindStream() if they own one, and then
   *  do any set up needed after.
   */
  virtual bool onRewind() {
      if (!this->rewindStream()) {
          return false;
      }
      return true;
  }
  ```
include_glob:
- '**/*.h'
triggers:
- \bvirtual\s+(?:void|bool|[A-Za-z0-9_:]+)\s+on[A-Z]\w*\s*\(
- \bvirtual\s+[A-Za-z0-9_:<>]+\s+[a-z][A-Za-z0-9_]*\s*\([^;{}]*\)\s*(?:override|final)?\s*(?:=\s*0|;|\{)
- (?://|[*])\s*.*(?:[Ss]ubclasses?|[Oo]verrides?|[Dd]erived classes?)\s+(?:should|must|can|need|are expected)\b
- (?://|[*])\s*.*(?:[Cc]alled by|[Ii]nvoked by)\s+[a-zA-Z0-9_]+(?:\(\))?
- (?://|[*])\s*.*(?:subclass contract|override responsibility|precondition for subclasses)\b
- \b(?:rewindIfNeeded|onRewind|rewindStream)\b
citations:
- path: site/docs/dev/contrib/style.md
  heading: Classes
  quote: A common pattern for virtual methods in Skia is to include a public non-virtual (or final) method,
    paired with a private virtual method named "onMethodName".
confidence: 0.85
support_cl_count: 1
