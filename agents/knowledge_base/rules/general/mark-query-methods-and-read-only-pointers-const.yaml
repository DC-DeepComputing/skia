id: general/mark-query-methods-and-read-only-pointers-const
title: When declaring non-mutating query methods, accessors, member comparison operators, or read-only
  pointer parameters, mark methods const and qualify unmutated pointers as const T*
polarity: do
severity: should_fix
rubric: readability
rule: Mark member functions, accessors, query methods, predicates, and member comparison operators (such
  as operator== and operator!= on iterators or value types) const whenever they only read member state
  and do not modify the object. When passing pointers to unmutated objects or input descriptors to such
  helpers, declare the parameter as pointer-to-const (const T*) rather than a mutable pointer (T*).
why: Const-qualifying non-mutating methods and comparison operators ensures they can be invoked on const
  instances and references (such as const Iter& in standard algorithms), documents lack of side effects,
  and catches unintended mutations at compile time. Qualifying read-only pointer parameters as pointer-to-const
  enforces interface const-correctness and prevents accidental mutation of caller data.
examples:
- |-
  Bad:

  ```cpp
  // Non-const member comparison operator on iterator or value type
  struct Iter {
      bool operator!=(const Iter& b) { return fVerb != b.fVerb; }
  };

  // Non-const query method taking mutable pointer to read-only input
  bool willBufferOverflow(BufferInfo* info, uint32_t requiredBytes, uint32_t requiredAlignment);

  // Non-const accessor that only reads member fields
  skia_private::TArray<uint32_t> getBufferInfo() {
      return fInfo;
  }
  ```

  Good:

  ```cpp
  // Const member comparison operator safe for const instances and references
  struct Iter {
      bool operator!=(const Iter& b) const { return fVerb != b.fVerb; }
  };

  // Const query method taking pointer-to-const for unmutated input
  std::pair<bool, uint32_t> willBufferOffsetOverflow(const BufferInfo* info,
                                                     uint32_t requiredBytes,
                                                     uint32_t requiredAlignment) const;

  // Const accessor safe for const instances
  skia_private::TArray<uint32_t> getBufferInfo() const {
      return fInfo;
  }
  ```
include_glob:
- src/**
- include/**
- modules/**
- tools/**
