id: general/avoid-string-allocation-in-trace-loops
title: When recording trace events inside loops or hot paths, avoid dynamic string allocations and emit
  shared context in an enclosing trace scope instead
polarity: dont
severity: should_fix
rubric: safety
rule: Avoid dynamic string allocations, formatting, or concatenation (such as std::string addition or
  SkStringPrintf) inside loops or per-element trace events. Restructure trace calls hierarchically by
  emitting shared contextual labels in an enclosing trace scope (e.g., TRACE_EVENT0), or precompute and
  cache static string descriptors before the loop.
why: Dynamic string allocations and heap formatting inside frequent or looped trace events introduce significant
  CPU overhead that artificially inflates execution times and distorts profiling results. Emitting shared
  context once in an outer trace scope keeps inner trace points lightweight while preserving full diagnostic
  context.
examples:
- |-
  Bad:

  ```cpp
  for (int i = 0; i < pipelines.size(); ++i) {
      TRACE_EVENT_INSTANT1_ALWAYS(
              "skia.shaders",
              TRACE_STR_COPY((desc.toLabel() + " + " + pipelines[i]->label()).c_str()),
              TRACE_EVENT_SCOPE_THREAD,
              "area", drawAreas[i]);
  }
  ```

  Good:

  ```cpp
  TRACE_EVENT0_ALWAYS("skia.shaders", TRACE_STR_COPY(desc.toLabel().c_str()));
  for (int i = 0; i < pipelines.size(); ++i) {
      TRACE_EVENT_INSTANT1_ALWAYS(
              "skia.shaders",
              TRACE_STR_COPY(pipelines[i]->label().c_str()),
              TRACE_EVENT_SCOPE_THREAD,
              "area", drawAreas[i]);
  }
  ```
include_glob:
- src/**
triggers:
- \bTRACE_EVENT\w*\s*\(
- \bTRACE_EVENT_INSTANT\w*\s*\(
- \bTRACE_STR_COPY\s*\(
- \bTRACE_STR_STATIC\s*\(
- \bTRACE_EVENT_SCOPE_\w+\b
confidence: 0.9
support_cl_count: 1
