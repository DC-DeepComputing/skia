id: general/include-benchmarks-for-commit-perf-claims
title: When claiming performance improvements in commit messages, substantiate speedup claims with before-and-after
  benchmark numbers and include corresponding microbenchmarks under bench/
polarity: do
severity: should_fix
rubric: readability
rule: When claiming a performance optimization, speedup (e.g., 'faster'), or algorithmic improvement in
  a commit message, substantiate the claim with before/after benchmark measurements (e.g., nanobench numbers).
  In addition, include the corresponding benchmark implementations under `bench/` (and register them in
  `gn/bench.gni`) using `DEF_BENCH` and nanobench conventions so results are verifiable and monitored
  for regressions on Skia Perf.
why: Performance claims must be backed by empirical evidence so reviewers and maintainers can evaluate
  whether the optimization achieves its intended speedup and justifies any added complexity. Including
  the underlying benchmark implementations in the repository ensures performance gains are reproducible
  and allows continuous integration on Skia Perf (perf.skia.org) to guard against regressions.
examples:
- |-
  Bad:

  ```cpp
  // Unsubstantiated performance claim in commit message without benchmark numbers:
  Offer (much) faster version of mapping 1 point

  - new benchmark for single-point mappers
  - add linked single-point mappers (w/ and w/o perspective check)

  // Quoting benchmark numbers in commit message but omitting benchmark source from CL:
  Optimize PathIterator traversal by caching contour endpoints.

  nanobench results:
    min     median  config        bench
    2.53µs  2.54µs  nonrendering  pathiter_pathiter
    3.09µs  3.09µs  nonrendering  pathiter_olditer
  // (CL modifies src/core/SkPath.cpp but adds no benchmark code under bench/)
  ```

  Good:

  ```cpp
  // Commit message substantiates speedup claim with before/after numbers:
  Offer faster version of mapping 1 point

  - new benchmark for single-point mappers
  - add linked single-point mappers (w/ and w/o perspective check)

  Benchmark results (nanobench on Linux):
  mappt_p_identity: 12.3ns -> 4.1ns (~3x faster)
  mappt_p_affine:   24.5ns -> 8.2ns (~3x faster)

  // Corresponding benchmark implementation is included in bench/ and gn/bench.gni:
  class PathIterBench : public Benchmark {
      const char* onGetName() override { return "pathiter_pathiter"; }
      void onDraw(int loops, SkCanvas*) override { /* ... */ }
  };
  DEF_BENCH(return new PathIterBench();)
  ```
include_glob:
- '**/COMMIT_MSG'
citations:
- path: site/docs/dev/testing/_index.md
  heading: Testing
  quote: We also have a robust set of performance tests, served by the nanobench tool and accessible via
    the Skia Perf (https://perf.skia.org) web interface.
- path: agents/skills/skia-gn-workflow/references/nanobench_usage.md
  heading: Performance Baselines
  quote: 'To accurately measure the impact of a change, it is recommended to keep a "control" version
    of the benchmark binary: 1. Build the baseline (e.g., in `out/Release`). 2. Copy the binary to a stable
    location: `cp out/Release/nanobench ./nanobench_control`. 3. Apply your changes and rebuild `out/Release/nanobench`.
    4. Run both and compare: `./nanobench_control ...` vs `out/Release/nanobench ...`.'
confidence: 0.98
support_cl_count: 3
