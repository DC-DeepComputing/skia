id: general/prefer-standard-array-subscript-syntax
title: When indexing arrays or raw pointers, use standard array[index] subscript notation rather than
  inverted index[array] syntax permitted by pointer commutativity
polarity: do
severity: nit
rubric: readability
rule: When indexing arrays or raw pointers, always use standard array[index] subscript notation rather
  than inverted index[array] syntax. Never place the array identifier or pointer expression inside the
  square brackets.
why: In C and C++, array subscripting E1[E2] is defined as *((E1) + (E2)), which makes pointer and integer
  operands commutative. However, inverted subscripting like index[array] or (mask)[table] is unintuitive,
  violates standard coding idioms, and obscures which operand is the container and which is the index.
examples:
- |-
  Bad:

  ```cpp
  return (width & 0xF)[width_for_usWidth];
  ```

  Good:

  ```cpp
  return width_for_usWidth[width & 0xF];
  ```
include_glob:
- src/**
- include/**
- modules/**
- tests/**
- tools/**
triggers:
- '[)]\s*[[]\s*[A-Za-z0-9_]+'
- '[[]\s*k?[A-Za-z0-9_]*(?:Table|table|Array|array|LUT|Map|Strings|usWidth)'
- \b(?:0x[0-9a-fA-F]+|\d+)\s*[[]
- '[&|^+-]\s*[)]\s*[[]'
- \bwidth_for_usWidth\b
- \b[a-zA-Z0-9_]+\s*[[]\s*[a-zA-Z_]\w*(?:Table|Array|LUT|Map)
confidence: 0.84
support_cl_count: 1
