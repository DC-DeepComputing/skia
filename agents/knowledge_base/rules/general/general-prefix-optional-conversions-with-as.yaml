id: general/general-prefix-optional-conversions-with-as
title: When declaring methods returning std::optional, use canonical getter or as* conversion names rather
  than conditional prefixes like getIf* or predicate is*
polarity: do
severity: should_fix
rubric: readability
rule: When naming methods that return std::optional<T>, use canonical getter names (e.g., getPath()) or
  the as* prefix for queries extracting specialized representations (e.g., asOval(), asBlendMode()). Do
  not invent conditional prefixes like getIf* (such as getIfPath()), and reserve the is* prefix exclusively
  for boolean predicates that return bool (e.g., isConvex(), isEmpty()).
why: In Skia conventions, returning std::optional<T> already communicates that the requested object or
  representation may not be present, so inventing conditional prefixes like getIf* is redundant and unidiomatic.
  Similarly, method names starting with is* conventionally denote boolean predicates returning bool; using
  is* for optional returns misleads callers into expecting a boolean check rather than an extracted representation.
examples:
- |-
  Bad:

  ```cpp
  // Returns optional representation but uses boolean predicate prefix 'is'
  std::optional<SkPathOvalInfo> isOval() const;
  std::optional<SkBlendMode> isBlendMode() const;

  // Returns std::optional but uses redundant conditional prefix 'getIf'
  std::optional<SkPath> getIfPath(SkGlyphID glyphID) const;
  ```

  Good:

  ```cpp
  // Uses 'as*' prefix for optional conversion/representation extraction
  std::optional<SkPathOvalInfo> asOval() const;
  std::optional<SkBlendMode> asBlendMode() const;

  // Uses canonical getter name; std::optional expresses potential absence
  std::optional<SkPath> getPath(SkGlyphID glyphID) const;

  // Uses 'is*' prefix exclusively for boolean predicates returning bool
  bool isOval() const;
  bool isConvex() const;
  ```
include_glob:
- '**/*.h'
triggers:
- \bstd::optional<[^>]+>\s+(?:is|getIf|as)[A-Z]\w*\s*\(
- \bstd::optional<[^>]+>\s+get[A-Z]\w*\s*\(
- \bstd::optional<[A-Za-z0-9_:]+>\s+[a-z][A-Za-z0-9_]*\s*\([^)]*\)\s*const
- \b(?:as|is)(?:Oval|Rect|RRect|BlendMode|Dash|Arc|Line)\s*\(
- \bgetIf[A-Z]\w*\s*\(
- \b(?:virtual\s+)?std::optional<[A-Za-z0-9_:]+>\s+(?:as|is|getIf)[A-Z]\w*\s*\(
confidence: 0.95
support_cl_count: 2
