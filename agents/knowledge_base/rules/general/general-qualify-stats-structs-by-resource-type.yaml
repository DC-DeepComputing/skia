id: general/general-qualify-stats-structs-by-resource-type
title: When declaring statistics or metrics structs in multi-resource managers or caches, qualify struct
  names and counter fields with the specific resource type
polarity: do
severity: nit
rubric: readability
rule: When declaring statistics, metrics, or diagnostic structs and counter fields in a class that manages
  or caches multiple distinct resource types, qualify the struct name and its member variables with the
  specific resource type being measured (e.g., PipelineStats with fGraphicsCacheHits) rather than using
  generic names like Stats or fCacheHits.
why: In classes that manage heterogeneous resources or multiple pipeline types, generic names like Stats
  or fCacheHits are ambiguous about which asset type is being measured and prevent clean additions of
  metrics for other managed resources in the future.
examples:
- |-
  Bad:

  ```cpp
  // In a class managing multiple resources (pipelines, shaders, buffers):
  struct Stats {
      int fCacheHits = 0;
      int fCacheMisses = 0;
      int fCacheAdditions = 0;
      int fRaces = 0;
  };
  Stats getStats() const;
  ```

  Good:

  ```cpp
  // In a class managing multiple resources (pipelines, shaders, buffers):
  struct PipelineStats {
      int fGraphicsCacheHits = 0;
      int fGraphicsCacheMisses = 0;
      int fGraphicsCacheAdditions = 0;
      int fGraphicsRaces = 0;
  };
  PipelineStats getStats() const;
  ```
include_glob:
- src/**
- include/**
triggers:
- \b(?:struct|class)\s+[A-Za-z0-9_]*(?:Stats|Metrics)\b
- \b(?:int|uint(?:32|64)_t|size_t)\s+f[A-Za-z0-9_]*(?:CacheHits|CacheMisses|Races|Purges|Additions)\b
- \b(?:int|uint(?:32|64)_t|size_t)\s+fCache(?:Hits|Misses|Additions|Purges|Races)\b
- \b(?:PipelineStats|ResourceStats|CacheStats|TextureStats|BufferStats)\b
- \b(?:report|dump|get|reset)[A-Za-z0-9_]*(?:CacheStats|PipelineStats|ResourceStats)\s*\(
- \b(?:PipelineStats|ResourceStats|CacheStats)\s+f[A-Za-z0-9_]*Stats\b
confidence: 0.85
support_cl_count: 1
