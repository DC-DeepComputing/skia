id: general/document-positive-macro-mappings-for-negative-flags
title: When defining or refactoring preprocessor configuration flags that map negative macros to positive
  internal flags, include explanatory comments justifying the indirection to avoid double negations
polarity: do
severity: should_fix
rubric: readability
rule: When defining or refactoring preprocessor configuration flags, preserve or add explanatory comments
  that justify non-obvious macro mappings—especially when deriving positive internal macros (such as SK*_USE_*)
  from negative external build flags (such as SK*_DISABLE_*). Explicitly document that the positive internal
  flag is used to avoid confusing double-negation checks across downstream code.
why: 'External build systems and client configs frequently expose negative toggles (e.g., SK*_DISABLE_*),
  but referencing them internally leads to confusing double-negation expressions (such as !defined(SK*_DISABLE_*)
  or #if !SK*_DISABLE_*). Mapping negative flags to positive internal macros clarifies conditional logic,
  but without an explanatory comment, maintainers may view the mapping as redundant indirection and remove
  it during refactoring.'
examples:
- |-
  Bad:

  ```cpp
  #if defined(SKVX_DISABLE_SIMD)
  #define SKVX_USE_SIMD 0
  #else
  #define SKVX_USE_SIMD 1
  #endif
  ```

  Good:

  ```cpp
  // Use SKVX_USE_SIMD internally to avoid confusing double negation.
  #if defined(SKVX_DISABLE_SIMD)
  #define SKVX_USE_SIMD 0
  #else
  #define SKVX_USE_SIMD 1
  #endif
  ```
include_glob:
- '**/*.h'
triggers:
- ^#\s*define\s+[A-Za-z0-9_]*(?:USE|ENABLE|SUPPORT)_[A-Za-z0-9_]+
- ^#\s*(?:el)?if\s+!?defined\s*[(]\s*[A-Za-z0-9_]*(?:DISABLE|NO)_[A-Za-z0-9_]+
- \b[A-Za-z0-9_]*(?:DISABLE|NO)_[A-Za-z0-9_]+\b
- \b[A-Za-z0-9_]*(?:USE|ENABLE)_[A-Za-z0-9_]+\s+(?:0|1)\b
- //.*\b(?:double negation|avoid.*negation|internally to avoid)\b
confidence: 0.88
support_cl_count: 1
