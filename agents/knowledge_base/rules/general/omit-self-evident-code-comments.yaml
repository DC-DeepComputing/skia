id: general/omit-self-evident-code-comments
title: When writing function bodies, switch cases, or dispatch tables, omit redundant comments that narrate
  self-evident operations and reserve comments for non-obvious invariants
polarity: dont
severity: nit
rubric: readability
rule: Do not add comments to functions, switch cases, or dispatch tables that merely narrate or restate
  what the code clearly does (such as noting that a feature or flag is being enabled). Reserve comments
  for explaining why an approach was chosen, subtle edge cases, or non-obvious invariants and preconditions
  that cannot be deduced from reading the implementation.
why: Restating self-explanatory code line-by-line adds visual clutter and cognitive overhead without technical
  insight. In repetitive dispatch patterns or switch cases, an isolated narrative comment breaks uniformity
  and misleadingly implies an unusual deviation or special handling where none exists. Comments that mirror
  the implementation also drift out of sync over time.
examples:
- |-
  Bad:

  ```cpp
  // Redundant function narration:
  // Update backend label to match fLabel and mark clean.
  void synchronizeBackendLabel() {
      if (!fLabel.empty()) {
          this->setBackendLabel(("Skia_" + fLabel).c_str());
      }
      fBackendLabelDirty = false;
  }

  // Redundant switch case comment:
  case VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_FRAME_BOUNDARY_FEATURES_EXT: {
      chain(newChainEnd, pNext);
      // Enable the main feature
      if (exts.fFrameBoundaryEXT) {
          auto* features = reinterpret_cast<VkPhysicalDeviceFrameBoundaryFeaturesEXT*>(pNext);
          features->frameBoundary = VK_TRUE;
      }
      toAdd.fFrameBoundary = false;
      break;
  }
  ```

  Good:

  ```cpp
  void synchronizeBackendLabel() {
      if (!fLabel.empty()) {
          this->setBackendLabel(("Skia_" + fLabel).c_str());
      }
      fBackendLabelDirty = false;
  }

  case VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_FRAME_BOUNDARY_FEATURES_EXT: {
      chain(newChainEnd, pNext);
      if (exts.fFrameBoundaryEXT) {
          auto* features = reinterpret_cast<VkPhysicalDeviceFrameBoundaryFeaturesEXT*>(pNext);
          features->frameBoundary = VK_TRUE;
      }
      toAdd.fFrameBoundary = false;
      break;
  }
  ```
include_glob:
- src/**
- include/**
- modules/**
triggers:
- //\s*(?:Update|Set|Reset|Clear|Check|Compute|Synchronize|Initialize|Ensure|Enable|Disable)\s+(?:the\s+|a\s+|an\s+)?[a-zA-Z0-9_]+
- //\s*(?:Whether|If)\s+.*\b(?:dirty|success(?:ful)?|no-op|empty|null|valid|override)\b
- //\s*.*\b(?:f[A-Z]\w*)\s+(?:to\s+be|to\s+match|is\s+set|to\s+true|to\s+false)\b
- //\s*(?:Sets?|Updates?|Assigns?|Copies?|Enables?|Disables?)\s+(?:the\s+)?[a-zA-Z0-9_]+\s+to\b
- //\s*(?:Call|Invoke|Return|Pass)\s+(?:the\s+|a\s+)?[a-zA-Z0-9_]+
- //\s*(?:Enable|Disable|Configure|Handle)\s+(?:the\s+|this\s+)?[a-zA-Z0-9_]+
confidence: 0.85
support_cl_count: 2
