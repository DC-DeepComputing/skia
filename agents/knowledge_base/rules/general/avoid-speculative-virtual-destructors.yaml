- \bvirtual\s+(?:const\s+)?[A-Za-z0-9_:*&<>]+\s+on[A-Z]\w*\s*[(]
- \bvirtual\s+(?:const\s+)?[A-Za-z0-9_:*&<>]+\s+(?:get|is|has)[A-Z]\w*\s*[(]
- \bclass\s+[A-Za-z0-9_]+Adapter\b
- \bvirtual\s+~[A-Za-z0-9_]+\s*\(\s*\)\s*=\s*default
