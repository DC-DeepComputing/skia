id: general/pass-templated-callables-by-value
title: When declaring functions that accept templated callable or lambda parameters, pass them by value
  or forwarding reference rather than const reference
polarity: do
severity: should_fix
rubric: readability
rule: When declaring functions that accept templated callables, lambdas, or visitor functors, pass the
  callable parameters by value (e.g., `Fn fn`) or forwarding reference (`Fn&& fn`) rather than by const
  reference (`const Fn&`). Reserve `const&` parameter passing for heavy, non-inlined wrappers such as
  `std::function`.
why: Closures and custom functors passed as template arguments are typically small, lightweight, and inlined
  directly by the compiler. Passing them by value or forwarding reference keeps function signatures clean,
  enables moving or mutating captured state when invoked, and avoids unnecessary pointer indirection without
  incurring copying overhead.
examples:
- |-
  Bad:

  ```cpp
  template <typename AddToBlendKeyT, typename AddSrcToKeyT, typename AddDstToKeyT>
  void Blend(const KeyContext& keyContext,
             PaintParamsKeyBuilder* keyBuilder,
             PipelineDataGatherer* gatherer,
             const AddToBlendKeyT& addBlendToKey,
             const AddSrcToKeyT& addSrcToKey,
             const AddDstToKeyT& addDstToKey);
  ```

  Good:

  ```cpp
  template <typename AddToBlendKeyT, typename AddSrcToKeyT, typename AddDstToKeyT>
  void Blend(const KeyContext& keyContext,
             PaintParamsKeyBuilder* keyBuilder,
             PipelineDataGatherer* gatherer,
             AddToBlendKeyT addBlendToKey,
             AddSrcToKeyT addSrcToKey,
             AddDstToKeyT addDstToKey);
  ```
include_glob:
- src/**
- include/**
triggers:
- \bconst\s+[A-Za-z0-9_]*(?:Fn|Func|Function|Callback|Visitor|Invocable|Callable|Predicate|Op|Action|Handler|KeyT)&\s*\w+
- \btemplate\s*<[^>]*\b(?:typename|class)\s+[A-Za-z0-9_]*(?:Fn|Func|Function|Callback|Visitor|Invocable|Callable|KeyT)\b
- (?:[(,]\s*)const\s+[A-Za-z0-9_]+(?:Fn|Func|Callback|Visitor|Invocable|Callable|KeyT)&
- \b(?:Fn|Func|Callback|Visitor|Invocable)&&\s+\w+
- (?:[(,]\s*)(?:const\s+)?[A-Z][A-Za-z0-9_]*T(?:&|\s+)\s*add(?:Blend|Src|Dst)ToKey
confidence: 0.9
support_cl_count: 1
