id: general/prefer-sk-make-sp-over-raw-new
title: When instantiating ref-counted objects managed by sk_sp, use sk_make_sp<T>(...) rather than passing
  bare new to the sk_sp constructor
polarity: do
severity: nit
rubric: readability
rule: When instantiating ref-counted objects managed by sk_sp, use sk_make_sp<T>(...) instead of passing
  bare new to the sk_sp<T> constructor. Pair sk_make_sp with auto for local declarations to avoid repeating
  the type name.
why: sk_make_sp<T>(...) is Skia's canonical factory helper for instantiating ref-counted objects into
  an sk_sp, encapsulating raw memory allocation and avoiding bare calls to new. Pairing sk_make_sp with
  auto eliminates redundant type repetition.
examples:
- |-
  Bad:

  ```cpp
  sk_sp<SkPngCompositeChunkReader> compositeReader(new SkPngCompositeChunkReader(chunkReader));
  ```

  Good:

  ```cpp
  auto compositeReader = sk_make_sp<SkPngCompositeChunkReader>(chunkReader);
  ```
include_glob:
- src/**
- include/**
- modules/**
- tests/**
- tools/**
- gm/**
triggers:
- \bsk_sp<[^;>]+>\s+\w+\s*[({]\s*new\b
- \bsk_sp<[^;>]+>\s*[(]\s*new\b
- =\s*sk_sp<[^;>]+>\s*[(]\s*new\b
- \breturn\s+sk_sp<[^;>]+>\s*[(]\s*new\b
- \bsk_make_sp<[A-Za-z0-9_:]+>\s*[(]
confidence: 0.82
support_cl_count: 1
