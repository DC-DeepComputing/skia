id: general/const-variable-internal-linkage
title: When declaring namespace- or file-scope const variables in C++ files, do not require adding 'static'
  as non-extern const objects have internal linkage by default
polarity: dont
severity: nit
rubric: readability
rule: Do not require adding 'static' to namespace- or file-scope 'const' (or 'constexpr') variables to
  achieve internal linkage. In C++, non-extern and non-inline const variables declared at namespace scope
  already have internal linkage by default, making 'static' redundant for symbol isolation.
why: In C++, namespace-scope const variables that are not explicitly declared 'extern' or 'inline' automatically
  receive internal linkage according to the language standard ([basic.link]). Requesting or requiring
  'static' on file-scope const data is unnecessary and reflects C rather than C++ linkage semantics.
examples:
- |-
  Bad:

  ```cpp
  // Reviewer comment: "Please add 'static' so this doesn't pollute the global symbol table"
  static const SkPathVerb gTriangle_Verbs[] = {
      SkPathVerb::kMove,
      SkPathVerb::kLine,
      SkPathVerb::kLine,
      SkPathVerb::kClose,
  };
  ```

  Good:

  ```cpp
  // Correct: const variables at namespace scope already have internal linkage by default in C++.
  const SkPathVerb gTriangle_Verbs[] = {
      SkPathVerb::kMove,
      SkPathVerb::kLine,
      SkPathVerb::kLine,
      SkPathVerb::kClose,
  };
  ```
include_glob:
- '**/*.cpp'
- '**/*.cc'
triggers:
- ^const\s+[A-Za-z0-9_:]+\s+[a-zA-Z0-9_]+\[\]
- ^const\s+[A-Za-z0-9_:]+(?:<[^>]+>)?\s+[gk][A-Z]\w*
- ^static\s+const\s+[A-Za-z0-9_:]+
- ^constexpr\s+[A-Za-z0-9_:]+(?:<[^>]+>)?\s+[gk][A-Z]\w*
- ^static\s+constexpr\s+[A-Za-z0-9_:]+
- \bconst\s+SkPathVerb\b
confidence: 0.85
support_cl_count: 1
