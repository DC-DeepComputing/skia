id: general/order-rect-edge-constants-ltrb
title: When defining rectangular or tile edge constants, enum flags, or bitmasks, order them starting
  with Left (orthodox LTRB or LRTB) rather than vertical-first
polarity: do
severity: should_fix
rubric: readability
rule: When defining edge or boundary constants, enum flags, bitmasks, or struct layouts for rectangles,
  quads, or tiles, order them starting with Left (using Skia's orthodox LTRB or LRTB convention matching
  SkRect and QuadAAFlags) rather than vertical-first (such as TBLR). When legacy constraints require a
  non-standard order, document the rationale and add a TODO to align with LRTB.
why: Skia standardizes rectangular geometry, edge flags, and vector swizzles around Left-first ordering
  (LTRB in SkRect and SkSL, and LRTB in QuadAAFlags). Ordering edge constants or bitmasks vertical-first
  (T, B, L, R) violates codebase conventions, creates confusion across coordinate transforms, and risks
  mismatch bugs when interacting with standard Skia rect and quad APIs.
examples:
- |-
  Bad:

  ```cpp
  struct IntersectionBits {
      // Non-standard vertical-first edge ordering (TBLR):
      static constexpr uint32_t T = 1 << 0;
      static constexpr uint32_t B = 1 << 1;
      static constexpr uint32_t L = 1 << 2;
      static constexpr uint32_t R = 1 << 3;
  };
  ```

  Good:

  ```cpp
  struct IntersectionBits {
      // Follow orthodox Skia edge ordering (LTRB, matching SkRect and QuadAAFlags):
      static constexpr uint32_t L = 1 << 0;
      static constexpr uint32_t T = 1 << 1;
      static constexpr uint32_t R = 1 << 2;
      static constexpr uint32_t B = 1 << 3;
  };
  ```
include_glob:
- src/**
- include/**
triggers:
- \b(?:Edge|Quad|Rect|Intersection|Tile)(?:AA)?(?:Flags?|Bits?|Mask)\b
- \b(?:static\s+)?constexpr\s+uint\d+_t\s+[TBLR]\s*=\s*
- \bk[A-Z]\w*(?:Left|Top|Right|Bottom)(?:Edge)?\s*=\s*
- \bk(?:Left|Top|Right|Bottom)[A-Za-z0-9_]*(?:Flag|Mask|Bit)\b
- \b(?:kLeft|kTop|kRight|kBottom)\s*=\s*(?:1u?\s*<<|0b)
- \b(?:QuadAAFlags|GrQuadAAFlags)\b
citations:
- path: src/sksl/README.md
  heading: What's Missing / What's Different
  quote: Swizzle components, in addition to the normal rgba / xyzw components, can also be LTRB (meaning
    "left/top/right/bottom", for when we store rectangles in vectors)
confidence: 0.9
support_cl_count: 1
