id: general/group-mutable-member-variables
title: When declaring C++ class member variables, group mutable fields together in the member section
  rather than interspersing them among const or regular data members
polarity: do
severity: nit
rubric: readability
rule: When declaring member variables in C++ classes or structs, group mutable fields together (typically
  at the end of the private member data section) rather than interspersing them among const or regular
  member variables. Keep any thread-safety annotations or lazy initialization comments adjacent to the
  grouped mutable fields.
why: Mutable member variables bypass C++ const-correctness guarantees and can be mutated inside const
  methods. Grouping them together clarifies class memory layout and allows maintainers to readily audit
  which state is modified during const operations or requires synchronization.
examples:
- |-
  Bad:

  ```cpp
  class AnimationBuilder {
  private:
      Animation::Builder::Stats*     fStats;
      mutable std::vector<LayerInfo> fLayerInfo; // Interspersed among regular and const fields
      const SkSize                   fCompSize;
      mutable AnimatorScope*         fCurrentAnimatorScope;
      const uint32_t                 fFlags;
  };
  ```

  Good:

  ```cpp
  class AnimationBuilder {
  private:
      Animation::Builder::Stats*     fStats;
      const SkSize                   fCompSize;
      const uint32_t                 fFlags;

      // Group mutable fields together for clear const-correctness and thread-safety inspection:
      mutable std::vector<LayerInfo> fLayerInfo;
      mutable AnimatorScope*         fCurrentAnimatorScope;
  };
  ```
include_glob:
- '**/*.h'
- '**/*.cpp'
- '**/*.cc'
exclude_glob:
- third_party/**
triggers:
- \bmutable\s+[A-Za-z0-9_:]+(?:<[^>]+>)?\s+f[A-Z]\w*
- \bmutable\s+(?:std::vector|SkTDArray|skia_private::TArray|sk_sp|std::unique_ptr|std::optional)<
- \bmutable\s+std::atomic<
- \bmutable\s+(?:bool|int|uint\d+_t|size_t|float|double|char)\s+
- \bmutable\s+(?:SkOnce|SkMutex|SkSpinlock|std::mutex|SingleOwner)\b
confidence: 0.82
support_cl_count: 1
