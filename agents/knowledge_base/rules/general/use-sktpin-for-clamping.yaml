id: general/use-sktpin-for-clamping
title: When bounding or clamping numeric values, use SkTPin for ranges and std::min or std::max for limits
  instead of if branches or std::clamp
polarity: do
severity: nit
rubric: readability
rule: When clamping or pinning numeric values between lower and upper bounds, use Skia's utility helper
  SkTPin(val, min, max) rather than open-coding nested std::max/std::min calls, invoking std::clamp, or
  using mutable variables with if branches. When bounding a value to a single upper or lower limit, initialize
  the variable directly (qualified with const) using std::min or std::max rather than declaring a mutable
  variable and capping it in a subsequent if block. For narrowing conversions of clamped values, wrap
  the result in checked helpers like SkToU32 or SkTo<T> instead of raw static_cast.
why: SkTPin and standard algorithms (std::min, std::max) express bounding intent concisely, eliminate
  unnecessary branching and mutable local state, and allow the resulting variables to be declared const.
  In addition, SkTPin consistently handles NaN by returning the lower bound (unlike std::clamp), and SkTo<T>
  verifies in debug builds via assertions that the bounded value safely fits the destination type.
include_glob:
- src/**
- include/**
- modules/**
- experimental/**
- tools/**
- tests/**
- gm/**
triggers:
- \bstd::(?:max|min)\s*[(][^,;]+,\s*std::(?:max|min)\b
- \bstd::clamp\s*[(]
- \bSkTPin(?:<[^>]+>)?\s*[(]
- \bSkTo(?:U32|U16|U8|Int|SizeT)?\s*[(]\s*SkTPin
- \bstatic_cast<\s*(?:uint[0-9]+_t|int[0-9]+_t|u?int|size_t)\s*>\s*[(][^)]*\b(?:std::(?:max|min|clamp)|SkTPin)
- \b(?:const\s+)?(?:[a-zA-Z0-9_:]+\s+)?[a-zA-Z0-9_]+\s*=\s*std::(?:min|max)\s*[(]
- '#include\s+[\"<]include/private/SkTPin\.h[\">]'
confidence: 0.95
support_cl_count: 2
