- \b(?:int|uint\d+_t|size_t|bool|float|double)\s+f[A-Z]\w*\s*(?:=|;)
- \b[A-Za-z0-9_:]+(?:Type|Mode|Kind|Format|Coverage|State|Flags?|Direction|Order)\s+f[A-Z]\w*\s*(?:=|;)
