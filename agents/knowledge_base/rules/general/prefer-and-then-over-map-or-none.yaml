id: general/prefer-and-then-over-map-or-none
title: When mapping a Rust Option with a closure that returns an Option, use opt.and_then(...) instead
  of opt.map_or(None, ...)
polarity: do
severity: nit
rubric: readability
rule: When transforming a Rust Option with a closure that returns an Option, use opt.and_then(...) instead
  of opt.map_or(None, ...) or .map(...).unwrap_or(None). Reserve opt.map_or(default, ...) for non-optional
  default fallback values.
why: Option::and_then is Rust's canonical monadic bind/flatten operation. Using map_or(None, ...) is verbose,
  redundant, and obscures the intent of chaining fallible operations.
examples:
- |-
  Bad:

  ```cpp
  // Verbose and unidiomatic flattening of nested Option
  let format = outlines.map_or(None, |o| o.format());
  ```

  Good:

  ```cpp
  // Idiomatic monadic bind using and_then
  let format = outlines.and_then(|o| o.format());
  ```
include_glob:
- '**/*.rs'
triggers:
- \.map_or\s*[(]\s*None\b
- \.and_then\s*[(]
- \.map_or\s*[(]
- \.map\s*[(][^)]*[)]\s*\.unwrap_or\s*[(]\s*None\b
- \.map\s*[(][^)]*[)]\s*\.flatten\s*[(]
confidence: 0.9
support_cl_count: 1
