id: general/name-baseline-constants-after-logical-state
title: When declaring baseline reference constants or masks for encoded or biased comparisons, name them
  after the evaluated logical state rather than encoding mechanics
polarity: do
severity: nit
rubric: readability
rule: When declaring baseline reference constants or masks used to test encoded, biased, or offset representations
  (such as offset-binary SWAR winding), name the identifier after the evaluated logical condition or state
  (e.g., emptyBytes or emptySWARMask) rather than the underlying mathematical encoding (e.g., biasBytes).
  Ensure identifier names match the semantic terminology used in accompanying comments and documentation.
why: Naming baseline constants after mathematical encoding mechanics (such as bias offsets) obscures the
  condition being checked in comparisons and diverges from accompanying explanatory comments. Naming constants
  after the logical state (such as empty or uncovered) makes downstream comparison expressions self-describing
  and clarifies algorithmic intent.
examples:
- |-
  Bad:

  ```cpp
  // For the Non-Zero case, we compare subsample winding against the empty SWAR mask.
  const Vec8 biasBytes(0x80);
  Vec8 cmp = (vecBytes != biasBytes);
  ```

  Good:

  ```cpp
  // For the Non-Zero case, we compare subsample winding against the empty SWAR mask.
  const Vec8 emptyBytes(0x80);
  Vec8 cmp = (vecBytes != emptyBytes);
  ```
include_glob:
- src/**
triggers:
- \b(?:const\s+)?Vec\d*\s+[a-zA-Z0-9_]*(?:Bytes|Mask)\s*\(
- \b(?:const|constexpr)\s+[a-zA-Z0-9_:]+\s+[a-zA-Z0-9_]*(?:Bias|bias|Offset|offset)[A-Z]\w*\b
- \b(?:empty|zero|uncovered|baseline|bias|emptySWAR)[A-Z]\w*(?:Mask|Bytes|Val|Value)\b
- //.*\b(?:compare|comparison|against).*\b(?:SWAR|bias|baseline|empty mask|reference mask)\b
- \b(?:vecBytes|subsampleWinding)\s*(?:==|!=)\s*[a-zA-Z0-9_]+\b
- \b[a-zA-Z0-9_]*(?:Mask|Bytes)\s*\(\s*(?:0x80|0x8000|128)\s*\)
confidence: 0.88
support_cl_count: 1
