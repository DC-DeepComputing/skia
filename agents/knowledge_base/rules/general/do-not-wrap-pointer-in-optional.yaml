id: general/do-not-wrap-pointer-in-optional
title: When returning, passing, or storing nullable values, do not wrap raw pointers, smart pointers (sk_sp),
  or composite types containing them in std::optional
polarity: dont
severity: should_fix
rubric: design
rule: Do not wrap raw pointers (T*), smart pointers (such as sk_sp<T> or std::unique_ptr<T>), or composite
  types containing them (such as std::tuple, std::pair, or structs) in std::optional in function return
  types, parameters, or member variables. Use the pointer or composite type directly, relying on nullptr
  or an empty smart pointer state to represent absence or failure.
why: Pointers and smart pointers already encode absence or failure via nullptr or an empty state. Wrapping
  them directly or wrapping composite types containing them in std::optional introduces redundant nested
  nullability (e.g. std::nullopt vs nullptr), increases template nesting complexity, and forces callers
  to perform redundant checks for both optional engagement and pointer validity.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Wrapping raw or smart pointers, or tuples containing them, in std::optional.
  std::tuple<CompressedPaintersOrder, std::optional<Layer*>> updateClipStateForDraw(
          const Clip& clip,
          const ElementList& effectiveElements,
          const BoundsManager*,
          PaintersDepth z);

  std::optional<sk_sp<Buffer>> getStaticVertexBuffer();

  using ClipResult = std::optional<std::tuple<sk_sp<TextureProxy>, SkIPoint>>;
  ClipResult findOrCreateEntry(uint32_t stackRecordID,
                               const ClipStack::ElementList* elements,
                               SkIRect maskDeviceBounds);
  ```

  Good:

  ```cpp
  // Good: Return raw/smart pointers or tuples directly and rely on null/empty pointer state.
  std::tuple<CompressedPaintersOrder, Layer*> updateClipStateForDraw(
          const Clip& clip,
          const ElementList& effectiveElements,
          const BoundsManager*,
          PaintersDepth z);

  sk_sp<Buffer> getStaticVertexBuffer();

  using ClipResult = std::tuple<sk_sp<TextureProxy>, SkIPoint>;
  ClipResult findOrCreateEntry(uint32_t stackRecordID,
                               const ClipStack::ElementList* elements,
                               SkIRect maskDeviceBounds);
  ```
include_glob:
- src/**
- include/**
- modules/**
triggers:
- \bstd::optional<(?:sk_sp|std::unique_ptr|std::shared_ptr)<
- \bstd::optional<[^>]*\*\s*>
- \bstd::optional<(?:const\s+)?[A-Za-z0-9_:]+\s*\*
- (?:std::)?(?:tuple|pair)<[^>]*std::optional<
- \bstd::optional<(?:std::)?(?:tuple|pair)<
- \bfindOrCreateEntry\b
- \bgetStaticVertexBuffer\b
- \bupdateClipStateForDraw\b
