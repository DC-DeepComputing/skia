id: general/prefer-direct-boolean-assignment
title: When initializing or updating boolean flags from conditions or bitmasks, assign boolean expressions
  directly (using SkToBool for bitmasks) instead of branching
polarity: do
severity: should_fix
rubric: readability
rule: Prefer direct boolean assignment (`flag = condition;`, or `flag = SkToBool(mask & kBit);` for bitmasks)
  over branching constructs like `if (!condition) { flag = false; }` or nested `if` checks when setting
  or deriving boolean flags. Compute and initialize boolean flags directly upfront before branching on
  combinations of them, eliminating unnecessary control flow and flattening subsequent conditionals.
why: Direct boolean assignment eliminates repetitive branching boilerplate, avoids redundant bitwise evaluations,
  and flattens nested conditionals, making flag initialization and downstream logic concise, cohesive,
  and easy to read.
examples:
- |-
  Bad:

  ```cpp
  // Variant 1: Conditional flag synchronization
  if (!exts.fSynchronization2KHR) {
      toAdd.fSynchronization2 = false;
  }

  // Variant 2: Nested branching instead of upfront bitmask flag assignment
  if (!(formatFeatures & VK_FORMAT_FEATURE_SEPARATE_RECONSTRUCTION_FILTER_BIT)) {
      if (!(formatFeatures & VK_FORMAT_FEATURE_FILTER_LINEAR_BIT)) {
          fChromaFilter = VK_FILTER_NEAREST;
      }
      fSamplerFilterMustMatchChromaFilter = true;
  }
  fSupportsLinearFilter = SkToBool(formatFeatures & VK_FORMAT_FEATURE_FILTER_LINEAR_BIT);
  ```

  Good:

  ```cpp
  // Variant 1: Direct boolean assignment
  toAdd.fSynchronization2 = exts.fSynchronization2KHR;

  // Variant 2: Compute boolean flags upfront from bitmasks
  fSamplerFilterMustMatchChromaFilter =
          !SkToBool(formatFeatures & VK_FORMAT_FEATURE_SEPARATE_RECONSTRUCTION_FILTER_BIT);
  fSupportsLinearFilter = SkToBool(formatFeatures & VK_FORMAT_FEATURE_FILTER_LINEAR_BIT);
  if (fSamplerFilterMustMatchChromaFilter && !fSupportsLinearFilter) {
      fChromaFilter = VK_FILTER_NEAREST;
  }
  ```
include_glob:
- src/**
- include/**
- modules/**
- tests/**
- tools/**
triggers:
- \b\w+\.f[A-Z]\w*\s*=\s*(?:true|false)\s*;
- \bf[A-Za-z0-9_]*\s*=\s*!?SkToBool\s*[(]
- \bif\s*[(]\s*!?\w+(?:\.\w+)?\s*[)]\s*\{?\s*[^;]+\s*=\s*(?:true|false)\s*;
- \bif\s*[(]\s*!?\s*[(]?\s*[A-Za-z0-9_.]+\s*&\s*[A-Za-z0-9_:]+
- \s*=\s*[^;?]+\s*\?\s*(?:true|false)\s*:\s*(?:true|false)\s*;
- \bf[A-Z]\w*\s*=\s*(?:true|false)\s*;
- '[&]\s*(?:VK_[A-Z0-9_]+_BIT|[A-Za-z0-9_:]*k[A-Za-z0-9_]+_Flag)'
