id: general/document-unused-entry-points-not-internal-helpers
title: When documenting that functions or methods are currently unused, annotate the public entry points
  lacking consumers rather than internal helper functions called by them
polarity: dont
severity: should_fix
rubric: readability
rule: When documenting that code is currently unused or uncalled, place the explanatory comment on the
  public entry points or callers that lack consumers rather than on internal helper functions actively
  invoked by those entry points. Keep internal helper declarations free of misleading unused annotations
  when other methods within the class call them.
why: Marking an internal helper as unused is misleading and directly contradicts the implementation when
  sibling methods or entry points actively call it. Documenting unused status at the public entry points
  accurately identifies where external callers are absent and avoids confusing maintainers auditing call
  sites or searching for dead code.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Marking internal helper as unused when member functions call it.
  void draw(BindBufferInfo vertices, unsigned int vertexCount) {
      this->bindAndFlush({}, {}, vertices, 0, vertexCount);
  }

  // Currently unused
  void bindAndFlush(BindBufferInfo staticData, BindBufferInfo indices, BindBufferInfo appendData,
                    uint32_t templateCount, unsigned int drawCount);
  ```

  Good:

  ```cpp
  // Good: Annotate the public entry points that lack callers.
  // Issues draws with fully specified data. These are currently unused.
  void draw(BindBufferInfo vertices, unsigned int vertexCount) {
      this->bindAndFlush({}, {}, vertices, 0, vertexCount);
  }

  void bindAndFlush(BindBufferInfo staticData, BindBufferInfo indices, BindBufferInfo appendData,
                    uint32_t templateCount, unsigned int drawCount);
  ```
include_glob:
- src/**
- include/**
triggers:
- //.*\b[Cc]urrently\s+unused\b
- //.*\b(?:[Tt]hese are currently unused|[Nn]ot currently used|[Uu]ncalled|[Ff]or future use)\b
- \bbindAndFlush\b
- \bBindBufferInfo\b
- \bDrawWriter\b
confidence: 0.88
support_cl_count: 1
