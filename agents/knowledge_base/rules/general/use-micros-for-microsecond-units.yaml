id: general/use-micros-for-microsecond-units
title: When naming microsecond duration variables, parameters, or helper functions, use 'micros' or 'microseconds'
  instead of 'us' to avoid confusion with the English word
polarity: dont
severity: nit
rubric: readability
rule: Do not use 'us' or 'us_' as an identifier, prefix, or suffix for microsecond time units; use 'micros'
  or 'microseconds' instead (e.g., micros_since or timeoutMicros).
why: The ASCII abbreviation 'us' (used for microseconds, µs) is visually identical to the English pronoun
  'us', making identifiers like us_since or duration_us ambiguous and prone to misreading. Using 'micros'
  or 'microseconds' eliminates ambiguity and reads naturally.
examples:
- |-
  Bad:

  ```cpp
  // Ambiguous: 'us_since' can easily be misread as the English pronoun 'us'.
  int64_t us_since(skgpu::StdSteadyClock::time_point start);
  uint32_t timeout_us = 5000;
  ```

  Good:

  ```cpp
  // Unambiguous: 'micros' clearly denotes microsecond time units.
  int64_t micros_since(skgpu::StdSteadyClock::time_point start);
  uint32_t timeoutMicros = 5000;
  ```
include_glob:
- src/**
- include/**
triggers:
- \b(?:us_[a-zA-Z0-9_]+|[a-zA-Z0-9_]+(?:_us|Us))\b
- \bstd::chrono::microseconds\b
- \b(?:micros_[a-zA-Z0-9_]+|[a-zA-Z0-9_]+(?:_micros|Micros))\b
- \b[a-zA-Z0-9_]*(?:[Mm]icros|[Mm]icroseconds)[a-zA-Z0-9_]*\b
- \bduration_cast<[^>]*microseconds>\b
confidence: 0.85
support_cl_count: 1
