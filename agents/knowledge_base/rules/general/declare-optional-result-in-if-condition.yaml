id: general/declare-optional-result-in-if-condition
title: When an optional or fallible result is used only inside a conditional block, declare it inline
  in the if condition and rely on contextual bool conversion
polarity: do
severity: nit
rubric: readability
rule: When an optional or fallible lookup/computation is only needed within a conditional block, declare
  and initialize the variable directly inside the `if` condition (e.g. `if (auto result = ...)`) rather
  than declaring it in an outer scope. Rely on `std::optional`'s or the smart pointer's contextual `bool`
  conversion rather than calling `.has_value()` or comparing against `std::nullopt`.
why: Declaring the variable directly in the `if` statement confines its scope and lifetime strictly to
  the branch where it is valid, preventing accidental use of disengaged or uninitialized values outside
  the block. Relying on contextual `bool` conversion avoids redundant member predicates like `.has_value()`
  and follows idiomatic C++ conventions.
examples:
- |-
  Bad:

  ```cpp
  auto result = Simplify(path);
  if (result.has_value()) {
      return emscripten::val(result.value());
  }

  // Declared in outer scope before conditional check
  std::optional<SkRect> bounds = computeBounds();
  if (bounds != std::nullopt) {
      drawBounds(*bounds);
  }
  ```

  Good:

  ```cpp
  if (auto result = Simplify(path)) {
      return emscripten::val(result.value());
  }

  // Scoped directly within condition using contextual bool conversion
  if (auto bounds = computeBounds()) {
      drawBounds(*bounds);
  }
  ```
include_glob:
- src/**
- include/**
- modules/**
- tests/**
- tools/**
- gm/**
- bench/**
triggers:
- \bif\s*\(\s*(?:const\s+)?auto(?:\s*[*&]+)?\s+[a-zA-Z0-9_]+\s*=
- \bif\s*\([a-zA-Z0-9_]+\.has_value\s*\(\)
- \bstd::optional<[^>]+>\s+[a-zA-Z0-9_]+\s*=
- \bif\s*\([a-zA-Z0-9_]+\s*!=\s*std::nullopt\)
- \bauto\s+[a-zA-Z0-9_]+\s*=\s*[A-Z][A-Za-z0-9_]*\([^;]*\);\s*\n\s*if\s*\(
confidence: 0.85
support_cl_count: 1
