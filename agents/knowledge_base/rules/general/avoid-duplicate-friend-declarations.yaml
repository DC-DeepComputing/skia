id: general/avoid-duplicate-friend-declarations
title: When adding a friend declaration to a C++ class, verify friendship has not already been granted
  elsewhere in the class
polarity: dont
severity: nit
rubric: readability
rule: Do not add duplicate `friend` declarations for the same class or function within a class definition.
  Check whether friendship has already been granted elsewhere in the class before adding a new friend
  declaration.
why: In C++, a `friend` declaration grants access to the entire class regardless of access specifier or
  placement. Adding another friend declaration for an already friended class or function is redundant,
  clutters the header, and can confuse readers about class structure.
examples:
- |-
  Bad:

  ```cpp
  class Resource {
      friend class ResourceCache;
      ...
  public:
      void setLabel(std::string_view label);

      // Redundant duplicate friend declaration
      friend class ResourceCache;
  };
  ```

  Good:

  ```cpp
  class Resource {
      friend class ResourceCache;
      ...
  public:
      void setLabel(std::string_view label);
  };
  ```
include_glob:
- '**/*.h'
triggers:
- ^\s*friend\s+(?:class|struct)\s+[A-Za-z0-9_:]+
- \bfriend\s+class\s+[A-Za-z0-9_:]+
- \bfriend\s+struct\s+[A-Za-z0-9_:]+
- ^\s*friend\s+[A-Za-z0-9_:<>]+\s+[A-Za-z0-9_]+\s*\(
confidence: 0.9
support_cl_count: 1
