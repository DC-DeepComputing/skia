id: general/order-class-access-specifiers
title: 'When declaring C++ classes, order sections public-first, precede access specifiers with a newline,
  explicitly write private: for top-of-class declarations, and group data members at the end'
polarity: do
severity: should_fix
rubric: readability
rule: In C++ class declarations, order visibility sections as `public`, `protected`, and `private`, preceding
  each access specifier with a blank line. When private types, forward declarations, or friends must precede
  `public:`, explicitly declare `private:` rather than relying on implicit default visibility. Within
  each section and across the class, avoid intermixing data fields with methods, keeping member data fields
  grouped together at the end of the class. Additionally, do not place member variables in `public:` just
  to share conditional compilation blocks (such as `#if defined(GPU_TEST_UTILS)`); keep data members under
  their own preprocessor guard. Finally, do not wrap access specifiers in preprocessor directives; relocate
  declarations to an existing unconditional access section instead.
why: Placing the public interface first allows readers and API consumers to immediately see how to use
  the class without parsing internal implementation details. Explicitly declaring `private:` for leading
  declarations eliminates ambiguity over whether public visibility was accidentally omitted. Preceding
  access specifiers with a blank line provides visual separation between visibility sections. Keeping
  member fields grouped together at the end maintains encapsulation and predictable layout, while avoiding
  preprocessor-wrapped access specifiers prevents confusing scoping and unintended access levels.
examples:
- |-
  Bad:

  ```cpp
  // Omitting explicit 'private:' before top-of-class forward declarations or friends:
  class SK_API TextureInfo {
      class Data;
      friend class MtlTextureInfo;

  public:
      TextureInfo();
  };

  // Declaring member data before public:, or missing blank line before specifier:
  class Iter {
      size_t fIndex;
  public:
      Iter(const SkPathRaw& p);
      void freeResources();
  private: // Missing preceding blank line
      static constexpr uint32_t kMaxBuffers = 16;
  };

  // Intermixing data fields between public methods and protected overrides:
  class SkTypeface_Custom : public SkTypeface_proxy {
  public:
      std::unique_ptr<SkStreamAsset> makeStream() const;
      const SkString fFamilyName;
      int fIndex;
  protected:
      void onGetFamilyName(SkString* name) const override;
  };

  // Wrapping access specifiers in preprocessor guards:
  #ifdef SK_HIDE_PATH_EDIT_METHODS
  public:
  #endif
      enum ArcSize { kSmall, kLarge };
  #ifdef SK_HIDE_PATH_EDIT_METHODS
  private:
  #endif
  ```

  Good:

  ```cpp
  // Explicitly specifying private: when declarations must precede public:
  class SK_API TextureInfo {
  private:
      class Data;
      friend class MtlTextureInfo;

  public:
      TextureInfo();
  };

  // Ordering public first, with blank lines and data members at the end:
  class Iter {
  public:
      Iter(const SkPathRaw& p);
      void freeResources();

  private:
      static constexpr uint32_t kMaxBuffers = 16;
      size_t fIndex;
  };

  // Keeping methods together and data fields grouped at the end:
  class SkTypeface_Custom : public SkTypeface_proxy {
  public:
      std::unique_ptr<SkStreamAsset> makeStream() const;
      void onGetFamilyName(SkString* name) const override;

      const SkString fFamilyName;
      int fIndex;
  };

  // Relocating declarations to existing unconditional sections:
  public:
      enum ArcSize { kSmall, kLarge };
  ```
include_glob:
- '**/*.h'
- '**/*.cpp'
- '**/*.cc'
triggers:
- \bclass\s+(?:SK_API\s+)?[A-Za-z0-9_]+
- '^\s*public\s*:'
- '^\s*protected\s*:'
- '^\s*private\s*:'
- \b(?:class|struct)\s+[A-Za-z0-9_]+(?:\s+final)?\s*\{
- '#(?:if|ifdef|ifndef)\s+.*(?:GPU_TEST_UTILS|TEST_UTILS|SK_[A-Z0-9_]+)'
- \b(?:SK_GUARDED_BY|SK_EXCLUDES)\b
- ^\s*friend\s+class\s+[A-Za-z0-9_]+;
citations:
- path: site/docs/dev/contrib/style.md
  heading: Classes
  quote: Unless there is a need for forward declaring something, class declarations should be ordered
    `public`, `protected`, `private`. Each should be preceded by a newline. Within each visibility section
    (`public`, `private`), fields should not be intermixed with methods. It's nice to keep all data fields
    together at the end.
confidence: 0.98
support_cl_count: 7
