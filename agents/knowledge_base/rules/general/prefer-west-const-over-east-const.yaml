id: general/prefer-west-const-over-east-const
title: When qualifying variables, parameters, or return types as const, place const before the type or
  auto (west-const) rather than after (east-const)
polarity: do
severity: nit
rubric: readability
rule: Place the const qualifier before the type or auto specifier (west-const, e.g., const auto*, const
  auto&, const Type*, const Type&) rather than after it (east-const, e.g., auto const*, Type const&).
  Apply this placement consistently across local variable declarations, function parameters, return types,
  and member fields.
why: Skia standardizes on west-const throughout the repository. Adhering to const auto* and const Type&
  ensures visual consistency across all translation units, matches codebase idioms, and avoids mixing
  east-const and west-const styles within the same project.
examples:
- |-
  Bad:

  ```cpp
  auto const* globalCache =
      this->resourceProvider()->sharedContext()->globalCache();
  void processBuffer(GrBuffer const* buffer, SkSpan<int const> values);
  ```

  Good:

  ```cpp
  const auto* globalCache =
      this->resourceProvider()->sharedContext()->globalCache();
  void processBuffer(const GrBuffer* buffer, SkSpan<const int> values);
  ```
include_glob:
- '**/*.h'
- '**/*.cpp'
- '**/*.cc'
exclude_glob:
- third_party/**
- include/third_party/**
triggers:
- \bauto\s+const\s*[*&]?\b
- \bauto\s+const\s+[a-zA-Z0-9_]+
- \b(?:int|uint\d+_t|size_t|float|double|char|bool)\s+const\s*[*&]
- \b(?:Sk|Gr)[A-Za-z0-9_]+\s+const\s*[*&]
- '[(,]\s*[A-Za-z0-9_:]+(?:<[^>]+>)?\s+const\s*[*&]'
- \b[A-Za-z0-9_:]+\s+const\s*[*&]\s+[a-zA-Z0-9_]+
confidence: 0.88
support_cl_count: 1
