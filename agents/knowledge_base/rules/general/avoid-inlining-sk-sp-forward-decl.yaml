id: general/avoid-inlining-sk-sp-forward-decl
title: When defining functions in headers taking or returning sk_sp<T> by value where T is forward-declared,
  implement them in .cpp files instead of inline
polarity: dont
severity: blocking
rubric: correctness
rule: Do not implement functions inline in header files if they accept, return, or instantiate sk_sp<T>
  by value when T is only forward-declared. Declare the function in the header and define it in a .cpp
  source file where the defining header for T is included.
why: Destroying sk_sp<T> calls SkSafeUnref(fPtr) which invokes obj->unref(), requiring T to be a complete
  type. Inlining functions that pass or return sk_sp<T> by value in headers with forward-declared T causes
  compilation failures in translation units that include the header without T's definition.
examples:
- |-
  Bad:

  ```cpp
  // In SkGainmapShader.h (where SkColorSpace is only forward-declared):
  class SkColorSpace;

  class SK_API SkGainmapShader {
  public:
      static sk_sp<SkShader> Make(const sk_sp<const SkImage>& baseImage,
                                  const SkGainmapInfo& gainmapInfo,
                                  sk_sp<SkColorSpace> dstColorSpace) {
          return Make(baseImage, gainmapInfo); // Compilation error: dstColorSpace destruction requires complete SkColorSpace
      }
  };
  ```

  Good:

  ```cpp
  // In SkGainmapShader.h:
  class SkColorSpace;

  class SK_API SkGainmapShader {
  public:
      static sk_sp<SkShader> Make(const sk_sp<const SkImage>& baseImage,
                                  const SkGainmapInfo& gainmapInfo,
                                  sk_sp<SkColorSpace> dstColorSpace);
  };

  // In SkGainmapShader.cpp (where SkColorSpace.h is included):
  #include "include/core/SkColorSpace.h"
  #include "include/private/SkGainmapShader.h"

  sk_sp<SkShader> SkGainmapShader::Make(const sk_sp<const SkImage>& baseImage,
                                        const SkGainmapInfo& gainmapInfo,
                                        sk_sp<SkColorSpace> dstColorSpace) {
      return Make(baseImage, gainmapInfo);
  }
  ```
include_glob:
- '**/*.h'
exclude_glob:
- third_party/**
triggers:
- \bsk_sp<[A-Za-z0-9_:]+>[^;)]*[)][\s]*[{]
- \b(?:static|inline)\s+sk_sp<[A-Za-z0-9_:]+>\s+[A-Za-z0-9_]+\s*[(]
- \b(?:static|inline)\s+[A-Za-z0-9_:]+\s+[A-Za-z0-9_]+[(][^;{]*\bsk_sp<
- \bsk_sp<[A-Za-z0-9_:]+>\s+[a-z_][A-Za-z0-9_]*\s*[,)]
- \b(?:class|struct)\s+(?:SK_API\s+)?(?:Sk|Gr|skgpu)[A-Za-z0-9_]+;
