- path: docs/architecture/CPU.md
  heading: '### 1. The API Layer'
  quote: This `STArray` is a small-object optimized array, meaning that for small paths, the geometry
    data is stored directly within the `STArray`'s internal buffer (part of the heap-allocated `SkPathRef`
    object). For larger paths, the `STArray` dynamically allocates additional memory on the heap to store
    the geometry data.
