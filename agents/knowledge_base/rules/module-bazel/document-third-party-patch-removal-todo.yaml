id: module-bazel/document-third-party-patch-removal-todo
title: When applying temporary downstream patches or workarounds to third-party dependencies in build
  files, include a TODO specifying the removal condition
polarity: do
severity: should_fix
rubric: readability
rule: When applying temporary downstream patches or workarounds to third-party dependencies in build configuration
  files (such as MODULE.bazel, WORKSPACE.bazel, or under bazel/), accompany the patch declaration with
  an attributed TODO comment specifying the condition for removal (such as an upstream PR merge or a new
  release).
why: Downstream patches against third-party dependencies introduce ongoing maintenance debt and risk diverging
  from upstream. Documenting temporary patches with an attributed TODO comment ensures the rationale is
  tracked and prevents orphaned patches from lingering after an upstream release incorporates the fix.
examples:
- |-
  Bad:

  ```cpp
  crate.annotation(
      crate = "png",
      patch_args = ["-p1"],
      # Patches from https://crrev.com/c/5922033:
      # New public API for `png` crate: `fn next_frame_info`.
      patches = ["//bazel/external/image-png:captured-chunks.patch"],
  )
  ```

  Good:

  ```cpp
  crate.annotation(
      crate = "png",
      patch_args = ["-p1"],
      # Patches from https://crrev.com/c/5922033:
      # New public API for `png` crate: `fn next_frame_info`.
      #
      # TODO(username): Remove this patch once a new version of `png`
      # (>= 0.18.2) is released incorporating upstream PR #123.
      patches = ["//bazel/external/image-png:captured-chunks.patch"],
  )
  ```
include_glob:
- MODULE.bazel*
- WORKSPACE*
- bazel/**
- DEPS
triggers:
- \bpatches\s*=
- \bpatch_args\s*=
- \bpatch_cmds\s*=
- \bcrate\.annotation\b
- \b(?:crates_repository|http_archive|git_repository)\b
- \b(?:\.patch|\.diff)["']
confidence: 0.9
support_cl_count: 1
