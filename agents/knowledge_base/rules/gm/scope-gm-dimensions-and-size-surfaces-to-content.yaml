- \bk(?:Grid|Cell|Mask)(?:WH|Width|Height|Size|Bounds)\b
- \b(?:inline\s+)?(?:static\s+)?constexpr\s+(?:int|float|SkScalar)\s+k[A-Z]\w*\s*=
- \bSkISize::Make\s*\(
