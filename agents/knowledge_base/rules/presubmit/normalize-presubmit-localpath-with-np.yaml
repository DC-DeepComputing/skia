id: presubmit/normalize-presubmit-localpath-with-np
title: When matching LocalPath() against forward-slash paths in PRESUBMIT.py, normalize the path using
  np() to ensure cross-platform compatibility on Windows
polarity: do
severity: should_fix
rubric: correctness
rule: In `PRESUBMIT.py`, normalize file paths returned by `affected_file.LocalPath()` using the `np()`
  helper before matching against path prefixes, suffixes, or substrings containing forward slashes (`/`).
  Do not compare raw `LocalPath()` strings directly against forward-slash paths (such as `x.LocalPath().startswith('include/')`).
why: On Windows, `AffectedFile.LocalPath()` produces backslash-separated paths (`\`). Direct comparisons
  against forward-slash path literals silently fail on Windows machines, causing presubmit filters and
  checks to be bypassed.
examples:
- |-
  Bad:

  ```cpp
  file_filter = lambda x: x.LocalPath().startswith('include/')
  ```

  Good:

  ```cpp
  file_filter = lambda x: np(x.LocalPath()).startswith('include/')
  ```
include_glob:
- PRESUBMIT*.py
triggers:
- \bLocalPath\s*\(
- \bnp\s*\(
- \bstartswith\s*\(['"][^'"]*/
- \bendswith\s*\(['"]/[^'"]*
- \b(?:file_filter|source_file_filter)\b
- \baffected_file(?:_path)?\b
confidence: 0.95
support_cl_count: 1
