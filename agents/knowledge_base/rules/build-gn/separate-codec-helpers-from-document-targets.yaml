- path: RELEASE_NOTES.md
  heading: Milestone 120
  quote: In order to make a reasonable PDF, those must be supplied (using the two argument factory). To
    make these easier to supply `include/docs/SkPDFJpegHelpers.h` has been added, which will use Skia's
    built-in jpeg encoder and decoder.
