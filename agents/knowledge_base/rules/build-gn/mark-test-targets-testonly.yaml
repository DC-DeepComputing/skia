id: build-gn/mark-test-targets-testonly
title: When defining test-only targets or test helper source sets in GN or Bazel, mark them with testonly
  = true to prevent production dependencies
polarity: do
severity: should_fix
rubric: design
rule: Mark all test-only build targets (such as unit test suites, test fixtures, fakes, or test helper
  source sets) with `testonly = true` in GN or `testonly = True` in Bazel. Do not define test support
  targets without this declaration, even if they are only consumed internally within test files.
why: Setting `testonly` enforces build visibility and dependency layering at the build system level, ensuring
  that production libraries and binaries cannot inadvertently depend on test-only code, test mocks, or
  test frameworks.
examples:
- |-
  Bad:

  ```cpp
  skia_source_set("fontscanner_tests") {
    deps = [ ":skia" ]
    sources = [
      "tests/FontScanner.cpp",
      "tests/FontScanner.h",
    ]
  }
  ```

  Good:

  ```cpp
  skia_source_set("fontscanner_tests") {
    testonly = true
    deps = [ ":skia" ]
    sources = [
      "tests/FontScanner.cpp",
      "tests/FontScanner.h",
    ]
  }
  ```
include_glob:
- BUILD.gn
- '**/*.gn'
- BUILD.bazel
- '**/BUILD.bazel'
triggers:
- \btestonly\s*=\s*(?:true|True)\b
- \b(?:skia_source_set|source_set|test_lib|(?:skia_)?cc_library)\s*\(\s*["'][^"']*(?:test|fixture|mock|fake)
- \b(?:skia_)?cc_test\s*\(
- '["''][a-zA-Z0-9_/-]*_tests?["'']'
- '["'']tests/[a-zA-Z0-9_/-]+\.(?:cpp|cc|h)["'']'
confidence: 0.93
support_cl_count: 1
