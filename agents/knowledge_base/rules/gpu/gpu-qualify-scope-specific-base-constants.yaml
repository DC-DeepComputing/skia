id: gpu/gpu-qualify-scope-specific-base-constants
title: When defining limits, thresholds, or constants in shared GPU base classes, qualify names to reflect
  specific subclass categories or execution paths
polarity: do
severity: nit
rubric: readability
rule: When defining constants, capacity limits, or complexity thresholds in shared base classes or interfaces,
  qualify the identifier with the specific subclass category, backend, or execution path it governs (e.g.,
  kMaxGPUPathRendererVerbs rather than kMaxPathVerbs). Do not use overly broad or unqualified names for
  limits that apply only to a subset of implementations or allow fallback to alternate paths.
why: In class hierarchies where base classes coordinate multiple execution strategies (such as hardware-accelerated
  GPU rendering and software fallback), overly generic constant names falsely imply a global constraint
  across all paths. Explicit domain qualification clarifies which implementations enforce the threshold
  and prevents confusion about whether non-qualifying paths are subject to the limit.
examples:
- |-
  Bad:

  ```cpp
  class PathRenderer : public SkRefCnt {
  public:
      // Bad: Generic name suggests a universal limit across all paths and renderers.
      static constexpr int kMaxPathVerbs = 1 << 14;
  };
  ```

  Good:

  ```cpp
  class PathRenderer : public SkRefCnt {
  public:
      // Good: Explicit qualification clarifies the limit applies specifically to GPU renderers.
      static constexpr int kMaxGPUPathRendererVerbs = 1 << 14;
  };
  ```
include_glob:
- src/gpu/**
triggers:
- \b(?:static\s+)?constexpr\s+(?:int|size_t|uint(?:16|32|64)_t)\s+kMax[A-Z]\w*\s*=
- \b(?:static\s+)?constexpr\s+(?:int|size_t|uint(?:16|32|64)_t)\s+k[A-Z]\w*(?:Limit|Threshold|Capacity|Bound|Max)\s*=
- \bkMax[A-Z]\w*(?:Verbs|Points|Lines|Quads|Edges|Segments|Paths|Items|Entries)\b
- \b(?:static\s+)?constexpr\s+[A-Za-z0-9_:]+\s+k[A-Z]\w*(?:Limit|Threshold|Verbs|Cutoff)\s*=
- \bclass\s+(?:SK_API\s+)?PathRenderer\b
confidence: 0.9
support_cl_count: 1
