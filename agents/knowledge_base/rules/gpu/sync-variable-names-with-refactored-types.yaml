id: gpu/sync-variable-names-with-refactored-types
title: When refactoring types or extracting backend structures in GPU code, update variable names to reflect
  the active type rather than retaining stale identifiers
polarity: do
severity: should_fix
rubric: readability
rule: When refactoring or replacing types (such as migrating from *TextureSpec to *TextureInfo), update
  local variable and parameter names to reflect the replacement type rather than retaining stale identifiers
  from obsolete types. Maintain consistent naming conventions across backend implementations (such as
  dawnInfo, mtlInfo, and vkInfo when querying backend-specific texture or surface info structs).
why: Retaining obsolete variable names after type refactorings causes cognitive confusion, misleads readers
  about the actual data structure being inspected, and breaks naming parity across backend sibling classes.
examples:
- |-
  Bad:

  ```cpp
  // Retaining stale 'dawnSpec' identifier after migrating from DawnTextureSpec to DawnTextureInfo:
  const auto& dawnSpec = TextureInfoPriv::Get<DawnTextureInfo>(info);
  wgpu::TextureFormat format = dawnSpec.getViewFormat();
  ```

  Good:

  ```cpp
  // Updated to 'dawnInfo' matching DawnTextureInfo and sibling vkInfo/mtlInfo conventions:
  const auto& dawnInfo = TextureInfoPriv::Get<DawnTextureInfo>(info);
  wgpu::TextureFormat format = dawnInfo.getViewFormat();
  ```
include_glob:
- src/gpu/**
triggers:
- \bTextureInfoPriv::Get<[A-Za-z0-9_]+>\s*[(]
- \b(?:const\s+)?auto(?:\s*&{1,2})?\s+[a-z][a-zA-Z0-9_]*(?:Spec|Info|Desc|Data)\s*=
- \b(?:Dawn|Mtl|Vulkan|GrGL|Mock)Texture(?:Info|Spec)\b
- \b(?:dawn|mtl|vk|gl|mock)(?:Spec|Info|Desc)\b
- '\b(?:TextureInfo|ColorInfo|SurfaceInfo)Priv::'
confidence: 0.9
support_cl_count: 1
