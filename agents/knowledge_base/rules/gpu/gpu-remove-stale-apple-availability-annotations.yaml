id: gpu/gpu-remove-stale-apple-availability-annotations
title: When writing or refactoring Apple backend code, remove compile-time SK_API_AVAILABLE annotations
  and runtime @available checks satisfied by Skia's baseline OS versions
polarity: dont
severity: should_fix
rubric: readability
rule: Do not retain or introduce compile-time SK_API_AVAILABLE(...) annotations or runtime @available
  checks for Apple operating system versions that are unconditionally satisfied by Skia's minimum deployment
  targets (macOS 11+, iOS 13+). When cleaning up runtime @available blocks or implementing Apple backend
  APIs, remove obsolete availability annotations targeting earlier OS versions (such as macOS 10.11 or
  iOS 8/9/12).
why: Skia's minimum supported deployment baseline for Apple platforms is macOS 11 and iOS 13. Guarding
  methods or calls against earlier OS releases is dead code that adds visual clutter and misleadingly
  implies older platform versions are supported.
examples:
- |-
  Bad:

  ```cpp
  void setBufferOffset(NSUInteger offset, NSUInteger index)
          SK_API_AVAILABLE(macos(10.11), ios(8.3), tvos(9.0)) {
      SkASSERT(index < kMaxExpectedBuffers);
      if (fBufferOffsets[index] != offset) {
          [(*fCommandEncoder) setBufferOffset:offset atIndex:index];
          fBufferOffsets[index] = offset;
      }
  }
  ```

  Good:

  ```cpp
  void setBufferOffset(NSUInteger offset, NSUInteger index) {
      SkASSERT(index < kMaxExpectedBuffers);
      if (fBufferOffsets[index] != offset) {
          [(*fCommandEncoder) setBufferOffset:offset atIndex:index];
          fBufferOffsets[index] = offset;
      }
  }
  ```
include_glob:
- src/gpu/**
- include/gpu/**
triggers:
- \bSK_API_AVAILABLE\b
- '@available\s*\('
- \bAPI_AVAILABLE\s*\(
- \bSK_API_AVAILABLE_CA_METAL_LAYER\b
- \b(?:macos|ios|tvos)\s*\(\s*[0-9.]+\s*\)
citations:
- path: site/docs/_index.md
  heading: Platforms
  quote: |-
    - macOS 11 or later
    - iOS 13 or later
confidence: 0.9
support_cl_count: 1
