id: gpu/extract-optional-pipeline-stages-to-static-helpers
title: When implementing complex GPU pipeline creation routines, extract large optional feature branches
  and sub-stages into file-static helper functions instead of inlining multi-step setup
polarity: do
severity: should_fix
rubric: design
rule: When implementing complex GPU pipeline or resource creation routines, extract multi-step setup for
  optional extensions, feature branches, or self-contained configuration stages into file-static helper
  functions (such as create_* or setup_*). Keep the mainline creation function focused on top-level orchestration,
  resource provider interaction, and error propagation rather than inlining extensive branch-specific
  descriptor configuration.
why: Inlining multi-step descriptor setup and extension-specific API calls bloats the primary creation
  routine and obscures the standard path taken when the feature is disabled or unavailable. Isolating
  optional branches and sub-stages in dedicated static helpers encapsulates branch-specific local state
  and error logging while keeping mainline construction readable.
examples:
- |-
  Bad:

  ```cpp
  // In MakePipeline:
  if (shadersPipeline && sharedContext->caps()->usePipelineLibraries()) {
      VkGraphicsPipelineCreateInfo shadersPipelineCreateInfo = {};
      // ... dozens of lines setting up descriptors and calling CreateGraphicsPipelines ...
      shadersLibraryInfo.libraryCount = 1;
      shadersLibraryInfo.pLibraries = shadersPipeline;
      AddToPNextChain(&pipelineCreateInfo, &shadersLibraryInfo);
  }
  ```

  Good:

  ```cpp
  // In MakePipeline:
  if (shadersPipeline && sharedContext->caps()->usePipelineLibraries()) {
      if (!create_shaders_pipeline(sharedContext,
                                   rsrcProvider->pipelineCache(),
                                   pipelineCreateInfo,
                                   shadersLibraryInfo,
                                   libraryInfo,
                                   shadersPipeline)) {
          SKGPU_LOG_E("Failed to create pipeline library\n");
          return VK_NULL_HANDLE;
      }
  }
  ```
include_glob:
- src/gpu/**
triggers:
- \b(?:VkGraphicsPipelineCreateInfo|VkComputePipelineCreateInfo|wgpu::RenderPipelineDescriptor|MTLRenderPipelineDescriptor)\b
- \b(?:create|setup)_[a-z0-9_]*(?:pipeline|state|stage)\s*\(
- \b(?:Make|MakePipeline|CreateGraphicsPipeline|CreateComputePipeline)\s*\(
- \b(?:caps\(\)->|caps\.)use[A-Z]\w*\s*\(
- \b(?:VkPipelineLibraryCreateInfoKHR|VkPipelineShaderStageCreateInfo)\b
confidence: 0.88
support_cl_count: 1
