id: gpu/use-compressed-painters-order
title: When tracking draw sequencing, layer ordering, or depth in Graphite, use strongly typed wrappers
  like CompressedPaintersOrder instead of raw uint32_t
polarity: do
severity: should_fix
rubric: readability
rule: In Graphite, represent draw sequencing, layer ordering, and painter's depth using dedicated strongly
  typed monotonic wrappers (such as `CompressedPaintersOrder` or `PaintersDepth`) rather than primitive
  integer types like `uint32_t`. Pass and store ordering values using these types to prevent ordinal domain
  mismatches and make sequencing semantics explicit.
why: Graphite defines `CompressedPaintersOrder`, `PaintersDepth`, and `DisjointStencilIndex` as `MonotonicValue`
  wrappers to guarantee type safety across distinct ordering domains. Using raw integers like `uint32_t`
  obscures sequencing semantics, permits accidental arithmetic or interchange between unrelated domains,
  and bypasses monotonic comparison invariants.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Raw integer obscures painter's order semantics and allows domain confusion
  struct Layer {
      Layer(uint32_t& index) : fIndex(index++) {}
      const uint32_t fIndex;
  };
  void recordDraw(uint32_t order);
  ```

  Good:

  ```cpp
  // Good: Strongly typed monotonic wrapper enforces type safety and ordering intent
  struct Layer {
      Layer(const CompressedPaintersOrder& order) : fOrder(order) {}
      const CompressedPaintersOrder fOrder;
  };
  void recordDraw(CompressedPaintersOrder order);
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- \b(?:CompressedPaintersOrder|PaintersDepth|DisjointStencilIndex)\b
- \b(?:const\s+)?uint(?:16|32)_t&?\s+[a-zA-Z0-9_]*(?:order|Order|layerIndex|paintIndex|drawIndex)\b
- \bLayer\s*\([^)]*(?:uint(?:16|32)_t|CompressedPaintersOrder)
- \b(?:const\s+)?uint(?:16|32)_t\s+f(?:Order|Index)\b
- \b(?:paintOrder|drawOrder|layerOrder)\s*\(
confidence: 0.85
support_cl_count: 1
