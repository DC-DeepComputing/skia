id: gpu/name-snippet-uniforms-to-match-sksl
title: When defining Graphite shader snippet uniforms, name variables to match the corresponding SkSL
  module function parameters and accurately reflect packed component order
polarity: do
severity: should_fix
rubric: readability
rule: When defining uniforms for Graphite shader snippets in ShaderCodeDictionary, name each uniform variable
  to match the corresponding parameter name in the snippet's SkSL module function (staticFn). For packed
  vector uniforms, ensure the name accurately reflects the layout and order of packed components (such
  as srcGABC for components {g, a, b, c}).
why: Graphite's shader code generator pairs snippet uniform declarations with static SkSL functions. Inconsistent
  uniform names obscure component layout, make generated shader code harder to debug, and lead to subtle
  component-ordering mistakes when binding uniforms.
examples:
- |-
  Bad:

  ```cpp
  fBuiltInCodeSnippets[(int) BuiltInCodeSnippetID::kColorSpaceXformSRGB] = {
          /*name=*/"ColorSpaceTransformSRGB",
          /*staticFn=*/"sk_color_space_transform_srgb",
          SnippetRequirementFlags::kPriorStageOutput,
          /*uniforms=*/{ { "gamut",       SkSLType::kHalf3x3 },
                         { "srcABCG",     SkSLType::kHalf4 },
                         { "srcDEF_args", SkSLType::kHalf4 },
                         { "dstABCG",     SkSLType::kHalf4 },
                         { "dstDEF_args", SkSLType::kHalf4 } }
  };
  ```

  Good:

  ```cpp
  fBuiltInCodeSnippets[(int) BuiltInCodeSnippetID::kColorSpaceXformSRGB] = {
          /*name=*/"ColorSpaceTransformSRGB",
          /*staticFn=*/"sk_color_space_transform_srgb",
          SnippetRequirementFlags::kPriorStageOutput,
          /*uniforms=*/{ { "gamut",       SkSLType::kHalf3x3 },
                         { "srcGABC",     SkSLType::kHalf4 },
                         { "srcDEF_args", SkSLType::kHalf4 },
                         { "dstGABC",     SkSLType::kHalf4 },
                         { "dstDEF_args", SkSLType::kHalf4 } }
  };
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- /\*uniforms=\*/
- \bSkSLType::k(?:Float|Half|Int)[0-9x]*\b
- \bBuiltInCodeSnippetID::k[A-Za-z0-9_]+\b
- \bShaderSnippet\b
- /\*staticFn=\*/\s*"[^"]+"
- \{\s*"[a-zA-Z0-9_]+"\s*,\s*SkSLType::k
confidence: 0.9
support_cl_count: 1
