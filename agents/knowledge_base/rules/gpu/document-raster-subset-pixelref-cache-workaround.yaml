id: gpu/document-raster-subset-pixelref-cache-workaround
title: When subsetting raster images via SkBitmap::extractSubset and wrapping them in an SkImage to preserve
  caching, document that SkImage::makeSubset breaks SkPixelRef sharing
polarity: do
severity: should_fix
rubric: readability
rule: When subsetting raster images by extracting an SkBitmap subset and wrapping it with SkCopyPixelsMode::kNever
  instead of calling SkImage::makeSubset(), add an explanatory comment. Clarify that SkImage::makeSubset()
  deep-copies raster pixel data and allocates a new SkPixelRef, destroying texture cache sharing.
why: SkImage::makeSubset() always creates an independent copy of raster pixel data and assigns a new SkPixelRef,
  which prevents GPU texture caches from recognizing that the subset belongs to the original cached texture.
  Documenting this workaround prevents future maintainers from inadvertently replacing the multi-step
  bitmap extraction with makeSubset() during cleanup.
examples:
- |-
  Bad:

  ```cpp
  auto imageProc = [&](SkIRect iTileR) {
      if (SkBitmap subsetBmp; bm.extractSubset(&subsetBmp, iTileR)) {
          return SkImage_Raster::MakeFromBitmap(subsetBmp, SkCopyPixelsMode::kNever);
      }
      return sk_sp<SkImage>(nullptr);
  };
  ```

  Good:

  ```cpp
  auto imageProc = [&](SkIRect iTileR) {
      // We must subset as a bitmap and then turn it into an SkImage if we want
      // caching to work. Image subsets always make a copy of the pixels and lose
      // the association with the original's SkPixelRef.
      if (SkBitmap subsetBmp; bm.extractSubset(&subsetBmp, iTileR)) {
          return SkImage_Raster::MakeFromBitmap(subsetBmp, SkCopyPixelsMode::kNever);
      }
      return sk_sp<SkImage>(nullptr);
  };
  ```
include_glob:
- src/gpu/**
triggers:
- \bextractSubset\s*[(]
- \bSkCopyPixelsMode::kNever\b
- \bkNever_SkCopyPixelsMode\b
- \bSkImage_Raster::MakeFromBitmap\b
- \b(?:MakeFromBitmap|RasterFromBitmap)\s*[(][^)]*kNever
- //.*\b(?:subset.*bitmap|SkPixelRef|caching.*work|lose.*association)\b
confidence: 0.92
support_cl_count: 1
