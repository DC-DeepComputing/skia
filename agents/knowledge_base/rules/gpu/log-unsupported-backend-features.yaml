id: gpu/log-unsupported-backend-features
title: When handling unsupported backend features or invalid execution branches, log a descriptive error
  with SKIA_LOG_E rather than bare SkASSERT(false)
polarity: do
severity: should_fix
rubric: readability
rule: When handling unsupported backend features, unhandled command types, or invalid execution branches
  in GPU code, log a descriptive error message using subsystem logging macros (`SKIA_LOG_E` or `SKGPU_LOG_E`)
  rather than relying on a bare `SkASSERT(false)`. Explicitly state the backend component and the unsupported
  feature or operation in the log message.
why: '`SkASSERT(false)` provides no descriptive context and is compiled out completely in release builds,
  silently ignoring invalid states. Using an explicit error logging macro ensures an informative, actionable
  message appears in production and test logs when unsupported operations occur.'
examples:
- |-
  Bad:

  ```cpp
  case DrawPassCommands::Type::kAddBarrier: {
      // Graphite/Metal does not support barriers.
      SkASSERT(false);
      break;
  }
  ```

  Good:

  ```cpp
  case DrawPassCommands::Type::kAddBarrier: {
      SKIA_LOG_E("MtlCommandBuffer does not support the addition of barriers.");
      break;
  }
  ```
include_glob:
- src/gpu/**
triggers:
- \bSK(?:IA|GPU)_LOG_E\b
- \bSkASSERT\s*\(\s*(?:false|0)\s*\)
- \b(?:unsupported|not supported|does not support)\b
- '\bDrawPassCommands::Type::'
- '\b(?:Dawn|Mtl|Vulkan)?CommandBuffer::'
confidence: 0.9
support_cl_count: 1
