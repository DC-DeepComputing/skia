id: gpu/scope-key-gen-flags-to-child-context
title: When configuring KeyContext for shader stages or runtime effect children in Graphite, scope flags
  locally and derive distinct per-child contexts after asserting children().size()
polarity: do
severity: should_fix
rubric: correctness
rule: When configuring KeyGenFlags for specific shader stages or snippets in Graphite key generation,
  scope flags to that stage using a child KeyContext (such as keyContext.withExtraFlags(...)) rather than
  mutating root draw contexts. Additionally, when binding children for runtime effects in paint keys or
  precompile trees, assert expected child counts with SkASSERT(effect->children().size() == N) and construct
  distinct child contexts via keyContext.forRuntimeEffect(effect, childIndex) instead of reusing child
  0 across sibling effects.
why: Root KeyContext flags persist across the entire draw and leak into unrelated paint stages, triggering
  shader explosion. Furthermore, runtime effects configure child sampling flags (e.g., explicit sampling
  optimizations) based on per-child sample usage; reusing child 0 context applies mismatched flags to
  subsequent children, while asserting child counts validates structural invariants before indexing child
  contexts.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Leaking stage flags into root context for entire draw
  if (p.skipColorXform()) {
      keyGenFlags |= KeyGenFlags::kSpecializeColorSpaceXform;
  }
  KeyContext keyContext(recorder, local2Dev, targetColorInfo, keyGenFlags, p.color());
  p.toKey(keyContext, builder, gatherer);

  // Bad: Reusing child 0 context across multiple runtime effect children without asserting count
  KeyContext childContext = keyContext.forRuntimeEffect(effect, /*child=*/0);
  fDisplacement->priv().addToKey(childContext, desiredDisplacementCombination);
  fColor->priv().addToKey(childContext, desiredColorCombination);
  ```

  Good:

  ```cpp
  // Good: Scope stage flags locally using withExtraFlags
  KeyContext childContext = keyContext.withExtraFlags(KeyGenFlags::kSpecializeColorSpaceXform);
  AddToKey(childContext, keyBuilder, gatherer, childEffect);

  // Good: Assert expected child count and construct distinct contexts per child index
  SkASSERT(effect->children().size() == 2);
  fDisplacement->priv().addToKey(keyContext.forRuntimeEffect(effect, /*child=*/0),
                                 desiredDisplacementCombination);
  fColor->priv().addToKey(keyContext.forRuntimeEffect(effect, /*child=*/1),
                          desiredColorCombination);
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- \bKeyGenFlags\b
- \bKeyContext\b
- \bwithExtraFlags\b
- \bforRuntimeEffect\b
- \bKeyContextForRuntimeEffect\b
- \bchildren\(\)\.size\(\)
- \bk(?:SpecializeColorSpaceXform|DisableSamplingOptimization|DisableAlphaOnlyImageColorization|PreferFixedSrcBlend)\b
- \bKeyContextWithLocalMatrix\b
confidence: 0.95
support_cl_count: 2
