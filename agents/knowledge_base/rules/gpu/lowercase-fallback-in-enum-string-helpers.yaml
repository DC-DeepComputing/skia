id: gpu/lowercase-fallback-in-enum-string-helpers
title: When writing enum-to-string helpers for pipeline labels or diagnostic dumps, return lowercase fallback
  strings like 'unknown' to match lowercase enum tokens
polarity: do
severity: nit
rubric: readability
rule: In enum-to-string conversion helpers formatting tokens for diagnostic strings, pipeline labels,
  or key dumps, return lowercase fallback strings (such as 'unknown' or 'undefined') for default or unhandled
  values when the handled enum strings are lowercase. Match the casing convention of the valid enumerator
  strings to maintain uniform token formatting in composite labels.
why: Diagnostic dumps, pipeline keys, and labels combine multiple enum string tokens into delimited descriptors.
  Emitting capitalized fallbacks like 'Unknown' amidst lowercase tokens introduces jarring casing inconsistencies
  that disrupt formatted logs and string parsers.
examples:
- |-
  Bad:

  ```cpp
  const char* range_str(VkSamplerYcbcrRange r) {
      switch (r) {
          case VK_SAMPLER_YCBCR_RANGE_ITU_FULL:   return "full";
          case VK_SAMPLER_YCBCR_RANGE_ITU_NARROW: return "narrow";
          default:                                return "Unknown";
      }
  }
  ```

  Good:

  ```cpp
  const char* range_str(VkSamplerYcbcrRange r) {
      switch (r) {
          case VK_SAMPLER_YCBCR_RANGE_ITU_FULL:   return "full";
          case VK_SAMPLER_YCBCR_RANGE_ITU_NARROW: return "narrow";
          default:                                return "unknown";
      }
  }
  ```
include_glob:
- src/gpu/**
triggers:
- \breturn\s+\"(?:[Uu]nknown|[Ii]nvalid|[Uu]ndefined)\"
- (?:[A-Za-z0-9_]+_str|[A-Za-z0-9_]+ToStr)\s*[(]
- \bdefault:\s*(?:/\*.*?\*/|//.*)?\s*return\s+\"[^\"]+\"
- \bcase\s+[A-Za-z0-9_:]+:\s*return\s+\"[a-z0-9_-]+\"
- \bVkSamplerYcbcr(?:ModelConversion|Range)\b
confidence: 0.82
support_cl_count: 1
