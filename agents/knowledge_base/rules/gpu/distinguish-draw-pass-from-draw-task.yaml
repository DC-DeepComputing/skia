id: gpu/distinguish-draw-pass-from-draw-task
title: When naming variables, parameters, or fields tracking draw- or pass-level requirements in Graphite,
  name them after DrawPass rather than the aggregate DrawTask
polarity: do
severity: nit
rubric: readability
rule: When naming variables, parameters, or member fields that track draw- or pass-specific requirements
  (such as destination texture sampling or dst-read strategy) in Graphite, name them after DrawPass rather
  than DrawTask. Reserve DrawTask naming strictly for the aggregate container task that manages flushes,
  uploads, compute tasks, and render passes.
why: In Graphite, a DrawTask is an aggregate task container that sequences multiple distinct operations,
  including texture uploads, compute tasks, and RenderPassTasks. Conflating DrawTask with DrawPass in
  identifier names is misleading because draw-specific execution requirements belong to the individual
  DrawPass and its RenderPassTask, not the enclosing DrawTask.
examples:
- |-
  Bad:

  ```cpp
  bool drawTaskUsesDstSampler = fPendingDraws->usesDstSampler();
  DstReadStrategy drawTaskDstReadStrategy = fPendingDraws->drawsReadDst()
          ? DstReadStrategy::kTextureCopy : DstReadStrategy::kNone;
  ```

  Good:

  ```cpp
  bool drawPassUsesDstSampler = fPendingDraws->usesDstSampler();
  DstReadStrategy drawPassDstReadStrategy = fPendingDraws->drawsReadDst()
          ? DstReadStrategy::kTextureCopy : DstReadStrategy::kNone;
  ```
include_glob:
- src/gpu/graphite/**
triggers:
- \b(?:drawTask|drawPass)[A-Z]\w*\b
- \b(?:drawsReadDst|usesDstSampler)\b
- \bfPendingDraws->\w+
- \bDstReadStrategy\s+\w*\b
- \b(?:DrawPass|DrawTask)\b
confidence: 0.9
support_cl_count: 1
