id: modules/canvaskit-avoid-typeface-getdefault
title: In CanvasKit examples and applications, avoid CanvasKit.Typeface.GetDefault() and instantiate typefaces
  explicitly from font data or FontMgr to support builds without embedded fonts
polarity: dont
severity: should_fix
rubric: readability
rule: In CanvasKit applications, examples, and tests, do not rely on CanvasKit.Typeface.GetDefault() to
  create fonts or text components. Explicitly instantiate typefaces from font data using CanvasKit.Typeface.MakeTypefaceFromData()
  or load them via a CanvasKit.FontMgr (e.g., FontMgr.FromData).
why: CanvasKit.Typeface.GetDefault() only returns a valid typeface when CanvasKit is built with an embedded
  font (CK_EMBED_FONT), which is omitted in lean and custom production builds. Relying on GetDefault()
  causes it to return null in those configurations, breaking font creation and text rendering.
examples:
- |-
  Bad:

  ```cpp
  const textFont = new CanvasKit.Font(CanvasKit.Typeface.GetDefault(), 20);
  ```

  Good:

  ```cpp
  const roboto = CanvasKit.Typeface.MakeTypefaceFromData(fontData);
  const textFont = new CanvasKit.Font(roboto, 20);
  ```
include_glob:
- modules/canvaskit/**
- demos.skia.org/**
triggers:
- \b(?:CanvasKit\.|CK\.)?Typeface\.GetDefault\s*\(
- \bnew\s+(?:CanvasKit\.|CK\.)?Font\s*\(
- \b(?:CanvasKit\.|CK\.)?Typeface\.MakeTypefaceFromData\s*\(
- \b(?:CanvasKit\.|CK\.)?FontMgr\.(?:FromData|RefDefault)\b
- \bMakeEditor\s*\([^)]*typeface
citations:
- path: modules/canvaskit/CHANGELOG.md
  heading: Added
  quote: '- `CanvasKit.Typeface.GetDefault()` as a way to explicitly get the compiled-in typeface (if
    any).'
confidence: 0.9
support_cl_count: 1
