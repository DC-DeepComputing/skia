id: codec/omit-redundant-result-mapping-checks
title: When converting external or FFI decoder status enums via mapping helpers like MapDecodingResult
  or ToSkCodecResult, omit redundant special-cased enum checks
polarity: dont
severity: should_fix
rubric: readability
rule: When translating external or FFI status codes to SkCodec::Result using a centralized mapping helper
  (such as MapDecodingResult or ToSkCodecResult), do not add redundant special-case if checks for individual
  non-success variants like IncompleteInput. Delegate all non-success results directly to the helper function.
why: Centralized mapping helpers already encapsulate complete translation tables between third-party or
  Rust decoder error codes and SkCodec::Result. Manually intercepting specific enum variants before calling
  the mapping helper duplicates mapping logic, creates dead branches, and obscures control flow.
examples:
- |-
  Bad:

  ```cpp
  rust_bmp::DecodingResult result = fReader->read_image_data();
  if (result == rust_bmp::DecodingResult::IncompleteInput) {
      return SkCodec::kIncompleteInput;
  }
  if (result != rust_bmp::DecodingResult::Success) {
      return MapDecodingResult(result);
  }
  return SkCodec::kSuccess;
  ```

  Good:

  ```cpp
  rust_bmp::DecodingResult result = fReader->read_image_data();
  if (result != rust_bmp::DecodingResult::Success) {
      return MapDecodingResult(result);
  }
  return SkCodec::kSuccess;
  ```
include_glob:
- src/codec/**
- experimental/**
triggers:
- \b(?:MapDecodingResult|ToSkCodecResult)\s*[(]
- '\bif\s*[(][^)]*\bDecodingResult::'
- '==\s*[A-Za-z0-9_:]*DecodingResult::'
- '!=\s*[A-Za-z0-9_:]*DecodingResult::Success\b'
- \bDecodingResult\s+[a-zA-Z0-9_]+\s*=
confidence: 0.95
support_cl_count: 2
