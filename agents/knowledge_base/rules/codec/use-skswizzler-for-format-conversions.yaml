id: codec/use-skswizzler-for-format-conversions
title: When converting decoded scanlines to destination pixel formats in SkCodec implementations, use
  SkSwizzler instead of writing ad-hoc conversion loops or falling back to memcpy
polarity: do
severity: blocking
rubric: correctness
rule: In SkCodec implementations, use SkSwizzler to convert decoded scanlines to requested destination
  pixel formats (such as via initializeSwizzler() and fSwizzler->swizzle()). Do not implement ad-hoc color
  type conversion branching or fall back to memcpy for seemingly matching formats.
why: Codec callers can request destination formats not anticipated by manual conversion branches (such
  as kGray_8_SkColorType), and fallback memcpy assumes identical pixel layouts and row strides, resulting
  in corrupted pixel data. SkSwizzler handles channel swapping, format conversion, and alpha premultiplication
  correctly and efficiently.
examples:
- |-
  Bad:

  ```cpp
  if (dstInfo.colorType() == kRGBA_8888_SkColorType) {
      // ... manual color conversion ...
  } else if (dstInfo.colorType() == kRGB_565_SkColorType) {
      // ... manual 565 conversion ...
  } else {
      // Corrupts pixel layouts such as kGray_8_SkColorType or mismatched strides
      memcpy(dstRow, srcRow, std::min(srcRowBytes, dstRowBytes));
  }
  ```

  Good:

  ```cpp
  // Initialize SkSwizzler to handle destination color and alpha conversions
  fSwizzler = SkSwizzler::Make(this->getEncodedInfo(), nullptr, swizzlerInfo, swizzlerOptions);
  if (!fSwizzler) {
      return kInvalidConversion;
  }
  // ...
  // Swizzle scanline to destination format
  fSwizzler->swizzle(dstRow, srcRow.data());
  ```
include_glob:
- src/codec/**
- experimental/**
triggers:
- \bSkSwizzler::Make(?:Simple)?\b
- \b(?:fSwizzler|swizzler)->swizzle(?:Width)?\s*[(]
- \b(?:dstInfo|dst_info)[(][)]?\.colorType\s*[(][)]
- \b(?:std::)?memcpy\s*[(][^)]*\b(?:dstRow|dst_row|dstBytes|srcRow|src_row)\b
- \b(?:kRGBA_8888_SkColorType|kRGB_565_SkColorType|kGray_8_SkColorType|kBGRA_8888_SkColorType)\b
- \binitializeSwizzler\b
confidence: 0.92
support_cl_count: 1
