id: sksl/string-array-for-char-lookup-in-codegen
title: In SkSL code generators and text emitters accepting std::string_view, define character lookup tables
  as arrays of single-character string literals rather than contiguous strings
polarity: do
severity: nit
rubric: readability
rule: In SkSL backend code generators and text emitters where write() accepts std::string_view, define
  character or component lookup tables as arrays of 1-character string literals (e.g., static constexpr
  std::array<const char*, N> or const char* const[]) rather than a single contiguous string literal. Do
  not index into a contiguous string literal and wrap individual characters with std::string_view(&chars[i],
  1) or pass &chars[i] directly.
why: CodeGenerator::write overloads accept std::string_view, not char. Indexing a single string literal
  produces a char, which cannot be passed directly to write() without verbose std::string_view(&str[i],
  1) wrappers, and passing &str[i] erroneously emits the remainder of the null-terminated string. An array
  of 1-character string literals converts implicitly to std::string_view for clean, direct emission.
examples:
- |-
  Bad:

  ```cpp
  // Bad: contiguous string literal requires awkward string_view wrapping at write() call site
  static constexpr const char* kSwizzleChars = "xyzw";
  ...
  this->write(std::string_view(&kSwizzleChars[i], 1));
  ```

  Good:

  ```cpp
  // Good: array of 1-character string literals can be passed directly to write()
  static constexpr std::array<const char*, 4> kSwizzleChars = {"x", "y", "z", "w"};
  ...
  this->write(kSwizzleChars[i]);
  ```
include_glob:
- src/sksl/codegen/**
triggers:
- \bkSwizzle\w*\b
- (?:this->)?write\s*[(]\s*std::string_view\s*[(]&
- (?:this->)?write\s*[(]\s*k?\w*(?:Chars?|Swizzle|Components?|Lookup|Table)\[[^\\]]+\\]
- \b(?:static\s+)?(?:constexpr|const)\s+std::array<const\s+char\*,\s*\d+>
- \b(?:static\s+)?(?:constexpr|const)\s+const\s+char\*\s+k?\w*(?:Chars?|Swizzle|Components?)\s*=
confidence: 0.85
support_cl_count: 1
