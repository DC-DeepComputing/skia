id: tests/gate-assertions-on-capabilities-not-backend
title: In GPU tests, gate conditional assertions or test paths on specific Caps capability queries rather
  than blanket BackendApi checks
polarity: dont
severity: should_fix
rubric: testing
rule: In GPU unit tests, do not guard behavioral assertions or test execution paths on blanket backend
  checks (e.g. context->backend() != BackendApi::kVulkan). Query specific capability methods on Caps (e.g.
  caps->supportsHostImageCopy()) so configurations and devices of that backend lacking the optional feature
  still execute and validate the default path.
why: Blanket backend checks disable test assertions across all configurations of that backend, forfeiting
  coverage on devices where the optional feature or extension is disabled or unsupported. Querying specific
  capability flags via Caps ensures that configurations lacking the capability continue exercising and
  asserting standard fallback behavior.
examples:
- |-
  Bad:

  ```cpp
  // Blanket backend check disables assertion even when host image copy is unsupported on Vulkan
  if (context->backend() != BackendApi::kVulkan) {
      REPORTER_ASSERT(reporter, !finishCtx.fFinishedUpdate);
  }
  ```

  Good:

  ```cpp
  // Specific capability query asserts standard behavior on any context lacking the feature
  if (!caps->supportsHostImageCopy()) {
      REPORTER_ASSERT(reporter, !finishCtx.fFinishedUpdate);
  }
  ```
include_glob:
- tests/**
triggers:
- \b(?:context|dContext|rContext|recorder)->backend\(\)\s*(?:==|!=)
- \b(?:Gr|skgpu::)?BackendApi::k(?:OpenGL|Vulkan|Metal|Dawn|Direct3D|Mock)\b
- \b(?:caps|fCaps|caps\(\))->(?:supports[A-Z]|can[A-Z]|must[A-Z])\w*\s*\(
- \b(?:caps|fCaps)->[a-zA-Z0-9_]*Support[a-zA-Z0-9_]*\s*\(
confidence: 0.9
support_cl_count: 1
