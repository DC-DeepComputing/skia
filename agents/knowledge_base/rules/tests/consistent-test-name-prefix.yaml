id: tests/consistent-test-name-prefix
title: When naming unit tests (DEF_TEST), adhere to established prefixes for dm --match and selective
  CI bot filters, and structure names as Operation_InputState_ExpectedOutput
polarity: do
severity: should_fix
rubric: testing
rule: When authoring or adding unit tests (DEF_TEST, DEF_SERIAL_TEST, DEF_GRAPHITE_TEST, or DEF_GANESH_TEST),
  adhere strictly to the established test name prefix used across that test file for filtering via dm
  --match; for features run under selective CI configurations, ensure test names share an existing matched
  substring or update the bot's --match filter in infra/bots/gen_tasks_logic/dm_flags.go. Additionally,
  structure multi-part test names to explicitly indicate operation, input state or conditions, and expected
  output (Operation_InputState_ExpectedOutput), placing modifiers characterizing input geometry or state
  in the input condition segment rather than in the expected output segment.
why: Inconsistent test prefixes disrupt developer filtering workflows via dm --match and cause tests to
  be silently skipped on CI bots that execute selective test subsets via --match filters. Furthermore,
  vague test names or misplacing input geometry conditions into the expected output segment obscures test
  intent and failure context by conflating what is being tested with what is being asserted.
examples:
- |-
  Bad:

  ```cpp
  // In tests/SkPngRustEncoderTest.cpp (fails to match bot filter 'RustPngCodec' in dm_flags.go)
  DEF_TEST(Encode_png_Rust_smoke_test, r) {
      // ...
  }

  // In tests/SkBmpRustDecoderTest.cpp (violates file's established prefix convention)
  DEF_TEST(Codec_Bmp_Rust_IncrementalDecode, r) {
      // ...
  }

  // In tests/CappedHairlinesTest.cpp (input condition 'OpenContour' misplaced in output segment)
  DEF_TEST(DrawAntialiasHairline_SquareCappedHalfPixelOffset_SinglePixelWideOpenContourOutput,
           reporter) {
      // ...
  }
  ```

  Good:

  ```cpp
  // In tests/SkPngRustEncoderTest.cpp (shares prefix and added to --match in dm_flags.go)
  DEF_TEST(RustEncodePng_smoke_test, r) {
      // ...
  }

  // In tests/SkBmpRustDecoderTest.cpp (consistent prefix for 'dm --match RustBmpCodec')
  DEF_TEST(RustBmpCodec_IncrementalDecode, r) {
      // ...
  }

  // In tests/CappedHairlinesTest.cpp (structured: Operation_InputState_ExpectedOutput)
  DEF_TEST(DrawAntialiasHairline_SquareCappedHalfPixelOffsetOpenContour_SinglePixelWideOutput,
           reporter) {
      // ...
  }
  ```
include_glob:
- tests/**
- modules/**
- infra/bots/gen_tasks_logic/dm_flags.go
triggers:
- \bDEF_TEST\s*[(]
- \bDEF_SERIAL_TEST\s*[(]
- \bDEF_(?:GANESH|GRAPHITE)_TEST(?:_[A-Z_]+)?\s*[(]
- \bDEF_CONDITIONAL_(?:GRAPHITE_|GANESH_)?TEST(?:_[A-Z_]+)?\s*[(]
- \bDEF_TEST_DISABLED\s*[(]
- \bMatchExtraConfig\s*[(]
- \bmatch\s*=\s*append\s*[(]\s*match\b
citations:
- path: agents/skills/skia-gn-workflow/references/dm_usage.md
  heading: Matching/Filtering
  quote: |-
    - `--match` (or `-m`): Filter tests by name. Supports:
        - `substring`: Matches any part of the name.
- path: rust/png/README.md
  heading: gn / ninja
  quote: |-
    out/RustPng/dm --src tests --nogpu \
        --match RustPngCodec \
                RustEncodePng
- path: site/docs/dev/testing/testing.md
  heading: Correctness Testing
  quote: 'out/Debug/dm --match blur  # Run only work with "blur" in its name.'
confidence: 0.98
support_cl_count: 3
