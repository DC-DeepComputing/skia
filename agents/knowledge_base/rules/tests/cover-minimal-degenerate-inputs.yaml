id: tests/cover-minimal-degenerate-inputs
title: When testing algorithms operating on sequences, curves, or point sets, include explicit unit test
  coverage for minimal degenerate inputs such as single-element or single-point cases
polarity: do
severity: should_fix
rubric: testing
rule: When authoring unit tests or regression tests for algorithms that operate on sequences, curves,
  polylines, or point sets, include explicit test coverage for minimal degenerate inputs (such as a single
  point, single element, or minimal boundary size). Do not test only multi-point or multi-element cases
  (such as N >= 2 or N >= 3).
why: Algorithms that process sequences, curves, or point sets often implicitly assume multi-element inputs
  when computing differences, slopes, subdivisions, or neighbor indices. Minimal inputs like a single
  point or element are frequent sources of edge-case bugs (such as division by zero, out-of-bounds indexing,
  or null dereferences) and require explicit unit test verification.
examples:
- |-
  Bad:

  ```cpp
  // Test table only exercises multi-point inputs (N >= 2)
  const SlopeTest tests[] = {
      {
          .name = "N=2, two-point difference",
          .curve = { .fControlPoints = {{0.f, 0.f}, {1.f, 1.f}} },
          .expectedM = 1.f,
      },
      {
          .name = "Three-point endpoint slope",
          .curve = { .fControlPoints = {{0.f, 0.f}, {1.f, 1.f}, {2.f, 0.f}} },
          .expectedM = 0.5f,
      },
  };
  ```

  Good:

  ```cpp
  // Explicitly cover the minimal degenerate input (single point / N=1) alongside multi-point cases
  const SlopeTest tests[] = {
      {
          .name = "SinglePoint",
          .curve = { .fControlPoints = {{1.f, 1.f}} },
          .expectedM = 0.f,
      },
      {
          .name = "N=2, two-point difference",
          .curve = { .fControlPoints = {{0.f, 0.f}, {1.f, 1.f}} },
          .expectedM = 1.f,
      },
  };
  ```
include_glob:
- tests/**
triggers:
- \b(?:fControlPoints|controlPoints|ControlPoint)\b
- \b(?:curve|curves|polygon|polyline|points?|vertices|pts)\s*(?:=|:|\[|\{)
- \b(?:kNumPoints|kNumTests?|tests?\[\])\b
- \bDEF_(?:GANESH_|GRAPHITE_)?TEST\s*[(]\s*\w*(?:Curve|Slope|Spline|Poly|Sequence|Points?|Interpolat)\w*
- \.[fF]?(?:ControlPoints|Points|Coords|Spline|Curve)\s*=
- \b(?:SinglePoint|single_point|OnePoint|MinimalInput)\b
confidence: 0.9
support_cl_count: 1
