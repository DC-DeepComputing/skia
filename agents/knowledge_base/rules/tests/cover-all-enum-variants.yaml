id: tests/cover-all-enum-variants
title: When writing unit tests or rendering tests parameterized across an enum, test all enum values including
  defaults rather than omitting variants
polarity: do
severity: should_fix
rubric: testing
rule: When authoring unit tests or rendering tests parameterized across an enumeration (such as SkPaint::Cap,
  SkPaint::Join, or SkBlendMode), cover every valid enum value across test cases or loops. Do not omit
  default, identity, or basic variants (such as SkPaint::kButt_Cap or SkBlendMode::kSrcOver) unless there
  is an explicit, documented reason why a value does not apply.
why: Omitting enum variants leaves critical code paths and default configurations untested. Exhaustively
  exercising all variants catches corner cases, ensures fallback and default pipelines function properly,
  and prevents regressions when shared routines dispatch across enumeration states.
examples:
- |-
  Bad:

  ```cpp
  // Testing cap rendering but accidentally omitting default kButt_Cap
  DEF_TEST(DrawHairline_SquareCap, r) { draw_hairline(r, SkPaint::kSquare_Cap); }
  DEF_TEST(DrawHairline_RoundCap, r) { draw_hairline(r, SkPaint::kRound_Cap); }
  ```

  Good:

  ```cpp
  // Explicitly testing all enum variants including default kButt_Cap
  DEF_TEST(DrawHairline_ButtCap, r) { draw_hairline(r, SkPaint::kButt_Cap); }
  DEF_TEST(DrawHairline_SquareCap, r) { draw_hairline(r, SkPaint::kSquare_Cap); }
  DEF_TEST(DrawHairline_RoundCap, r) { draw_hairline(r, SkPaint::kRound_Cap); }
  ```
include_glob:
- tests/**
- gm/**
triggers:
- \bDEF_(?:GANESH_)?TEST\s*\(
- \bDEF_(?:SIMPLE_)?GM\s*\(
- \b(?:SkPaint::)?k(?:Butt|Round|Square)_Cap\b
- \b(?:SkPaint::)?k(?:Miter|Round|Bevel)_Join\b
- \b(?:SkBlendMode|SkClipOp|SkTileMode|SkFilterMode|SkColorType)::k\w+\b
- \b(?:setStrokeCap|setStrokeJoin|setBlendMode)\s*\(
- \bfor\s*\([^)]*\b(?:Cap|Join|BlendMode|TileMode|FilterMode|ColorType)\b
confidence: 0.92
support_cl_count: 1
