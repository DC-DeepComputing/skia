id: tests/avoid-tautological-constant-tests
title: When writing unit tests for constants or format definitions, avoid tautological assertions that
  only check constants against their defined literal values
polarity: dont
severity: should_fix
rubric: readability
rule: Do not author unit tests that merely assert a named constant equals the exact literal value it was
  initialized with. Reserve constant-related test assertions for verifying non-trivial relationships across
  multiple constants, specification-mandated format signatures, multi-byte layouts, or calculated derivations.
why: Tests asserting that a constant equals its own literal definition pass tautologically by construction
  and provide no regression protection or functional coverage. They add maintenance overhead, clutter
  test suites, and create a false impression of meaningful verification.
examples:
- |-
  Bad:

  ```cpp
  // Rust:
  #[test]
  fn test_icc_profile_constants() {
      assert_eq!(BITMAPV5HEADER_SIZE, 124);
  }
  #[test]
  fn test_pixel_format_constants() {
      assert_eq!(BYTES_PER_PIXEL_RGB, 3);
  }

  // C++:
  DEF_TEST(PixelFormatConstants, reporter) {
      REPORTER_ASSERT(reporter, kBytesPerPixelRGB == 3);
  }
  ```

  Good:

  ```cpp
  // Rust: verify multi-byte wire format signature or endian layout
  #[test]
  fn test_bmp_signature() {
      assert_eq!(BMP_SIGNATURE[0], b'B');
      assert_eq!(BMP_SIGNATURE[1], b'M');
      assert_eq!(BMP_SIGNATURE_U16, 0x4D42);
  }

  // C++: verify cross-constant invariant or layout relationship
  DEF_TEST(HeaderSizeValid, reporter) {
      REPORTER_ASSERT(reporter, kHeaderSize >= sizeof(HeaderPrefix));
  }
  ```
include_glob:
- tests/**
- modules/**
- experimental/**
- rust/**
triggers:
- \bassert_eq!\s*[(]\s*[A-Z0-9_]+,\s*[-0-9]
- \bassert_eq!\s*[(]
- \bREPORTER_ASSERT(?:_MESSAGE)?\s*[(][^)]*==\s*[-0-9]
- \bREPORTER_ASSERT(?:_MESSAGE)?\s*[(][^)]*\bk[A-Z]\w*\s*==
- \b#\[test\]
confidence: 0.85
support_cl_count: 1
