- \bfn\s+(?:is_[a-z0-9_]+|parse_[a-z0-9_]+|new_reader)\s*[(]
- \b(?:data|input|stream|bytes|buffer)\s*:\s*&
- \b(?:make_unique|UniquePtr)<.*SkStreamAdapter
- \bSkCopyStreamToData\b
- include![(].*SkStreamAdapter\.h.*[)]
