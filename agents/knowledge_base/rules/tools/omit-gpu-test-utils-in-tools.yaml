id: tools/omit-gpu-test-utils-in-tools
title: 'When writing or modifying testing and tooling code under tools/, omit redundant #if defined(GPU_TEST_UTILS)
  preprocessor guards around test-only headers, members, or options'
polarity: dont
severity: should_fix
rubric: readability
rule: Do not add `#if defined(GPU_TEST_UTILS)` or `#ifdef GPU_TEST_UTILS` preprocessor guards around headers,
  fields, or helper calls in code under `tools/`. Tooling infrastructure is exclusively compiled in test
  configurations where test utilities are enabled, making preprocessor guards redundant.
why: '`GPU_TEST_UTILS` conditionally excludes test-only hooks and private options from production builds
  of `src/gpu` and `include/gpu`. Code under `tools/` is dedicated testing and tooling infrastructure
  that is never included in production library builds, so wrapping test utilities or headers in preprocessor
  guards adds unnecessary clutter.'
examples:
- |-
  Bad:

  ```cpp
  #if defined(GPU_TEST_UTILS)
  #include "src/gpu/graphite/ContextOptionsPriv.h"
  #endif

  struct TestOptions {
      TestOptions() {
  #if defined(GPU_TEST_UTILS)
          fContextOptions.fOptionsPriv = &fOptionsPriv;
  #endif
      }

  #if defined(GPU_TEST_UTILS)
      skgpu::graphite::ContextOptionsPriv fOptionsPriv;
  #endif
  };
  ```

  Good:

  ```cpp
  #include "src/gpu/graphite/ContextOptionsPriv.h"

  struct TestOptions {
      TestOptions() {
          fContextOptions.fOptionsPriv = &fOptionsPriv;
      }

      skgpu::graphite::ContextOptionsPriv fOptionsPriv;
  };
  ```
include_glob:
- tools/**
triggers:
- '#(?:if|ifdef)\s+.*\bGPU_TEST_UTILS\b'
- \bdefined\s*\(\s*GPU_TEST_UTILS\s*\)
- \bGPU_TEST_UTILS\b
- \bContextOptionsPriv\b
- \bfOptionsPriv\b
confidence: 0.9
support_cl_count: 1
