id: api/prefer-pair-or-struct-over-out-parameters
title: When designing functions producing results or multiple outputs, return values, structs, pairs,
  or std::optional directly instead of mutating out-parameters
polarity: do
severity: should_fix
rubric: readability
rule: When designing functions that produce results, return the value directly—as a primitive, small value
  type, configured struct, std::pair, or std::optional<T>—rather than taking mutable out-parameters (Type*,
  Type**, std::optional<T>*) or splitting results across a status/size return code and an out-parameter.
  For fallible deserialization, parsing, or factory methods, return std::optional<T> by value and provide
  secondary outputs (such as bytes read) via an optional pointer defaulted to nullptr (e.g., size_t* bytesRead
  = nullptr). Reserve status return codes with out-parameters for functions requiring multi-state result
  codes (such as tri-state enums). Never pass mutable out-parameters via non-const reference; pass unavoidable
  in-out parameters as simple raw pointers.
why: Returning values, configured structs, or fallible optional results directly by value supports single-line
  initialization and clean caller control flow (e.g., structured bindings or if (!result)), avoids awkward
  temporary variable pre-declarations and address-of (&) boilerplate at call sites, eliminates unneeded
  null checks in implementations, and makes data flow explicit. Splitting outputs between return values
  and out-parameters or using pointer-to-pointer/reference wrappers obscures output state and complicates
  caller call sites.
examples:
- |-
  Bad:

  ```cpp
  // Bad: using output pointer parameters for single values or small value types
  virtual void onGetFontStyle(SkFontStyle* fontStyle) const;
  virtual void onGetFixedPitch(bool* fixedPitch) const;

  // Bad: taking an out-parameter for deserialized object and returning size/status
  static size_t readFromMemory(SkPath* path, const void* buffer, size_t length);

  // Bad: taking an optional out-pointer alongside a status/boolean return code
  virtual FilterReturn filterRRectToNine(const SkRRect&, const SkMatrix&,
                                        const SkIRect& clip,
                                        std::optional<NinePatch>* out) const;

  // Bad: splits status flag and output object across return type and out-parameter
  virtual bool asImageFilter(const SkMatrix& ctm,
                             const SkPaint& paint,
                             sk_sp<SkImageFilter>& dstImageFilter) const;

  // Bad: returning std::optional alongside a mutable out-parameter
  virtual std::optional<SkPath> generatePath(const SkGlyph& glyph, bool* modified);
  ```

  Good:

  ```cpp
  // Good: returns single value or small value type directly by value
  virtual SkFontStyle onGetFontStyle() const;
  virtual bool onGetFixedPitch() const;

  // Good: returns std::optional<T> by value with optional secondary out-parameter
  static std::optional<SkPath> ReadFromMemory(const void* buffer, size_t length,
                                              size_t* bytesRead = nullptr);

  // Good: returns std::optional by value for fallible single results
  virtual std::optional<NinePatch> filterRRectToNine(const SkRRect&,
                                                    const SkMatrix&,
                                                    const SkIRect& clip) const;

  // Good: bundles outputs into std::pair or dedicated struct
  virtual std::pair<sk_sp<SkImageFilter>, bool> asImageFilter(const SkMatrix& ctm,
                                                              const SkPaint& paint) const;

  // Good: returns composite result in std::optional<Struct>
  struct GeneratedPath { SkPath path; bool modified; };
  virtual std::optional<GeneratedPath> generatePath(const SkGlyph& glyph);
  ```
include_glob:
- include/**
- src/**
- modules/**
- tools/**
