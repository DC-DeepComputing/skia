id: api/update-default-utilities-over-parallel-safe-variants
title: When addressing numerical overflow or edge cases in utility functions or macros, update the default
  implementation directly instead of introducing parallel Safe variants
polarity: dont
severity: should_fix
rubric: design
rule: Do not introduce a parallel Safe... or ..._safe variant of an existing utility function or macro
  (such as SkScalarSafeAve) when addressing numerical overflow or boundary edge cases. Instead, update
  the default utility implementation directly so all existing callers benefit from the fix, unless profiling
  proves that an unchecked legacy path is strictly required for performance.
why: Introducing separate 'Safe' variants alongside existing helpers fragments the API and leaves existing
  call sites vulnerable to the unhandled overflow or edge case. Updating the default implementation keeps
  the interface unified and ensures consistent correctness across all callers without code duplication.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Introduces a separate Safe macro, leaving existing callers of SkScalarAve vulnerable to overflow
  #define SkScalarHalf(a)             ((a) * SK_ScalarHalf)
  #define SkScalarAve(a, b)           (((a) + (b)) * SK_ScalarHalf)
  #define SkScalarSafeAve(a, b)       (SkScalarHalf(a) + SkScalarHalf(b))
  ```

  Good:

  ```cpp
  // Good: Fixes the default macro directly so all callers are protected from overflow
  #define SkScalarHalf(a)             ((a) * SK_ScalarHalf)
  #define SkScalarAve(a, b)           (SkScalarHalf(a) + SkScalarHalf(b))
  ```
include_glob:
- include/**
- src/**
triggers:
- '#\s*define\s+[A-Za-z0-9_]*(?:Safe[A-Z]|_safe)\w*'
- \b(?:static\s+|inline\s+|constexpr\s+)*[A-Za-z0-9_:<>]+\s+[A-Za-z0-9_]*(?:Safe[A-Z]|_safe)\w*\s*[(]
- \b(?:Sk|sk_)?[A-Za-z0-9_]*Safe(?:Ave|Add|Sub|Mul|Div|Mod|Round|Floor|Ceil|Clamp|Midpoint)\b
- \bSkScalarSafe\w*\b
- \b[A-Za-z0-9_]*(?:SafeAve|SafeAdd|SafeSub|SafeMul|SafeDiv)\s*[(]
confidence: 0.9
support_cl_count: 1
