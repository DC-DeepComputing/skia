id: api/match-file-comment-style
title: When adding comments, use // line comments inside function bodies even for multi-line notes, and
  match established /** ... */ block style for declarations
polarity: do
severity: should_fix
rubric: readability
rule: Always use '//' line comments for implementation notes inside function bodies, even for multi-line
  explanations; do not introduce '/* ... */' or '/** ... */' block comments inside functions. For declarations,
  headers, and file-level documentation, match the file's established style by using '/** ... */' Doxygen
  block comments where established, rather than introducing inconsistent '//' line comments.
why: In Skia, implementation code inside function bodies conventionally uses '//' line comments, reserving
  '/** ... */' Doxygen block comments for declarations outside functions. Mixing block comments into function
  bodies or introducing inconsistent comment syntax within a file disrupts visual scanning and creates
  unnecessary vertical clutter.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Using block comments inside a function body:
  void CheckFormat(const BufferDesc& bufferDesc) {
      /**
       * Check for a special case - the usage of AHARDWAREBUFFER_FORMAT_B8G8R8A8_UNORM - when
       * building for the Android framework.
       */
      if (bufferDesc.format == AHARDWAREBUFFER_FORMAT_B8G8R8A8_UNORM) { ... }
  }

  // Bad: Using // line comments in headers standardizing on /** ... */ block comments:
  // Note: this file may be included in clients' SkUserConfig.h files, so including any other headers
  // in this file should be avoided.
  enum class LogPriority : int { ... };
  ```

  Good:

  ```cpp
  // Good: Use // line comments inside function bodies, even for multi-line notes:
  void CheckFormat(const BufferDesc& bufferDesc) {
      // Check for a special case - the usage of AHARDWAREBUFFER_FORMAT_B8G8R8A8_UNORM - when
      // building for the Android framework.
      if (bufferDesc.format == AHARDWAREBUFFER_FORMAT_B8G8R8A8_UNORM) { ... }
  }

  // Good: Use /** ... */ block comments in headers standardizing on Doxygen block comments:
  /**
   * Note: this file may be included in clients' SkUserConfig.h files, so including any other headers
   * in this file should be avoided.
   */
  enum class LogPriority : int { ... };
  ```
include_glob:
- include/**
- src/**
- modules/**
exclude_glob:
- third_party/**
triggers:
- ^\s*//\s*(?:Note|Warning|Notice|See|TODO|FIXME):?\b
- ^\s*//\s*(?:This|The|When|If|In|For|All|Each|Every|Callers?|Clients?|Check)\b
- ^\s*/\*\*?\s*$
- ^\s*/\*\*?\s+(?:Note|Warning|Notice|See|TODO|FIXME|[A-Z])
- ^\s*\*\s+(?:Note|Warning|Notice|See|TODO|FIXME):?\b
- ^\s*\*\s+[A-Z][A-Za-z0-9_]*\b
confidence: 0.98
support_cl_count: 3
