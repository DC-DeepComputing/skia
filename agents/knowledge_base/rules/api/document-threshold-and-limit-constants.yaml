id: api/document-threshold-and-limit-constants
title: When declaring configuration structs, compile-time tuning constants, or capacity and threshold
  limits, document their controlling subsystem, units, guarded constraints, or migration TODOs
polarity: do
severity: should_fix
rubric: readability
rule: When defining configuration structs, tuning parameters, or capacity and threshold limits in headers
  (such as SparseStripConfig, kMaxGPUPathRendererVerbs, or kMaxSubclassSize), document their intent with
  clarifying comments. Group parameters by the subsystem or class they control, specify units and cross-module
  constraints, and explain which implementations enforce limits, why sizing values were chosen, and what
  hazards (such as OOM) they prevent. If a base class limit exists temporarily to accommodate a legacy
  implementation undergoing migration, add an attributed TODO explaining when it can be relaxed or removed.
why: Undocumented configuration structs and arbitrary threshold or limit constants leave maintainers uncertain
  why specific values were chosen, which subsystems depend on them, or how altering them impacts behavior.
  Documenting controlling subsystems, units, and sizing constraints prevents misconfiguration, undersized
  storage buffers, and subtle cross-module regressions, while migration TODOs clarify that base class
  limits are temporary debt rather than fundamental architectural constraints.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Arbitrary threshold constant without explanation of purpose or guarded hazards
  class PathRenderer : public SkRefCnt {
  public:
      static constexpr int kMaxGPUPathRendererVerbs = 1 << 14;
  };

  // Bad: Undocumented temporary limit on a base class constrained by a legacy subclass
  class DrawListBase {
  public:
      static constexpr int kMaxRenderSteps = 4096;
      static_assert(kMaxRenderSteps <= std::numeric_limits<uint16_t>::max());
  };

  // Bad: Undocumented configuration struct with ambiguous controlling subsystems and units
  struct SparseStripConfig {
      static constexpr uint16_t kTileWidth  = 8;
      static constexpr uint16_t kTileHeight = 8;
      static constexpr int32_t kAtlasWidth  = 8192;
  };
  ```

  Good:

  ```cpp
  // Good: Documents which renderers enforce the limit and what hazard is prevented
  class PathRenderer : public SkRefCnt {
  public:
      // Used to guard TriangulatingPathRenderer and DefaultPathRenderer from excessively complex
      // paths, which may cause OOM or other stalls.
      static constexpr int kMaxGPUPathRendererVerbs = 1 << 14;
  };

  // Good: Attributed TODO clarifies the limit is temporary debt tied to a legacy subclass
  class DrawListBase {
  public:
      // TODO(username): Remove or increase this limit once DrawListLayer replaces legacy DrawList
      static constexpr int kMaxRenderSteps = 4096;
      static_assert(kMaxRenderSteps <= std::numeric_limits<uint16_t>::max());
  };

  // Good: Documents controlling subsystems, units (pixels), and cross-module shader constraints
  struct SparseStripConfig {
      // Controls the size, in pixels, of tiles generated by polylines. Must match fragment shader.
      static constexpr uint16_t kTileWidth  = 8;
      static constexpr uint16_t kTileHeight = 8;
      // Controls AlphaAtlasManager texture allocation
      static constexpr int32_t kAtlasWidth  = 8192;
  };
  ```
include_glob:
- include/**
- src/**
