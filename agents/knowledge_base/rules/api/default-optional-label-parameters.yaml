id: api/default-optional-label-parameters
title: When declaring GPU resource, cache, or surface APIs accepting diagnostic labels, default optional
  std::string_view label parameters to {}
polarity: do
severity: should_fix
rubric: readability
rule: In GPU resource, cache, and surface factory APIs, provide a default empty value (= {}) for trailing
  optional std::string_view label parameters (e.g., std::string_view label = {}). Do not force callers
  that do not require diagnostic labels to pass boilerplate empty strings or dummy comments like /*label=*/"".
why: Many GPU resource types (such as samplers, descriptor sets, and scratch buffers) and unit tests do
  not require diagnostic debug labels. Providing a default '= {}' simplifies call sites by eliminating
  redundant empty string arguments while keeping diagnostic labels readily available when needed.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Callers must pass boilerplate empty strings when labels are not needed
  Resource* findAndRefResource(const GraphiteResourceKey& key,
                               Budgeted budgeted,
                               Shareable shareable,
                               std::string_view label,
                               const ScratchResourceSet* unavailable = nullptr);

  // Call site:
  fResourceCache->findAndRefResource(key, kBudgeted, kShareable, /*label=*/"");
  ```

  Good:

  ```cpp
  // Good: Default '= {}' allows callers to omit optional diagnostic labels
  Resource* findAndRefResource(const GraphiteResourceKey& key,
                               Budgeted budgeted,
                               Shareable shareable,
                               std::string_view label = {},
                               const ScratchResourceSet* unavailable = nullptr);

  // Call site:
  fResourceCache->findAndRefResource(key, kBudgeted, kShareable);
  ```
include_glob:
- include/gpu/**
- src/gpu/**
triggers:
- \bstd::string_view\s+(?:[Ll]abel|[Nn]ame)\s*=
- \bstd::string_view\s+(?:[Ll]abel|[Nn]ame)\s*[,)]
- \bstd::string_view\s+[a-zA-Z0-9_]*[Ll]abel\b
- /\*(?:[a-zA-Z0-9_]*[Ll]abel)=\*/
- \b(?:findAndRefResource|findResource|refResource|makeResource)\s*\(
confidence: 0.9
support_cl_count: 1
