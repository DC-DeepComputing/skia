id: api/include-std-headers-for-inline-methods
title: When defining inline methods in exported headers that call standard library utilities, explicitly
  include required standard headers instead of relying on transitive includes
polarity: do
severity: blocking
rubric: readability
rule: Ensure exported header files are self-contained by explicitly including required standard library
  headers (such as <algorithm> for std::clamp/std::min/std::max, <cmath> for std::round/std::floor, or
  <utility> for std::move/std::forward) used by inline method definitions. Do not rely on transitive includes
  through other headers.
why: Transitive header inclusions vary across standard library implementations (libc++, libstdc++, MSVC
  STL) and downstream embedders like Chromium and Android. While Skia style prefers minimizing includes
  via forward declaration, inline methods calling standard library templates cannot forward-declare them
  and break downstream embedder builds if required headers are omitted.
examples:
- |-
  Bad:

  ```cpp
  // include/private/SkHdrMetadata.h (missing <algorithm> and <cmath>)
  uint16_t getUint16MaxCLL() const {
      return static_cast<uint16_t>(std::clamp(std::round(fMaxCLL), 0.f, 65535.f));
  }
  ```

  Good:

  ```cpp
  // include/private/SkHdrMetadata.h
  #include <algorithm>
  #include <cmath>

  uint16_t getUint16MaxCLL() const {
      return static_cast<uint16_t>(std::clamp(std::round(fMaxCLL), 0.f, 65535.f));
  }
  ```
include_glob:
- include/**
- modules/**/include/**
triggers:
- \bstd::(?:clamp|min|max|find(?:_if)?|count(?:_if)?|sort|accumulate)\b
- \bstd::(?:round|floor|ceil|abs|sqrt|copysign|trunc|isnan|isinf)\b
- \bstd::(?:move|forward|swap|exchange|make_unique|make_shared)\b
- \bstd::(?:vector|string|string_view|optional|variant|tuple|pair|unique_ptr|shared_ptr)<
- '#include\s+<(?:algorithm|cmath|numeric|utility|memory|optional|vector|string)>'
citations:
- path: site/docs/dev/contrib/style.md
  heading: '## Files'
  quote: We prefer to minimize includes. If forward declaring a name in a header is sufficient then that
    is preferred to an include.
confidence: 0.95
support_cl_count: 1
