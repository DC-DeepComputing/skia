id: api/prefer-skto-over-static-cast
title: When converting or narrowing numeric types and container sizes, use Skia checked conversion helpers
  like SkToInt and SkTo<T> instead of raw static_cast
polarity: do
severity: nit
rubric: readability
rule: When converting or narrowing numeric values (such as container sizes or integer types), use Skia's
  checked conversion helpers (such as SkToInt, SkToSizeT, SkToUInt, SkToU32, SkToU16, or SkTo<T>) instead
  of raw static_cast<T>. When conversions are lossless promotions or can be avoided entirely, prefer matching
  variable and parameter types.
why: In Skia, include/private/SkTo.h conversion helpers wrap static_cast with SkASSERT(SkTFitsIn<D>(s))
  debug checks. Using these helpers is more concise and idiomatic than raw static_cast, while catching
  unexpected integer overflow, signedness mismatches, or truncation in debug builds.
examples:
- |-
  Bad:

  ```cpp
  // Bad: raw static_cast performs unchecked narrowing conversions.
  for (int i = 0; i < static_cast<int>(fEmbeddedImages.size()); ++i) {
      processImage(i);
  }
  uint32_t count = static_cast<uint32_t>(rawCount);
  size_t byteCount = static_cast<size_t>(signedLen);
  ```

  Good:

  ```cpp
  // Good: Skia checked helpers assert in debug builds that values fit.
  for (int i = 0; i < SkToInt(fEmbeddedImages.size()); ++i) {
      processImage(i);
  }
  uint32_t count = SkToU32(rawCount);
  size_t byteCount = SkToSizeT(signedLen);
  ```
include_glob:
- include/**
- src/**
- modules/**
- tests/**
- experimental/**
- tools/**
triggers:
- \bstatic_cast<\s*(?:u?int(?:8|16|32|64)?(?:_t)?|size_t|unsigned(?:\s+int)?)\s*>
- \bstatic_cast<\s*(?:float|double|SkScalar)\s*>
- \bSkTo(?:Int|UInt|SizeT|U32|U16|U8|S32|S16|S8)?\s*\(
- \bSkTo<[^>]+>\s*\(
- '#include\s+[<"](?:include/private/)?(?:base/)?SkTo\.h[>"]'
confidence: 0.9
support_cl_count: 1
