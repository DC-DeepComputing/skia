id: api/keep-experimental-algorithms-external
title: When developing experimental or prototype algorithms on core classes like SkPath, stage them as
  external standalone utilities instead of adding or modifying core methods
polarity: dont
severity: should_fix
rubric: design
rule: Do not add experimental or prototype algorithms as member methods to core public API classes (such
  as SkPath) or directly alter established core methods to incorporate them. Instead, stage experimental
  helpers and prototype algorithms as external standalone utility functions (e.g., in tools/viewer slides
  or dedicated utility modules like SkPathUtils) until they are mature and stabilized.
why: Modifying core public classes or altering established methods with experimental algorithms expands
  the public interface, risks behavioral regressions and churn for downstream embedders, and creates long-term
  API maintenance burdens. Staging prototype algorithms as standalone external utilities keeps core class
  interfaces minimal, isolates risk, and allows experimental code to evolve freely.
examples:
- |-
  Bad:

  ```cpp
  // include/core/SkPath.h or src/core/SkPath.cpp: adding or modifying core member methods
  class SK_API SkPath {
  public:
      bool general_interpolate(const SkPath& ending, SkScalar weight, SkPath* out) const;
  };

  bool SkPath::interpolate(const SkPath& ending, SkScalar weight, SkPath* out) const {
      // Directly modifying established core method with experimental algorithm
      createPathFromTValues(*this, tValuesToAdd1, tValues1, &thisCubic);
      createPathFromTValues(ending, tValuesToAdd2, tValues2, &endingCubic);
      ...
  }
  ```

  Good:

  ```cpp
  // tools/viewer/PathLerpSlide.cpp or dedicated utility header (e.g. include/utils/SkPathUtils.h):
  // Stage experimental algorithm as external standalone utility function
  bool generalInterpolate(const SkPath& beginning, const SkPath& ending, SkScalar weight, SkPath* out) {
      if (beginning.isInterpolatable(ending)) {
          return beginning.interpolate(ending, weight, out);
      }
      // Prototype general interpolation isolated in utility/tool code
      ...
  }
  ```
include_glob:
- include/**
- src/**
- tools/**
triggers:
- \bclass\s+(?:SK_API\s+)?SkPath\b
- \bSkPath::[a-z]\w*\s*[(]
- \b(?:bool|void|int|SkScalar)\s+[a-z][A-Za-z0-9_]*[iI]nterpolate[A-Za-z0-9_]*\s*[(]
- \bgeneralInterpolate\s*[(]
- \b(?:const\s+)?SkPath\s*&\s*[a-zA-Z0-9_]+
- \bSkPath\s*\*\s*[a-zA-Z0-9_]+
- \bSK_API\s+(?:bool|void|int|SkScalar|sk_sp<[A-Za-z0-9_]+>)\s+[a-z][A-Za-z0-9_]*[(]
- \bSkPathUtils::\w+
citations:
- path: site/docs/dev/contrib/style.md
  heading: Files
  quote: Headers that aren't meant for public consumption should be placed in src directories so that
    they aren't in a client's search path, or in include/private if they need to be used by public headers.
- path: site/docs/dev/contrib/style.md
  heading: Folder Organiziation
  quote: Skia's public API should live in the `include` directory. Skia's private headers and implementation
    files should live in the `src` directory... Private utilities to test Skia live in `tools` and can
    be used for reference but should not be used by clients.
