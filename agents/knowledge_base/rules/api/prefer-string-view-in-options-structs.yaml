id: api/prefer-string-view-in-options-structs
title: In ephemeral options, descriptor, or configuration structs passed to factory functions, store string
  fields as std::string_view rather than owning SkString
polarity: do
severity: should_fix
rubric: safety
rule: In ephemeral options, descriptor, and configuration structs passed to factory or initialization
  functions, store string parameters as std::string_view (or const char*) rather than owning string types
  like SkString or std::string. Leave string allocation and ownership to the long-lived instantiated object.
why: Options and descriptor structs are short-lived and typically passed by const reference during construction.
  Using std::string_view avoids unnecessary heap allocations and string copies when callers pass string
  literals or views, deferring memory allocation to the created object.
examples:
- |-
  Bad:

  ```cpp
  struct Options {
      bool forceUnoptimized = false;
      SkString fName;
  };
  ```

  Good:

  ```cpp
  struct Options {
      bool forceUnoptimized = false;
      std::string_view fName;
  };
  ```
include_glob:
- include/**
- src/**
triggers:
- \b(?:struct|class)\s+[A-Za-z0-9_]*(?:Options|Descriptor|Desc|Config|Settings|Params)\b
- \b(?:Options|Descriptor|Desc|Config|Settings|Params)\s*\{
- \b(?:SkString|std::string)\s+f[A-Z]\w*
- \bstd::string_view\s+f[A-Z]\w*
- \b(?:SkString|std::string_view|const\s+char\*)\s+f(?:Name|Label|Tag|Title|Desc|Identifier)\b
confidence: 0.9
support_cl_count: 1
