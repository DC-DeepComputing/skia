id: api/avoid-speculative-private-type-aliases
title: When modifying or replacing header symbols, retain backward-compatible aliases if downstream clients
  depend on them, but delete unreferenced APIs directly without speculative stubs
polarity: dont
severity: should_fix
rubric: design
rule: 'When refactoring, renaming, or replacing public macros, methods, or types in headers (include/**
  and modules/**/include/**), verify downstream client usage across embedders (Chromium, Android, Google3,
  Flutter). If external clients depend on the symbol, retain backward-compatible aliases or forwarding
  definitions (such as #define macros or using aliases) rather than abruptly deleting them. Conversely,
  if downstream search confirms no external clients reference the symbol, delete the API, obsolete forward
  declarations, and unused types directly in the same change instead of introducing speculative compatibility
  aliases, dummy stub methods, or deprecation TODO comments.'
why: Public headers define Skia's API surface consumed by external embedders; deleting referenced symbols
  breaks downstream builds, so transitional aliases are necessary when clients depend on them. However,
  introducing speculative shims or stubs for unused symbols creates dead code and maintenance debt when
  downstream code search confirms no callers exist.
examples:
- |-
  Bad:

  ```cpp
  // Bad: Abruptly deleting a public macro or function still used by downstream embedders
  // include/core/SkScalar.h
  #define SkScalarHalf(a)             ((a) * SK_ScalarHalf)
  // SkScalarAve removed outright without backward-compatible alias

  // Bad: Speculative compatibility alias and tracking TODO for a private type
  // include/private/SkEncodedInfo.h
  // TODO(https://issues.skia.org/issues/12345): Remove once no dependencies use ICCProfile.
  using ICCProfile = SkCodecs::ColorProfile;

  // Bad: Leaving dummy deprecation stubs for unreferenced public APIs
  // include/core/SkPath.h
  struct SkArc;
  // Deprecated -- will be removed
  bool isArc(SkArc*) const { return false; }
  ```

  Good:

  ```cpp
  // Good: Retain backward-compatible alias or forwarder when downstream callers depend on it
  // include/core/SkScalar.h
  #define SkScalarHalf(a)             ((a) * SK_ScalarHalf)
  #define SkScalarAve(a, b)           sk_float_midpoint(a, b)

  // Good: Downstream code search confirms no external clients reference the symbol;
  // delete the obsolete method, unused forward declaration, or old type alias directly
  // without leaving transitional shims or deprecation stubs.
  ```
include_glob:
- include/**
- modules/**/include/**
triggers:
- (?://|/\*)\s*(?:TODO.*?)?(?i:deprecated|will be removed|remove once)
- (?:#|//)\s*TODO.*?\b(?i:remove|deprecat|legacy|dependenc)
- \b(?:bool|void|int|float|double|size_t|SkScalar|[A-Za-z0-9_]+[*&]?)\s+[a-z][A-Za-z0-9_]*\s*\([^)]*\)\s*(?:const\s*)?\{\s*(?:return\s+[^;]*;)?\s*\\}
- \b(?:using|typedef)\s+[A-Za-z0-9_]+
- ^#\s*define\s+[A-Za-z0-9_]+\b
- \bSK_SUPPORT_LEGACY_[A-Za-z0-9_]+
- \bwill be (?:removed|deleted|deprecated)\b
citations:
- path: site/docs/dev/contrib/style.md
  heading: Folder Organiziation
  quote: Skia's public API should live in the `include` directory. Skia's private headers and implementation
    files should live in the `src` directory.
- path: site/docs/dev/chrome/changes.md
  heading: Chrome changes
  quote: If your change modifies the Skia API, you may also need to land a change in Chromium.
- path: site/docs/dev/contrib/style.md
  heading: Files
  quote: Headers that aren't meant for public consumption should be placed in src directories so that
    they aren't in a client's search path, or in include/private if they need to be used by public headers.
confidence: 0.98
support_cl_count: 3
