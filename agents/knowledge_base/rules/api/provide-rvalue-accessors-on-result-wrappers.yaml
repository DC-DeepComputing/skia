id: api/provide-rvalue-accessors-on-result-wrappers
title: When defining value accessors on result, container, or wrapper types, provide rvalue-qualified
  overloads or move-out methods to avoid copying temporaries
polarity: do
severity: should_fix
rubric: safety
rule: When defining value accessors on custom wrapper, container, or result types, provide rvalue-qualified
  overloads (such as T&& value() && or T&& operator*() &&) or explicit move-out methods (such as take())
  alongside const& accessors. Do not expose only const T& accessors when callers may need to extract values
  from temporary or rvalue instances.
why: Exposing only const lvalue accessors forces callers extracting data from rvalues or temporaries to
  perform deep copies. For reference-counted objects (such as sk_sp<T> or SkBitmap), this causes unnecessary
  atomic refcount churn, and for move-only types (such as std::unique_ptr<T>), it prevents value extraction
  entirely.
examples:
- |-
  Bad:

  ```cpp
  template <typename T, typename E>
  class SkResult {
  public:
      // Bad: Only provides const lvalue accessor; callers cannot move out of temporaries.
      const T& value() const {
          SkASSERT(this->has_value());
          return std::get<T>(fStorage);
      }
  };
  ```

  Good:

  ```cpp
  template <typename T, typename E>
  class SkResult {
  public:
      // Good: Provides both const& and && overloads to allow moving from temporaries.
      const T& value() const& {
          SkASSERT(this->has_value());
          return std::get<T>(fStorage);
      }
      T&& value() && {
          SkASSERT(this->has_value());
          return std::get<T>(std::move(fStorage));
      }
  };
  ```
include_glob:
- include/**
- src/**
triggers:
- \bconst\s+[A-Za-z0-9_:]+&\s+(?:value|get)\s*\([^)]*\)\s*const
- \b(?:value|get)\s*\([^)]*\)\s*(?:const\s*)?&{1,2}
- \boperator\s*\*\s*\([^)]*\)\s*(?:const\s*)?&&
- \b(?:take|take_value|extract)\s*\([^)]*\)
- \bclass\s+(?:SK_API\s+)?(?:Sk)?[A-Za-z0-9_]*(?:Result|Optional|StatusOr)\b
confidence: 0.9
support_cl_count: 1
