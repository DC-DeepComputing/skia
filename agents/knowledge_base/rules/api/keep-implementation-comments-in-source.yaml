id: api/keep-implementation-comments-in-source
title: When documenting classes, APIs, or methods in headers, keep comments caller-facing and contract-focused,
  omitting temporal refactoring notes and internal mechanics
polarity: do
severity: should_fix
rubric: readability
rule: When documenting classes, functions, constants, or types in headers (under include/ and src/), keep
  header comments caller-facing, concise, and focused on interface contracts, caller-observable guarantees
  (such as heuristic query behavior or qualifying capability checks), and preconditions. Do not leak internal
  implementation details or temporal refactoring notes (such as 'now writing to...'); keep internal architecture
  overviews, helper mechanics, fallback rationale, backend-specific driver extensions or hardware caps,
  and internal implementation TODOs in source files (.cpp) adjacent to definitions. When an exposed API
  is experimental, warn callers with client-facing comments on the declaration rather than internal notes.
why: Header files define external and subsystem interface contracts and should remain concise, stable,
  and discoverable for callers without leaking private encapsulation details, transient refactoring notes,
  or backend driver mechanics. Placing internal architecture, driver extension details, fallback rationale,
  and implementation TODOs in .cpp files keeps internal notes adjacent to code definitions while ensuring
  public headers convey clean caller contracts.
examples:
- |-
  Bad:

  ```cpp
  // In src/gpu/graphite/PipelineData.h (leaking temporal refactoring note on public method):
  // Mimic the type-safe API available in UniformManager, now writing to a single manager.
  template <typename T> void write(const T& t) { fUniformManager.write(t); }

  // In include/gpu/graphite/Context.h (cluttering public doc comments with backend driver mechanics):
  /**
   * For Vulkan implementations, returns true if pipeline cache data could have changed.
   * VK_EXT_pipeline_creation_cache_control eliminates false positives when enabled.
   */
  bool hasNewPipelineCacheData() const;

  // In include/gpu/graphite/Context.h (internal implementation TODO on public API declaration):
  void endCapture(); // TODO (b/412351769): return something on endCapture
  ```

  Good:

  ```cpp
  // In src/gpu/graphite/PipelineData.h (clean interface contract without refactoring history):
  // Mimic the type-safe API available in UniformManager
  template <typename T> void write(const T& t) { fUniformManager.write(t); }

  // In include/gpu/graphite/Context.h (clean contract with caller-observable guarantees):
  /**
   * Returns true if pipeline cache data could have changed since the last sync.
   * When `canDetectNewPipelineCacheData` returns true, false positives are greatly reduced.
   */
  bool hasNewPipelineCacheData() const;

  // In include/gpu/graphite/Context.h (client-facing warning on public declaration):
  /*
   * TODO (b/412351769): Do not use startCapture() or endCapture(); feature is under development.
   */
  void startCapture();
  ```
include_glob:
- include/**
- src/**
- modules/**/include/**
triggers:
- (?:\\/\\/|\*).*\b(?:is implemented as|implemented as|architecture overview|internal architecture)\b
- (?:\\/\\/|\*).*\b(?:internal (?:helper|mechanics|details?)|anonymous namespace|translation unit)\b
- (?:\\/\\/|\*).*\b(?:fallback (?:rationale|behavior|choice)|only potential affect|not impact how)\b
- (?:\\/\\/|\*).*\b(?:VulkanCaps|SKP capture|SPIR-V|SpirvTransformer|VK_EXT_|VK_KHR_|GL_|MTL|false[- ]positives?)\b
- (?:\\/\\/|\*).*\bTODO\b.*\b(?:under development|do not use|in-development|experimental|return|implement|internal|cleanup|refactor)\b
- (?:\\/\\/|\*).*\b(?:now (?:writing|using|calling|doing|handling|storing)|previously|migrated to|refactored
  to)\b
- \bclass\s+[A-Za-z0-9_]+(?:Transformer|Helper|Handler|Processor|Pass|Builder)\b
- \b(?:static\s+const|constexpr)\s+[A-Za-z0-9_:]+\s+k[A-Z]\w*\s*=
