id: api/prefer-std-string-over-skstring-in-headers
title: When declaring string-returning methods in headers that already include <string>, return std::string
  instead of forward-declaring or including SkString
polarity: do
severity: nit
rubric: readability
rule: In header files that already `#include <string>`, prefer returning or using `std::string` rather
  than forward-declaring or including `SkString`. Avoid introducing redundant custom string dependencies
  or forward declarations when standard string is already part of the header's interface.
why: When a header already includes standard `<string>`, using `std::string` avoids pulling in an unnecessary
  dependency or forward declaration for `SkString`. This keeps header interfaces aligned with standard
  C++ vocabulary types and reduces header coupling.
examples:
- |-
  Bad:

  ```cpp
  #include <string>

  class SkString;

  struct VulkanYcbcrConversionInfo {
      SkString toString() const;
  };
  ```

  Good:

  ```cpp
  #include <string>

  struct VulkanYcbcrConversionInfo {
      std::string toString() const;
  };
  ```
include_glob:
- include/**
- modules/**/include/**
triggers:
- \b(?:class|struct)\s+SkString\s*;
- \bSkString\s+[A-Za-z0-9_]+\s*[(]
- ^#include\s+[<"](?:include/core/)?SkString\.h[>"]
- \b(?:std::string|SkString)\s+(?:toString|description|dump|name)\s*[(]
confidence: 0.8
support_cl_count: 1
