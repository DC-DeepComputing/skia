id: api/avoid-unsupported-compiler-fallbacks
title: When writing compiler feature or attribute preprocessor guards, do not add fallback branches for
  toolchains older than Skia's supported compiler baseline
polarity: dont
severity: should_fix
rubric: design
rule: Do not add compatibility workarounds or fallback preprocessor branches for compiler versions older
  than Skia's minimum supported toolchain baseline. When checking when a compiler attribute or feature
  became available, verify the initial major release where it was introduced (such as GCC 8.0) rather
  than relying on point releases shown in online documentation (such as GCC 8.5).
why: Carrying workaround code and fallback branches for compiler versions older than Skia's supported
  baseline adds unnecessary code complexity and maintenance burden. Relying on online compiler documentation
  indices can mislead developers into assuming a feature was added in a late point release when it was
  actually supported since the initial series release.
examples:
- |-
  Bad:

  ```cpp
  #if __has_attribute(no_sanitize)
    // GCC documentation lists 8.5, but 8.0 introduced no_sanitize
    #define SK_NO_SANITIZE(A) SK_ATTRIBUTE(no_sanitize(A))
  #elif __has_attribute(no_sanitize_undefined)
    // Fallback for GCC <= 7.5, which is older than Skia's supported baseline
    #define SK_NO_SANITIZE(A) SK_ATTRIBUTE(no_sanitize_undefined)
  #else
    #define SK_NO_SANITIZE(A)
  #endif
  ```

  Good:

  ```cpp
  #if __has_attribute(no_sanitize)
    // GCC >= 8.0 and Clang support no_sanitize; no fallback needed for older GCC
    #define SK_NO_SANITIZE(A) SK_ATTRIBUTE(no_sanitize(A))
  #else
    #define SK_NO_SANITIZE(A)
  #endif
  ```
include_glob:
- include/**
triggers:
- __has_attribute\(
- __has_builtin\(
- __has_feature\(
- __has_cpp_attribute\(
- \b(?:__GNUC__|__clang_major__|_MSC_VER)\b
- \bSK_ATTRIBUTE\(
- \bSK_NO_SANITIZE\b
citations:
- path: site/docs/user/build.md
  heading: Supported and Preferred Compilers
  quote: Skia makes use of C++20 language features (compiles with `-std=c++20` flag) and thus requires
    a C++20 compatible compiler.
confidence: 0.9
support_cl_count: 1
