id: api/qualify-performance-claims-in-option-docs
title: When documenting client-facing configuration options or optimization flags in public headers, qualify
  performance claims conditionally and specify which workloads benefit
polarity: do
severity: should_fix
rubric: readability
rule: When documenting client-facing configuration options, options structs, or optimization flags in
  public headers, qualify performance claims (e.g., 'may improve performance') rather than promising unconditional
  gains. Explicitly describe the specific workloads, conditions, or internal mechanisms (such as text
  rendering, atlasing, or resource reuse) that actually benefit.
why: Unconditional performance claims on client-facing configuration flags mislead API consumers whose
  workloads (such as compositors that do not render text or rely on internal atlasing) see no benefit
  or might even incur overhead. Specifying both the conditional nature of the optimization and the workloads
  that benefit allows callers to make informed configuration decisions.
examples:
- |-
  Bad:

  ```cpp
  // If Recordings are replayed in the order they are recorded, then Graphite can
  // make certain assumptions that allow for better performance. Otherwise we have to flush some
  // caches at the start of each Recording to ensure that they can be played back properly.
  std::optional<bool> fRequireOrderedRecordings;
  ```

  Good:

  ```cpp
  // If Recordings are known to be played back in the order they are recorded, then Graphite
  // may be able to make certain assumptions that improve performance. This is often the case
  // if the content being drawn triggers the use of internal atlasing in Graphite (e.g. text).
  std::optional<bool> fRequireOrderedRecordings;
  ```
include_glob:
- include/**
triggers:
- \bstd::optional<bool>\s+f[A-Z]\w*\b
- \b(?:fRequire|fEnable|fDisable|fAllow|fUse|fOptimize)[A-Z]\w*\b
- \b(?:struct|class)\s+[A-Za-z0-9_]*(?:Options|Descriptor|Config|Settings)\b
- (?://|/\*|\*).*?\b(?:improve performance|better performance|allows? for better)\b
- (?://|/\*|\*).*?\b(?:performance|speedup|faster)\b.*\b(?:assumptions?|atlasing|caching|workload)\b
confidence: 0.9
support_cl_count: 1
