id: api/use-primary-extension-for-decoder-id
title: When defining SkCodecs::Decoder registration descriptors, set the format ID to the primary lowercase
  filename extension rather than implementation-specific prefixes
polarity: do
severity: should_fix
rubric: readability
rule: In `SkCodecs::Decoder` definitions, set the decoder `id` field to the format's primary lowercase
  filename extension (such as `"ico"`, `"png"`, `"bmp"`, or `"jpeg"`) rather than prefixing it with implementation
  details like `"rust_"`.
why: Per the convention documented in `include/codec/SkCodec.h`, decoder IDs should be all lowercase letters
  matching the primary filename extension. `SkCodecs::Register()` uses this ID to replace existing decoders
  for that format in the registration list, and `SkCodecs::HasDecoder()` queries decoders by format ID;
  adding backend or language prefixes breaks this replacement mechanism and consistency across decoders.
examples:
- |-
  Bad:

  ```cpp
  inline constexpr SkCodecs::Decoder Decoder() {
      return { "rust_ico", IsIco, Decode };
  }
  ```

  Good:

  ```cpp
  inline constexpr SkCodecs::Decoder Decoder() {
      return { "ico", IsIco, Decode };
  }
  ```
include_glob:
- include/codec/**
- experimental/**
- src/codec/**
- '**/*Decoder.h'
triggers:
- \bSkCodecs::Decoder\b
- \binline\s+constexpr\s+SkCodecs::Decoder\b
- \bDecoder\s*[(]\s*[)]\s*\{?
- '[\"''](?:rust_|lib)?[a-z0-9_]+[\"'']\s*,\s*Is[A-Z]\w*'
- \bSkCodecs::(?:Register|HasDecoder)\b
citations:
- path: RELEASE_NOTES.md
  heading: Milestone 115
  quote: Clients are free to specify their own, either supplementing the existing set or using a custom
    version instead of the one previously provided by default by Skia. See `SkCodecs::Decoder` for the
    necessary data to provide when using a custom decoder (in `include/codec/SkCodec.h`).
confidence: 0.9
