id: api/name-composite-types-after-combined-roles
title: When naming composite types or type aliases bundling multiple components, name them after combined
  roles rather than generic *Helpers suffixes
polarity: do
severity: should_fix
rubric: readability
rule: Name composite types, structs, and type aliases after the specific roles, capabilities, or data
  components they bundle together (e.g., KeyAndDataBuilder). Do not use vague, generic catch-all suffixes
  like *Helper or *Helpers (such as KeyContextHelpers) that obscure the bundled responsibilities.
why: Generic suffixes like *Helper or *Helpers obscure the concrete responsibilities and types grouped
  into an abstraction. Descriptively naming composite types after their constituent roles makes their
  purpose self-documenting at declarations, member access sites, and storage containers.
examples:
- |-
  Bad:

  ```cpp
  // Vague catch-all *Helpers suffix obscures the two bundled roles
  using KeyContextHelpers = std::pair<PipelineDataGatherer, PaintParamsKeyBuilder>;
  ```

  Good:

  ```cpp
  // Explicitly named after the combined data gathering and key building roles
  using KeyAndDataBuilder = std::pair<PipelineDataGatherer, PaintParamsKeyBuilder>;
  ```
include_glob:
- include/**
- src/**
triggers:
- \busing\s+[A-Za-z0-9_]*(?:Helper|Helpers)\b
- \b(?:struct|class)\s+[A-Za-z0-9_]*(?:Helper|Helpers)\b
- \busing\s+[A-Za-z0-9_]+\s*=\s*(?:std::)?(?:pair|tuple)<
- \bKey(?:AndDataBuilder|ContextHelpers)\b
- \bstd::pair<PipelineDataGatherer,\s*PaintParamsKeyBuilder>
confidence: 0.9
support_cl_count: 1
