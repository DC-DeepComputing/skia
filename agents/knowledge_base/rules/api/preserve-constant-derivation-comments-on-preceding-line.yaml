id: api/preserve-constant-derivation-comments-on-preceding-line
title: When hardcoding constants derived from non-constexpr formulas or external limits, place derivation
  comments on the preceding line rather than deleting them to satisfy line-length limits
polarity: do
severity: should_fix
rubric: readability
rule: When a constant must be hardcoded (such as to avoid circular header dependencies or non-constexpr
  expressions), document its derivation, formula, or relationship to other constants in an explanatory
  comment. If a trailing inline comment exceeds or approaches the project's 100-column line-length limit,
  place the comment on the line immediately preceding the declaration rather than deleting it or leaving
  an overlong line.
why: Hardcoded numeric constants obscure the mathematical relationships or cross-component limits they
  represent. Preserving the derivation formula in a preceding comment maintains essential context for
  future maintenance while cleanly respecting Skia's 100-column line-wrapping convention.
examples:
- |-
  Bad:

  ```cpp
  // Bad: deleting derivation comment, or leaving an overlong trailing inline comment:
  static constexpr Index kInvalidIndex = 4096;

  // or:
  static constexpr Index kInvalidIndex = 4096; // 1 << SkNextLog2_portable(DrawList::kMaxRenderSteps);
  ```

  Good:

  ```cpp
  // Good: place the derivation comment on the preceding line to preserve context and stay within column limits:
  // 1 << SkNextLog2_portable(DrawList::kMaxRenderSteps);
  static constexpr Index kInvalidIndex = 4096;
  ```
include_glob:
- include/**
- src/**
triggers:
- \b(?:static\s+)?constexpr\s+[A-Za-z0-9_:]+\s+k[A-Z]\w*\s*=\s*[0-9]
- \b(?:static\s+)?constexpr\s+[A-Za-z0-9_:]+\s+k[A-Z]\w*\s*=.*;\s*//
- //.*\b(?:1\s*<<|SkNextLog2|sizeof|alignof|kMax[A-Z]\w*|formula|derived from)\b
- \b(?:static\s+)?const(?:expr)?\s+[A-Za-z0-9_:]+\s+kInvalid[A-Z]\w*\s*=
- \bk[A-Z]\w*\s*=\s*(?:[0-9]+|0x[0-9a-fA-F]+)\s*;\s*//
- //.*\b(?:circular dependency|non-constexpr|hardcoded|derivation|corresponds to)\b
citations:
- path: site/docs/dev/contrib/style.md
  heading: Files
  quote: We wrap lines at 100 columns unless it is excessively ugly (use your judgement).
confidence: 0.9
support_cl_count: 1
