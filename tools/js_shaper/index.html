<!DOCTYPE html>
<html lang="en">
<head>
    <title>This is a proposal for javascript text shaper</title>
    <style>
        label {
          display: inline-block;
          width: 150px;
          text-align: right;
        }
        th, td {
            text-align: left;
            vertical-align: center;
        }
    </style>
    <script src="api.js"></script>
</head>
<body>
    <div class="form" style="font-size: 20px; width:100%;">
        <div style="display: flex; align-items: center;">
            <label for="textStyle">Font style:</label>
            <input type="text" id="textStyle" style="font-size: 20px; width:100%;" value="font: italic bold 20px 'Roboto';" onchange="getShapingInfo()" />
        </div>
        <br/>
        <div style="display: flex; align-items: center;">
            <label for="textInput">Text to shape:</label>
            <input type="text" id="textInput" style="font-size: 20px; width:100%;" value="OK சரி সব ভালো બધા સારા 문제 없다 大丈夫 🐕‍🦺" onchange="getShapingInfo()" />
        </div>
    </div>
    <div id="result" style="font-size: 20px; width:100%;">
            <div id="measurement"></div>
            <div id="text"></div>
            <div id= "table">
                <table border="1">
                    <thead>
                        <tr>
                            <th scope="col">Type</th>
                            <th scope="col">Text</th>
                            <th scope="col">Left</th>
                            <th scope="col">Top</th>
                            <th scope="col">Right</th>
                            <th scope="col">Bottom</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                    </tbody>
                </table>
            </div>
    </div>
    <script>
        function getShapingInfo() {
            let shaper = new Shaper();
            shaper.addText(document.getElementById("textInput").value, document.getElementById("textStyle").value);
            shaper.layout(window.innerWidth);
            document.getElementById("measurement").innerHTML = "Entire text (l,t,w,h): (" +
                shaper.measurement().left.toFixed(2) + ", " +
                shaper.measurement().top.toFixed(2) + " " +
                shaper.measurement().right.toFixed(2) + ", " +
                shaper.measurement().height.toFixed(2) +
                ")";
            shaper.printText();
        }
    </script>
</body>
</html>
