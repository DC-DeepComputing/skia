<!DOCTYPE html>
<html lang="en">
<head>
    <title>This is a proposal for javascript text shaper</title>
    <script>
        function includeHTML() {
            var z, i, elmnt, file, xhttp;
            /* Loop through a collection of all HTML elements: */
            z = document.getElementsByTagName("*");
            for (i = 0; i < z.length; i++) {
                elmnt = z[i];
                /*search for elements with a certain atrribute:*/
                file = elmnt.getAttribute("w3-include-html");
                if (file) {
                    /* Make an HTTP request using the attribute value as the file name: */
                    xhttp = new XMLHttpRequest();
                    xhttp.onreadystatechange = function() {
                        if (this.readyState == 4) {
                            if (this.status == 200) {elmnt.innerHTML = this.responseText;}
                            if (this.status == 404) {elmnt.innerHTML = "Page not found.";}
                            /* Remove the attribute, and call this function once more: */
                            elmnt.removeAttribute("w3-include-html");
                            includeHTML();
                            showInfo();
                        }
                    }
                    xhttp.open("GET", file, true);
                    xhttp.send();
                    /* Exit the function: */
                    return;
                }
            }
        }
    </script>
    <style>
        label {
          display: inline-block;
          width: 200px;
          text-align: right;
        }
        th, td {
            text-align: left;
            vertical-align: center;
        }
        span.word {
            word-break: keep-all;
        }
        span.word:nth-child(2n) {
            text-decoration: darkred overline;
        }
        span.word:nth-child(2n+1) {
            text-decoration: darkblue underline;
        }
        span.grapheme {
            color: yellow;
        }
        span.grapheme:nth-child(2n) {
            color: red;
        }
        span.grapheme:nth-child(2n+1) {
            color: blue;
        }
        div table tbody tr.line, tr.grapheme, tr.word, tr.run, tr.whitespaces {
            display: none;
        }
        #showGraphemes:checked { ~ div table tbody tr.grapheme { display: table-row; } }
        #showWords:checked { ~ div table tbody tr.word { display: table-row; } }
        #showWhitespaces:checked { ~ div table tbody tr.whitespaces { display: table-row; } }
        #showTextRuns:checked { ~ div table tbody tr.run { display: table-row; } }
        #showLines:checked { ~ div table tbody tr.line { display: table-row; } }
    </style>
    <script src="api.js"></script>
</head>
<body>
    <div class="form" style="font-size: 20px; width:100%;">
        <div style="display: flex; align-items: center;">
            <label for="textStyle">Font style:</label>
            <input type="text" id="textStyle" style="font-size: 20px; width:100%;" value="font: italic bold 20px 'Roboto';" onchange="showInfo()" />
        </div>
        <br/>
        <div id="textInput" style="font-size: 20px; width:100%;" w3-include-html="generated/text01.html" style="float: left; font-size: 20px; width:100%;"></div>
    </div>

    <div id="div" style="font-size: 20px; width:100%; left: 0px; right: 0px;"></div>
    <div id="result" style="float: left; font-size: 20px; width:50%;">
        <div id="measurement"></div>
        <div id="text"></div>

        <br><label for="showGraphemes">Show graphemes</label>
        <input type="checkbox" id="showGraphemes" name="graphemes" checked></input>
        <br><label for="showWords">Show words</label>
        <input type="checkbox" id="showWords" name="words" checked></input>
        <br><label for="showTextRuns">Show text runs</label>
        <input type="checkbox" id="showTextRuns" name="textRuns" checked></input>
        <br><label for="showLines">Show lines</label>
        <input type="checkbox" id="showLines" name="lines" checked></input>

        <div style="display: flex; width:100%;">
            <table border="1" id= "table" style="float: left; font-size: 20px; width:100%; background-color: lightcyan">
                <thead>
                <tr>
                    <th scope="col">Type</th>
                    <th scope="col">Text</th>
                    <th scope="col">Left</th>
                    <th scope="col">Top</th>
                    <th scope="col">Right</th>
                    <th scope="col">Bottom</th>
                </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <table border="1" style="float: left; font-size: 20px; margin-left: 10px; background-color: aliceblue">
                <thead>
                <tr>
                    <th scope="col">Type</th>
                    <th scope="col">Text</th>
                    <th scope="col">Left</th>
                    <th scope="col">Top</th>
                    <th scope="col">Right</th>
                    <th scope="col">Bottom</th>
                </tr>
                </thead>
                <tbody w3-include-html="generated/skia01.html"></tbody>
            </table>
        </div>
    </div>
    <script>
        includeHTML();
    </script>
    <script>
        function collectInfo() {
            window.shaper = new Shaper();
            window.shaper.addText(document.getElementById("textInput").innerText, document.getElementById("textStyle").value);
            window.shaper.layout(window.innerWidth);
            document.querySelector("label[for='showGraphemes']").innerText = "Show graphemes (" + this.shaper.graphemes.length + ")";
            document.querySelector("label[for='showWords']").innerText = "Show words (" + this.shaper.words.length + ")";
            document.querySelector("label[for='showTextRuns']").innerText = "Show text runs (" + this.shaper.glyphRuns.length + ")";
            document.querySelector("label[for='showLines']").innerText = "Show lines (" + this.shaper.shapedLines.length + ")";
        }

        function showInfo() {
            if (window.shaper === undefined) {
                collectInfo();
                window.shaper.printTable();
            }
        }
    </script>
</body>
</html>
