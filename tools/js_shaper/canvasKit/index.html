<!DOCTYPE html>
<title>CanvasKit Paragraph (with & without ICU)</title>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script type="text/javascript" src="../../../modules/canvaskit/build/canvaskit.js"></script>

<style>
  canvas {
    border: 1px dashed #AAA;
  }
  #sampleText {
    width: 400px;
    height: 200px;
  }
</style>

<textarea id="sampleText">A very simple text</textarea>
<canvas id="withICU" width=600 height=600></canvas>

<script type="text/javascript" charset="utf-8">
  function Paragraph() {
    if (!CanvasKit || !fonts) {
      throw new Error('CanvasKit or fonts not loaded');
    }

    const fontMgr = CanvasKit.FontMgr.FromData(fonts);

    const paraStyle = new CanvasKit.ParagraphStyle({
      textStyle: {
        color: CanvasKit.BLACK,
        fontFamilies: fontFamilies,
        fontSize: 50,
      },
      textAlign: CanvasKit.TextAlign.Left,
      maxLines: 4,
    });

    const builder = CanvasKit.ParagraphBuilder.Make(paraStyle, fontMgr);
    builder.addText(sampleText);
    const paragraph = builder.build();

    paragraph.layout(wrapTo);

    const lines = paragraph.getShapedLines();

    paragraph.delete();
    fontMgr.delete();
    builder.delete();

    return paragraph;
  }

  var CanvasKit = null;
  var fonts = null;
  var sampleText = null;

  var cdn = 'https://storage.googleapis.com/skia-cdn/misc/';
  const ckLoaded = CanvasKitInit({locateFile: (file) => '../../../modules/canvaskit/build/'+file});

  const loadFonts = [
    fetch(cdn + 'Roboto-Regular.ttf').then((response) => response.arrayBuffer()),
  ];

  const fontFamilies = [
    'Roboto',
  ];

  Promise.all([ckLoaded, ...loadFonts]).then(([_CanvasKit, ..._fonts]) => {
    CanvasKit = _CanvasKit;
    fonts = _fonts;
    Paragraph();
  });
</script>
