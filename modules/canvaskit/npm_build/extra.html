<!DOCTYPE html>
<title>CanvasKit for SkParagraph6</title>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  canvas {
    border: 1px dashed #AAA;
  }
</style>

<h2> Paragraph </h2>
<canvas id=para1 width=600 height=600></canvas>

<script type="text/javascript" src="/build/canvaskit.js"></script>

<script type="text/javascript" src="textapi_utils.js"></script>

<script type="text/javascript" charset="utf-8">

  var CanvasKit = null;
  var cdn = 'https://storage.googleapis.com/skia-cdn/misc/';

  const ckLoaded = CanvasKitInit({locateFile: (file) => '/build/'+file});

  const loadFont = fetch(cdn + 'Roboto-Regular.ttf').then((response) => response.arrayBuffer());

  Promise.all([ckLoaded, loadFont]).then((results) => {
    ParagraphAPI1(...results);
  });

  function ParagraphAPI1(CanvasKit, fontData) {
    if (!CanvasKit || !fontData) {
      return;
    }

    const surface = CanvasKit.MakeCanvasSurface('para1');
    if (!surface) {
      console.error('Could not make surface');
      return;
    }

    const fontMgr = CanvasKit.FontMgr.FromData([fontData]);

    const paraStyle = new CanvasKit.ParagraphStyle({
        textStyle: {
            color: CanvasKit.BLACK,
            fontFamilies: ['Roboto'],
            fontSize: 50,
        },
        textAlign: CanvasKit.TextAlign.Left,
        maxLines: 5,
    });

    const builder = CanvasKit.ParagraphBuilder.Make(paraStyle, fontMgr);
    builder.addText('The quick brown fox ate a hamburgerfons and got sick.');
    const paragraph = builder.build();

    const text = builder.getText();

    const bidis = CanvasKit.Malloc(Uint32Array, 3);
    bidis.toTypedArray().set([0, text.length, 0]);

    const words = CanvasKit.Malloc(Uint32Array, 2);
    words.toTypedArray().set([0, text.length]);

    const graphemes = CanvasKit.Malloc(Uint32Array, text.length);
    let graphemesArr = graphemes.toTypedArray();
    for (let i = 0; i < text.length; i++) {
        graphemesArr[i] = i;
    }

    const softBreaks = CanvasKit.Malloc(Uint32Array, 0);
    //softBreaks.toTypedArray().set([text.length]);

    const hardBreaks = CanvasKit.Malloc(Uint32Array, 0);

    const paragraph1 = builder.buildWithClientInfo(
        bidis,
        words,
        graphemesArr,
        softBreaks,
        hardBreaks
    );

    surface.drawOnce((canvas) => {
      canvas.clear(CanvasKit.WHITE);
      paragraph1.layout(600);
      canvas.drawParagraph(paragraph1, 0, 0);
    });

    return surface;
  }

</script>
