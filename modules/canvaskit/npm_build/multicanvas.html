<!DOCTYPE html>
<title>CanvasKit (Skia via Web Assembly)</title>
<meta charset="utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  canvas, img {
    border: 1px dashed #AAA;
  }

</style>

<canvas id=api1 width=600 height=600></canvas>

<script type="text/javascript" src="/build/canvaskit.js"></script>
<script type="text/javascript" charset="utf-8">
  const cdn = 'https://storage.googleapis.com/skia-cdn/misc/';

  const ckLoaded = CanvasKitInit({locateFile: (file) => '/build/'+file});
  const loadTestImage = fetch(cdn + 'test.png').then((response) => response.arrayBuffer());
  const imageEle = document.getElementById("src");

  Promise.all([ckLoaded]).then((results) => {
    ContextSharingExample(results[0]);
  });

  function ContextSharingExample(CanvasKit) {
    async function decodeImageFromBuffer(data, contentType, width, height) {
      const imageDecoder = new ImageDecoder({
        type: contentType,
        data,
        premultiplyAlpha: "premultiply",
        desiredWidth: width,
        desiredHeight: height,
        colorSpaceConversion: 'default',
      });
      const {
        image,
        complete,
      } = await imageDecoder.decode();
      console.log(image);

      imageDecoder.close();

      if (!complete) {
        throw new Error('Image decoding failed');
      }
      return image;
    }


    const surface = CanvasKit.MakeCanvasSurface("api1");
    if (!surface) {
      throw 'Could not make surface';
    }

    async function run() {
      console.log('run');
      const images = await Promise.all([
        "https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png",
        "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Wikipedia-logo-v2-en.svg/1200px-Wikipedia-logo-v2-en.svg.png",
        "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ab/Coat_of_arms_of_Canada_%281921-1957%29.svg/774px-Coat_of_arms_of_Canada_%281921-1957%29.svg.png",
        //"https://upload.wikimedia.org/wikipedia/commons/4/47/PNG_transparency_demonstration_1.png",
        //"https://upload.wikimedia.org/wikipedia/commons/thumb/b/b3/Wikipedia-logo-v2-en.svg/1200px-Wikipedia-logo-v2-en.svg.png",
      ].map(async (url, idx) => {
        console.log(`index ${idx} loaded`);
        const buffer = await fetch(url).then((response) => response.arrayBuffer());
        const image = await decodeImageFromBuffer(buffer, "image/png");
        console.log(image);
        const canvasKitImage = surface.makeImageFromTextureSource(image, {
          alphaType: CanvasKit.AlphaType.Premul,
          colorType: CanvasKit.ColorType.RGBA_8888,
          height: image.displayHeight,
          width: image.displayWidth,
        });
        return {
          canvasKitImage,
          height: image.displayHeight,
          width: image.displayWidth,
        }
      }));
      console.log("About to start drawing!!!", images);

      const paint = new CanvasKit.Paint();
      paint.setColor(CanvasKit.RED);
      paint.setStyle(CanvasKit.PaintStyle.Stroke);
      function tick(canvas) {
        //surface.requestAnimationFrame(tick);

        let img = images[0];
        // canvas.drawImageRectOptions(
        //     img.canvasKitImage,
        //     // Fit the whole image...
        //     CanvasKit.LTRBRect(0, 0, img.width, img.height),
        //     // ..into this location.
        //     CanvasKit.LTRBRect(0, 0, 100, 100),
        //   CanvasKit.FilterMode.Linear,
        //   CanvasKit.MipmapMode.None,
        // );
        // canvas.drawRect(CanvasKit.LTRBRect(0, 0, 100, 100), paint);
        //
        // img = images[1];
        // canvas.drawImageRectOptions(
        //     img.canvasKitImage,
        //     // Fit the whole image...
        //     CanvasKit.LTRBRect(0, 0, img.width, img.height),
        //     // ..into this location.
        //     CanvasKit.LTRBRect(100, 0, 200, 100),
        //   CanvasKit.FilterMode.Linear,
        //   CanvasKit.MipmapMode.None,
        // );
        // canvas.drawRect(CanvasKit.LTRBRect(100, 0, 200, 100), paint);

        img = images[2];
        canvas.drawImageRectOptions(
            img.canvasKitImage,
            // Fit the whole image...
            CanvasKit.LTRBRect(0, 0, img.width, img.height),
            // ..into this location.
            CanvasKit.LTRBRect(200, 0, 300, 100),
          CanvasKit.FilterMode.Linear,
          CanvasKit.MipmapMode.Linear,
        );
        canvas.drawRect(CanvasKit.LTRBRect(200, 0, 300, 100), paint);
      }
      surface.requestAnimationFrame(tick);
    }
    run();
  }
  // GR_GL_TEXTURE_2D is  0x0DE1 or 3553


</script>
