<svg width="1000" height="500">
    <defs>
        <filter id="ferrari-glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <g transform="translate(15,12)">
        <rect x="50" y="200" width="10" height="10" fill="#ff2800" opacity="0.7" filter="url(#ferrari-glow)"/>
        <rect x="55" y="200" width="10" height="10" fill="#ff2800" opacity="0.7" filter="url(#ferrari-glow)"/>
    </g>
</svg>
